<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E1E2E1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<meta name="description" content="Tus apuntes, a mano y a tu manera.">
<link rel="manifest" href="manifest.webmanifest">

<title>Folia</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Caveat:wght@500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400;1,8..60,700&display=swap">

<body>
<style>
[hidden] { display: none !important; }
/* Igual que la app nativa (iPad y Mac): colores medidos en sus capturas, fuente del sistema, iconos
   de línea, pestañas como las de Chrome y barras blancas (o gris oscuro en modo oscuro). */
:root {
  --strip: #E1E2E1;          /* franja de pestañas */
  --bar: #FFFFFF;            /* barra de herramientas, de opciones y pestaña activa */
  --desk: #EAEBEB;           /* mesa detrás de las páginas */
  --sidebar: #F2F2F2;
  --surface: #FFFFFF;
  --surface-2: #F0F0F0;      /* campos, buscador */
  --fill: rgba(118, 118, 128, .12);   /* grupo de herramientas, segmentos */
  --fill-strong: #DDDDDD;   /* herramienta elegida */
  --seg-thumb: #FFFFFF;
  --ink: #000000;
  --ink-2: rgba(60, 60, 67, .78);
  --muted: rgba(60, 60, 67, .6);
  --line: #D8D8DC;
  --hairline: rgba(0, 0, 0, .12);
  --accent: #007AFF;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(0, 122, 255, .14);
  --danger: #FF3B30;
  --mark: #FFE66B;
  --sep: rgba(0, 0, 0, .22);
  --shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 6px 20px rgba(0, 0, 0, .10);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-body: var(--font);
  --font-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --strip: #161615; --bar: #292828; --desk: #1E1E1E; --sidebar: #252525; --surface: #2C2C2E; --surface-2: #3A3A3C;
    --fill: rgba(118, 118, 128, .24); --fill-strong: #595756; --seg-thumb: #636366; --ink: #FFFFFF; --ink-2: rgba(235, 235, 245, .8);
    --muted: rgba(235, 235, 245, .6); --line: #48484A; --hairline: rgba(255, 255, 255, .1); --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .22);
    --danger: #FF453A; --mark: #8A7420; --sep: rgba(255, 255, 255, .22); --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --strip: #161615; --bar: #292828; --desk: #1E1E1E; --sidebar: #252525; --surface: #2C2C2E; --surface-2: #3A3A3C;
  --fill: rgba(118, 118, 128, .24); --fill-strong: #595756; --seg-thumb: #636366; --ink: #FFFFFF; --ink-2: rgba(235, 235, 245, .8);
  --muted: rgba(235, 235, 245, .6); --line: #48484A; --hairline: rgba(255, 255, 255, .1); --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .22);
  --danger: #FF453A; --mark: #8A7420; --sep: rgba(255, 255, 255, .22); --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bar); color: var(--ink); font: 15px/1.4 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; font-weight: 600; }
#app { height: 100%; display: flex; flex-direction: column; }
.hidden-stage { position: fixed; left: -20000px; top: 0; pointer-events: none; }
svg { display: block; }

/* ---------- Barras y botones ---------- */
.bar { background: var(--bar); display: flex; align-items: center; gap: 6px; padding: 6px 10px; min-height: 48px; flex: none; }
.bar.scroll { overflow-x: auto; scrollbar-width: none; }
.spacer { flex: 1; min-width: 8px; }
.btn { border: 0; background: var(--fill); border-radius: 8px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 14px; }
.btn:hover:not(:disabled) { filter: brightness(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.on { background: var(--accent); color: var(--accent-ink); }
.btn.tinted { color: var(--accent); }
.btn svg { width: 16px; height: 16px; }
/* Botón de icono (como los de la barra nativa: 36×36 y azules). */
.icon-btn { width: 36px; height: 36px; border: 0; background: transparent; border-radius: 9px; display: inline-grid; place-items: center; flex: none; color: var(--accent); padding: 0; }
.icon-btn:hover:not(:disabled) { background: var(--fill); }
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn.plain { color: var(--ink); }
.group { display: flex; gap: 2px; padding: 4px; background: var(--fill); border-radius: 12px; flex: none; }
/* Herramientas: icono del color de la tinta y una barrita debajo; la elegida, con fondo gris. */
.tool { width: 36px; height: 36px; border: 0; background: transparent; border-radius: 9px; display: inline-grid; place-items: center; color: var(--ink); position: relative; padding: 0; flex: none; }
.tool svg { width: 20px; height: 20px; }
.tool.colored svg { transform: translateY(-2px); }
.tool[aria-pressed="true"] { background: var(--fill-strong); }
.tool[aria-pressed="true"] svg { stroke-width: 2.1; }
.tool:hover:not([aria-pressed="true"]) { background: var(--fill); }
.tool .ink-bar { position: absolute; left: 9px; right: 9px; bottom: 4px; height: 4px; border-radius: 2px; background: var(--c); box-shadow: inset 0 0 0 .5px var(--sep); }
.sep { width: 1px; height: 24px; background: var(--line); flex: none; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 0; border-radius: 9px; padding: 7px 10px; width: min(380px, 100%); }
.search input { border: 0; background: transparent; outline: none; width: 100%; text-align: center; font-size: 16px; }
.search input::placeholder { color: var(--muted); }
.search svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search .ghost { width: 20px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 600; color: #fff; background: var(--c, #6B7280); border: 0; white-space: nowrap; }
.chip svg { width: 13px; height: 13px; }
.chip .count { background: rgba(255,255,255,.3); border-radius: 99px; padding: 0 5px; font-size: 10px; }

/* ---------- Biblioteca ---------- */
.lib-header { display: flex; align-items: center; gap: 10px; padding: 24px 14px 4px; background: var(--bar); flex: none; position: relative; }
.lib-header .center { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); width: min(380px, calc(100% - 420px)); }
.lib-header .center .search { width: 100%; }
.round-btn { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--fill); display: grid; place-items: center; color: var(--ink); padding: 0; }
.round-btn svg { width: 22px; height: 22px; }
.pill-group { display: flex; align-items: center; background: var(--fill); border-radius: 22px; height: 44px; padding: 0 4px; }
.pill-group button { width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); border-radius: 22px; padding: 0; }
.pill-group svg { width: 22px; height: 22px; }
.prominent { border: 0; border-radius: 22px; height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; background: var(--accent); color: #fff; }
.prominent.purple { background: #BF5AF2; }
.prominent svg { width: 18px; height: 18px; }
.large-title { font: 700 34px/1.15 var(--font-display); letter-spacing: -.01em; margin: 0; padding: 4px 20px 14px; background: var(--bar); flex: none; }
.library { flex: 1; overflow: auto; padding: 14px 28px 60px; background: var(--bar); }
.library .lede { color: var(--muted); margin: 0 0 20px; max-width: 64ch; font-size: 14px; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, 158px); gap: 26px 28px; }
.card { display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; }
/* Portada: degradado del color (más claro arriba), lomo oscuro y el título en blanco arriba. */
.cover { aspect-ratio: 158 / 210; width: 100%; border: 0; border-radius: 6px; padding: 0; position: relative; overflow: hidden; display: block; text-align: left;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 72%, white), color-mix(in srgb, var(--c) 93%, white)); transition: transform .15s ease, box-shadow .15s ease; }
.cover:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.cover.color::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 12px; background: rgba(0,0,0,.18); }
.cover span { position: absolute; left: 26px; right: 14px; top: 14px; color: #fff; font: 600 17px/1.25 var(--font); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover.page { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--hairline); }
.cover.page img { object-fit: contain; }
.card .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 6px; }
.card .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.card .meta svg { width: 14px; height: 14px; flex: none; }
.card .more { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(0,0,0,.35); color: #fff; display: grid; place-items: center; opacity: 0; transition: opacity .15s; padding: 0; }
.card .more svg { width: 18px; height: 18px; }
.card:hover .more, .card .more:focus-visible, .card .more[aria-expanded="true"] { opacity: 1; }
.badge { font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; background: var(--accent-soft); color: var(--accent); padding: 1px 6px; border-radius: 4px; font-weight: 600; }
.empty { color: var(--muted); padding: 60px 0; text-align: center; }
.results { display: flex; flex-direction: column; gap: 22px; max-width: 760px; }
.results h2 { font: 600 15px var(--font); margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
.results .mini { width: 30px; aspect-ratio: 3 / 4; border-radius: 3px; flex: none; position: relative; overflow: hidden; }
.result { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; border: 0; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
.result:hover { background: var(--fill-strong); }
.result .where { font-size: 12px; color: var(--muted); }
.notice { background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 10px 14px; margin: 0 0 22px; font-size: 13.5px; max-width: 70ch; }

/* La fecha y la hora, arriba a la derecha (en la app nativa van en la barra de título). */
.lib-clock { position: absolute; top: 4px; right: 16px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- Menús, diálogos, avisos (como los del sistema) ---------- */
.popover { position: fixed; z-index: 70; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
  border: 1px solid var(--hairline); border-radius: 12px; box-shadow: 0 10px 34px rgba(0,0,0,.22); padding: 5px; min-width: 220px; max-height: 70vh; overflow: auto; display: flex; flex-direction: column; animation: pop .12s ease-out; }
@keyframes pop { from { opacity: 0; transform: scale(.97); } }
.popover button { border: 0; background: transparent; text-align: left; padding: 6px 10px; border-radius: 7px; display: flex; gap: 10px; align-items: center; font-size: 14px; }
.popover button svg { width: 17px; height: 17px; flex: none; }
.popover button:hover:not(:disabled) { background: var(--accent); color: #fff; }
.popover hr { border: 0; border-top: 1px solid var(--hairline); margin: 5px 6px; }
.popover .label { font-size: 11.5px; color: var(--muted); padding: 6px 10px 2px; font-weight: 600; }
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 60; display: grid; place-items: center; padding: 16px; animation: fade .15s ease-out; }
@keyframes fade { from { opacity: 0; } }
.dialog { background: var(--surface); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 22px; display: flex; flex-direction: column; gap: 16px; animation: rise .2s cubic-bezier(.2,.8,.3,1); }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.dialog.wide { width: min(820px, 100%); }
.dialog h2 { font: 600 18px var(--font); margin: 0; text-align: center; }
.dialog p { margin: 0; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 13px; }
.field input[type="text"], .field select { border: 0; background: var(--surface-2); border-radius: 8px; padding: 9px 11px; font-weight: 400; font-size: 15px; }
.choices { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 0; padding: 0; flex: none; box-shadow: inset 0 0 0 .5px var(--sep); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bar), 0 0 0 4px var(--accent); }
.tpl { border: 0; background: var(--surface-2); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; }
.tpl[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.tpl canvas { border-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 14px; }
.pick-grid button { border: 2px solid transparent; background: transparent; border-radius: 8px; padding: 4px; display: flex; flex-direction: column; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.pick-grid button:hover { border-color: var(--accent); }
.pick-grid img { width: 100%; box-shadow: 0 1px 4px rgba(0,0,0,.18); border-radius: 3px; }
.list-pick { display: flex; flex-direction: column; gap: 4px; max-height: 50vh; overflow: auto; }
.list-pick button { display: flex; gap: 10px; align-items: center; border: 0; background: transparent; text-align: left; padding: 8px; border-radius: 8px; }
.list-pick button:hover { background: var(--fill); }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
/* Control segmentado (como el de Apple). */
.seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; gap: 0; flex: none; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; font-size: 13.5px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.seg button svg { width: 18px; height: 18px; }
.seg button[aria-pressed="true"] { background: var(--seg-thumb); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  color: var(--ink); padding: 10px 18px; border-radius: 999px; z-index: 90; box-shadow: 0 6px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); border: 1px solid var(--hairline); font-size: 14px; animation: rise .2s ease-out; }

/* ---------- Pestañas (como las de Chrome) ---------- */
.tabs { background: var(--strip); display: flex; align-items: flex-end; height: 40px; padding: 0 10px; flex: none; gap: 0; overflow: hidden; }
.tabs .chip { align-self: center; margin: 0 6px; }
.tabs .chip.drop { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab { position: relative; height: 34px; flex: 0 1 220px; min-width: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; font-size: 13px; color: var(--ink-2); border: 0; background: transparent; cursor: default; user-select: none; }
.tab .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .book { width: 13px; height: 13px; color: var(--c); flex: none; }
.tab .x { border: 0; background: transparent; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); padding: 0; flex: none; }
.tab .x svg { width: 12px; height: 12px; stroke-width: 2.5; }
.tab .x:hover { background: var(--fill); }
/* Separador entre pestañas inactivas. */
.tab:not(.active) + .tab:not(.active)::before { content: ""; position: absolute; left: 0; top: 9px; height: 18px; width: 1px; background: var(--sep); }
.tab:not(.active):hover { color: var(--ink); }
.tab:not(.active):hover .hover-bg { display: block; }
.tab .hover-bg { display: none; position: absolute; inset: 4px 3px; border-radius: 8px; background: var(--fill); z-index: -1; }
.tab.active { background: var(--bar); color: var(--ink); font-weight: 500; border-radius: 9px 9px 0 0; z-index: 1; }
/* Las curvitas de abajo que unen la pestaña con la barra. */
.tab.active .foot { position: absolute; bottom: 0; width: 8px; height: 8px; }
.tab.active .foot.l { left: -8px; background: radial-gradient(circle at 0 0, transparent 7.5px, var(--bar) 8px); }
.tab.active .foot.r { right: -8px; background: radial-gradient(circle at 100% 0, transparent 7.5px, var(--bar) 8px); }
.tab .gline { position: absolute; left: 8px; right: 8px; bottom: 0; height: 2.5px; border-radius: 2px; background: var(--g); }
.tab.dragging { opacity: .3; }
.tab.floating { position: fixed; z-index: 80; pointer-events: none; background: var(--bar); border-radius: 9px 9px 0 0; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.tabs .plus { align-self: center; }
.tabs .clock { align-self: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; margin: 0 10px 0 auto; padding-left: 12px; }

/* ---------- Editor ---------- */
.title-input { border: 0; background: transparent; font: 600 17px var(--font); padding: 5px 6px; border-radius: 6px; width: 200px; min-width: 100px; color: var(--ink); text-overflow: ellipsis; }
.title-input:hover, .title-input:focus { background: var(--fill); outline: none; }
.options { background: var(--bar); border-bottom: 1px solid var(--hairline); display: flex; align-items: center; gap: 10px; padding: 6px 14px; min-height: 50px; overflow-x: auto; white-space: nowrap; flex: none; scrollbar-width: none; }
.options .hint { color: var(--muted); font-size: 14px; }
.options select { border: 0; background: transparent; color: var(--accent); font-size: 15px; padding: 5px 4px; }
.menu-btn { border: 0; background: transparent; color: var(--accent); font-size: 15px; display: inline-flex; align-items: center; gap: 4px; padding: 5px 6px; border-radius: 7px; }
.menu-btn svg { width: 16px; height: 16px; }
.menu-btn:hover { background: var(--fill); }
.width-dots { display: inline-flex; align-items: center; gap: 4px; }
.width-dots button { width: 28px; height: 28px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.width-dots button span { border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 .75px var(--sep); display: block; }
.width-dots button[aria-pressed="true"] { background: var(--accent-soft); }
.custom-color { width: 42px; height: 26px; border-radius: 13px; border: 0; padding: 0; box-shadow: inset 0 0 0 .5px var(--sep); position: relative; overflow: hidden; }
.custom-color input { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); border: 0; padding: 0; cursor: pointer; opacity: 0; }
.range { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.range input[type="range"] { width: 140px; accent-color: var(--accent); }
.pill-toggle { border: 0; background: var(--fill); border-radius: 999px; padding: 6px 14px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; }
.pill-toggle svg { width: 17px; height: 17px; }
.pill-toggle[aria-pressed="true"] { background: var(--accent); color: #fff; }
.workspace { flex: 1; display: flex; min-height: 0; border-top: 1px solid var(--hairline); }
.sidebar { width: 240px; flex: none; background: var(--sidebar); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; min-height: 0; }
.sidebar .seg { margin: 12px auto; padding: 3px; border-radius: 12px; }
.sidebar .seg button { padding: 6px 14px; border-radius: 9px; }
.sidebar .body { flex: 1; overflow: auto; padding: 4px 14px 30px; border-top: 1px solid var(--hairline); }
.thumb { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 4px; position: relative; cursor: pointer; }
.thumb img { width: 100%; box-shadow: 0 0 0 1px var(--hairline), 0 1px 4px rgba(0,0,0,.12); border-radius: 3px; background: #fff; border: 3px solid transparent; }
.thumb.current img { border-color: var(--accent); }
.thumb .num { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.thumb.current .num { color: var(--accent); font-weight: 600; }
.thumb .bm { position: absolute; top: 16px; right: 8px; border: 0; background: transparent; padding: 2px; color: var(--muted); }
.thumb .bm[aria-pressed="true"] { color: #FF3B30; }
.thumb .bm svg { width: 17px; height: 17px; }
.outline-row { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.outline-row:hover { background: var(--fill); }
.outline-row.current { background: var(--accent-soft); }
.outline-row .pg { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.outline-row .lvl0 { font-weight: 600; }
.side-empty { color: var(--muted); font-size: 13.5px; text-align: center; padding: 30px 6px; }
.desk { flex: 1; overflow: auto; position: relative; min-width: 0; background: var(--desk); }
.pages { display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 14px 16px 120px; min-width: min-content; }
.page { position: relative; box-shadow: 0 3px 10px rgba(0,0,0,.18); flex: none; }
.page-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
.page-inner > canvas, .page-inner > .bg { position: absolute; inset: 0; }
.page-inner > .bg { width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
.layer { position: absolute; inset: 0; }
.layer.over { pointer-events: none; }
.layer.over > * { pointer-events: auto; }
.ink { touch-action: none; }
/* Modo lápiz (se vio un lápiz): el dedo desplaza la página sobre la tinta; el lápiz no (editor.js, attachPenTouch). */
html.pen-mode .ink { touch-action: pan-x pan-y; }
.page-number { display: none; }
/* Indicador de página abajo en el centro: «‹ 1 / 3 ›». */
.page-indicator { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 12px; padding: 7px 14px;
  border-radius: 999px; background: color-mix(in srgb, var(--surface) 80%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 2px 8px rgba(0,0,0,.15); font-size: 15px; font-variant-numeric: tabular-nums; }
.page-indicator button { border: 0; background: transparent; padding: 0; color: var(--accent); display: grid; place-items: center; }
.page-indicator button:disabled { color: var(--muted); }
.page-indicator svg { width: 16px; height: 16px; stroke-width: 2.2; }
.desk-wrap { flex: 1; display: flex; position: relative; min-width: 0; }
.ribbon { position: absolute; top: 0; right: 36px; width: 28px; height: 46px; background: #FF3B30; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); pointer-events: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
.flash { position: absolute; border-radius: 6px; background: rgba(255, 214, 10, .45); border: 2px solid #FF9500; pointer-events: none; animation: flash 2.6s ease forwards; }
@keyframes flash { 0% { opacity: 0; } 8% { opacity: 1; } 20% { opacity: .4; } 32% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
::highlight(search) { background: rgba(255, 214, 10, .7); }

/* Elementos de la página */
.item { position: absolute; border: 1.5px dashed transparent; border-radius: 3px; }
.item:hover { border-color: rgba(0, 122, 255, .45); }
.item.selected { border-color: #007AFF; }
.item.text, .item.sticky { padding: 6px 8px; cursor: move; }
.rich { outline: none; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.3em; cursor: text; line-height: 1.35; }
.rich img { max-width: 100%; height: auto; vertical-align: bottom; border-radius: 3px; }
.rich a[data-link] { color: #1E5BD8; text-decoration: underline; cursor: pointer; }
.tool-select .rich, .tool-select .item { cursor: move; }
.item.sticky { padding: 16px 14px; box-shadow: 0 3px 6px rgba(0,0,0,.22); border-radius: 0; color-scheme: light; }
/* El post-it no se desplaza nunca a los lados: solo su texto, en vertical y cuando de verdad no cabe. */
.item.sticky .rich { height: 100%; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.item.image img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; }
.item.image { cursor: move; }
.item.link { background: rgba(30, 91, 216, .1); border: 1.5px solid rgba(30, 91, 216, .6); border-radius: 6px; cursor: pointer; }
.item.link .tag { position: absolute; left: -1px; top: -22px; background: #1E5BD8; color: #fff; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.resize { position: absolute; right: -11px; bottom: -11px; width: 22px; height: 22px; border-radius: 50%; background: #007AFF; border: 2px solid #fff; cursor: nwse-resize; display: none; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.item.selected .resize { display: block; }
.item.lassoed .resize { display: none; }
.pin { position: absolute; width: 34px; height: 34px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); cursor: pointer; background: var(--c); }
.pin .name { position: absolute; left: 40px; top: 7px; white-space: nowrap; color: var(--c); font-size: 13px; font-weight: 600; }
.pin.selected { box-shadow: 0 0 0 3px #007AFF; }
.comment-panel { position: absolute; width: 380px; background: #fff; color: #1C1C1E; border-radius: 12px; border: 1.5px solid var(--c); box-shadow: 0 4px 10px rgba(0,0,0,.2); overflow: hidden; }
.comment-panel header { background: var(--c); color: #fff; font-weight: 600; font-size: 14px; padding: 9px 12px; display: flex; align-items: center; gap: 8px; }
.comment-panel header button { margin-left: auto; border: 0; background: transparent; color: #fff; }
.comment-panel .rich { padding: 10px 12px; max-height: 360px; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; min-height: 60px; }
.lasso-box { position: absolute; border: 1.5px dashed #007AFF; background: rgba(0, 122, 255, .06); cursor: move; border-radius: 4px; }
.ink-on .layer.items { pointer-events: none; }
.add-page { border: 2px dashed var(--line); background: transparent; color: var(--muted); border-radius: 10px; padding: 14px 22px; }
.add-page:hover { color: var(--accent); border-color: var(--accent); }
.preview-card { position: fixed; z-index: 55; left: 50%; bottom: 70px; transform: translateX(-50%); width: min(360px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; animation: rise .2s ease-out; }
.preview-card img { width: 100%; max-height: 300px; object-fit: contain; background: var(--surface-2); border-radius: 6px; }
.preview-card .row { display: flex; gap: 8px; align-items: center; }
.resume { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 5; background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(18px); border: 1px solid var(--hairline); box-shadow: var(--shadow); padding: 8px 14px; border-radius: 999px; font-size: 13.5px; pointer-events: none; }
.search-panel { position: fixed; z-index: 55; top: 100px; right: 20px; width: min(380px, calc(100% - 32px)); max-height: calc(100% - 140px); background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; animation: rise .2s ease-out; }
/* Cabecera compacta: campo y ✕ centrados, mismo margen arriba y abajo; los resultados, debajo y solo si los hay. */
.search-panel .sp-head { display: flex; align-items: center; gap: 4px; padding: 10px 8px 10px 12px; }
.search-panel .search { flex: 1; min-width: 0; width: auto; margin: 0; }
.search-panel .search input { text-align: left; min-width: 0; }
.search-panel .search input::-webkit-search-cancel-button { display: none; }
.search-panel .list { overflow: auto; padding: 0 12px 12px; }
.search-panel .list:empty { display: none; }

/* ---------- Modo dinámico ---------- */
.dyn { flex: 1; position: relative; overflow: hidden; background: #0A0C16; color: #fff; }
.dyn canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.dyn .nodes { position: absolute; inset: 0; }
.dnode { position: absolute; width: 150px; margin-left: -75px; margin-top: -62px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; user-select: none; transition: transform .25s; touch-action: none; transform: scale(var(--s, 1)); will-change: left, top, transform; }
.dnode .cover { width: 74px; box-shadow: 0 0 18px var(--glow); }
.dnode .cover span { display: none; }
.dnode .lbl { font-size: 12.5px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.8); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dnode:hover { transform: scale(calc(var(--s, 1) * 1.1)); }
.dnode.sel { transform: scale(calc(var(--s, 1) * 1.28)); }
.dnode.sel .cover { box-shadow: 0 0 0 3px #fff, 0 0 30px var(--glow); }
.dnode.dim { filter: opacity(.3); }
.dyn .hover-card { position: absolute; z-index: 5; width: 200px; background: rgba(28, 30, 48, .92); border: 1px solid var(--glow); border-radius: 14px; padding: 10px; pointer-events: none; text-align: center; font-size: 12.5px; box-shadow: 0 0 24px var(--glow); }
.dyn .hover-card img { width: 100%; border-radius: 5px; background: #fff; }
.dyn .panel { position: absolute; z-index: 6; top: 16px; right: 16px; bottom: 16px; width: min(380px, calc(100% - 32px)); background: rgba(24, 26, 42, .94); border: 1px solid var(--glow); border-radius: 20px; padding: 18px; overflow: auto; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 40px var(--glow); color: #EEF0F6; }
.dyn .panel h3 { font: 700 22px var(--font-display); margin: 0; }
.dyn .panel h4 { margin: 4px 0 0; font-size: 13px; color: #A9B0C6; text-transform: uppercase; letter-spacing: .05em; }
.dyn .panel .lrow { display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,.06); border-radius: 10px; padding: 8px 10px; border: 0; color: inherit; text-align: left; width: 100%; }
.dyn .panel .lrow small { color: #A9B0C6; display: block; }
.dyn .panel .strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.dyn .panel .strip button { border: 0; background: transparent; color: #A9B0C6; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0; }
.dyn .panel .strip img { width: 64px; border-radius: 3px; background: #fff; }
.dyn .hint { position: absolute; left: 20px; bottom: 16px; color: rgba(255,255,255,.6); font-size: 12.5px; }
.dyn .reset { position: absolute; left: 20px; top: 16px; z-index: 4; }
.dyn .btn { background: rgba(255,255,255,.1); color: #fff; }
/* En modo dinámico la cabecera también va en oscuro. */
.dark-zone { --bar: #0B0C16; --ink: #fff; --fill: rgba(255,255,255,.12); --surface-2: rgba(255,255,255,.1); --muted: rgba(235,235,245,.6); color: #fff; }

@media (max-width: 760px) {
  .sidebar { display: none; }
  .shelf { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 24px 18px; }
  .title-input { width: 120px; }
  .lib-header .center { position: static; transform: none; width: auto; flex: 1; }
  .prominent .label { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Temporizador de estudio ---------- */
.pomo-slot { width: 104px; display: flex; justify-content: center; flex: none; }   /* ancho fijo: no mueve nada */
.pomo-btn.running { border: 0; height: 30px; padding: 0 10px; border-radius: 15px; display: inline-flex; align-items: center; gap: 5px; color: var(--pc); background: color-mix(in srgb, var(--pc) 15%, transparent); font: 600 15px var(--font); font-variant-numeric: tabular-nums; }
.pomo-btn.running svg { width: 13px; height: 13px; }
.pomo-panel { position: fixed; z-index: 75; width: 340px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; box-shadow: 0 14px 40px rgba(0,0,0,.25); padding: 20px; display: flex; flex-direction: column; gap: 14px; align-items: stretch; animation: pop .14s ease-out; }
.pomo-title { text-align: center; font-weight: 600; font-size: 17px; }
.pomo-ring { position: relative; width: 150px; height: 150px; margin: 0 auto; }
.pomo-ring svg { width: 150px; height: 150px; }
.pomo-ring circle { transition: stroke-dashoffset .5s linear; }
.pomo-ring div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.pomo-ring b { font: 600 40px/1 ui-rounded, var(--font-display); font-variant-numeric: tabular-nums; }
.pomo-ring small { color: var(--muted); font-size: 12px; margin-top: 4px; }
.pomo-dots { display: flex; gap: 6px; justify-content: center; }
.pomo-dots span { width: 9px; height: 9px; border-radius: 50%; background: var(--fill-strong); }
.pomo-dots span.on { background: #FF3B30; }
.pomo-actions { display: flex; gap: 14px; justify-content: center; align-items: center; }
.pomo-actions .round { width: 42px; height: 42px; border-radius: 21px; border: 0; background: var(--fill); display: grid; place-items: center; color: var(--accent); }
.pomo-actions .round svg { width: 20px; height: 20px; }
.pomo-actions .go { border: 0; color: #fff; font-weight: 600; font-size: 16px; height: 42px; padding: 0 22px; border-radius: 12px; display: inline-flex; align-items: center; gap: 6px; min-width: 130px; justify-content: center; }
.pomo-actions .go svg { width: 16px; height: 16px; fill: currentColor; }
.pomo-remove { align-self: center; border: 0; background: transparent; color: var(--danger); display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.pomo-remove svg { width: 16px; height: 16px; }
.pomo-panel hr { border: 0; border-top: 1px solid var(--hairline); margin: 0; width: 100%; }
.pomo-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
.pomo-row label { display: inline-flex; gap: 6px; align-items: center; }
.stepper { display: inline-flex; background: var(--fill); border-radius: 8px; }
.stepper button { border: 0; background: transparent; width: 34px; height: 28px; display: grid; place-items: center; }
.stepper button + button { border-left: 1px solid var(--hairline); }
.stepper svg { width: 14px; height: 14px; }
.pomo-banner { position: fixed; z-index: 70; top: 104px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  background: var(--surface); border: 1.5px solid color-mix(in srgb, var(--pc) 70%, transparent); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.2); animation: rise .25s ease-out; }
.pomo-banner .ico { color: var(--pc); }
.pomo-banner .ico svg { width: 26px; height: 26px; }
.pomo-banner small { display: block; color: var(--muted); }

/* ---------- Atajos de teclado ---------- */
.shortcuts-dialog { width: min(640px, 100%); max-height: min(760px, 100%); }
.sc-list { overflow: auto; margin: 0 -22px; padding: 0 22px; }
.sc-help { font-size: 13px; }
.sc-list h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
.sc-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--hairline); font-size: 14px; }
.sc-row > span:first-child { flex: 1; }
.sc-keys { display: flex; gap: 6px; align-items: center; }
.sc-key { border: 0; background: var(--fill); border-radius: 6px; padding: 4px 10px; font: 500 13px var(--font); font-variant-numeric: tabular-nums; min-width: 34px; }
.sc-key:hover { background: var(--fill-strong); }
.sc-add, .sc-reset { width: 26px; height: 26px; border: 0; background: transparent; border-radius: 6px; display: grid; place-items: center; color: var(--muted); padding: 0; }
.sc-add svg, .sc-reset svg { width: 15px; height: 15px; }
.sc-add:hover, .sc-reset:hover { background: var(--fill); color: var(--ink); }
.sc-recorder { position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,.35); display: grid; place-items: center; }
.sc-recorder div { background: var(--surface); border-radius: 16px; padding: 26px 30px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.sc-recorder svg { width: 34px; height: 34px; color: var(--accent); }
.sc-recorder small { color: var(--muted); }

/* Recortar imagen */
.crop-dialog { width: min(760px, 100%); }
.crop-stage { height: min(52vh, 440px); display: grid; place-items: center; background: var(--desk); border-radius: 10px; padding: 18px; touch-action: none; }
.crop-box { position: relative; user-select: none; }
.crop-box img { display: block; width: 100%; height: 100%; pointer-events: none; }
.crop-shade { position: absolute; inset: 0; background: rgba(0, 0, 0, .5); pointer-events: none; }
.crop-rect { position: absolute; border: 1.5px solid #fff; box-shadow: 0 0 0 .5px rgba(0,0,0,.4); cursor: move; }
.crop-rect i { position: absolute; background: rgba(255,255,255,.45); }
.crop-rect i:nth-child(1) { left: 33.33%; top: 0; bottom: 0; width: 1px; }
.crop-rect i:nth-child(2) { left: 66.66%; top: 0; bottom: 0; width: 1px; }
.crop-rect i:nth-child(3) { top: 33.33%; left: 0; right: 0; height: 1px; }
.crop-rect i:nth-child(4) { top: 66.66%; left: 0; right: 0; height: 1px; }
.crop-h { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); z-index: 1; }
.crop-h.tl, .crop-h.br { cursor: nwse-resize; } .crop-h.tr, .crop-h.bl { cursor: nesw-resize; }
.crop-h.t, .crop-h.b { cursor: ns-resize; width: 26px; height: 8px; margin: -4px 0 0 -13px; border-radius: 4px; }
.crop-h.l, .crop-h.r { cursor: ew-resize; width: 8px; height: 26px; margin: -13px 0 0 -4px; border-radius: 4px; }
.crop-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
.crop-controls .btn svg { width: 17px; height: 17px; vertical-align: -3px; }
.crop-width { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.crop-width svg:first-child { width: 14px; height: 14px; } .crop-width svg:nth-of-type(2) { width: 22px; height: 22px; }
.crop-width input { flex: 1; accent-color: var(--accent); }
.crop-width span { min-width: 170px; text-align: right; }
.crop-info { font-size: 12.5px; text-align: center; }

/* Reordenar arrastrando (páginas y pestañas) */
.reorder-shift { transition: transform .2s cubic-bezier(.2,.8,.3,1); }
.reordering { position: relative; z-index: 30; cursor: grabbing !important; transition: none; }
.reordering img, .reordering.tab { filter: drop-shadow(0 8px 18px rgba(0,0,0,.25)); }
.reordering.pw-page .pw-thumb, .reordering.thumb img { transform: scale(1.04); }
body.is-reordering, body.is-reordering * { cursor: grabbing !important; user-select: none; }
body.is-reordering .tabs .chip:hover { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Ventana «Páginas» */
.pages-window { width: min(900px, 100%); height: min(760px, 100%); gap: 10px; }
.pw-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.pw-head .btn:first-child { justify-self: start; } .pw-head .btn:last-child { justify-self: end; }
.pw-head .btn svg { width: 16px; height: 16px; vertical-align: -3px; }
.pw-hint { text-align: center; font-size: 12.5px; }
.pw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 20px; padding: 8px 4px 20px; align-content: start; touch-action: none; }
.pw-page { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: grab; }
.pw-thumb { position: relative; width: 100%; transition: transform .15s; }
.pw-thumb img { width: 100%; display: block; background: #fff; border-radius: 4px; border: 3px solid transparent; box-shadow: 0 0 0 1px var(--hairline), 0 2px 8px rgba(0,0,0,.12); }
.pw-page.current img { border-color: var(--accent); }
.pw-page .num { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pw-page.current .num { color: var(--accent); font-weight: 600; }
.pw-page .bm { position: absolute; top: 6px; right: 6px; border: 0; background: transparent; padding: 2px; color: var(--muted); }
.pw-page .bm[aria-pressed="true"] { color: #FF3B30; }
.popover .danger { color: var(--danger); }

/* Grabar audio y notas de voz */
.mic-slot { width: 96px; display: flex; justify-content: center; flex: none; }   /* ancho fijo: grabando no mueve nada */
.mic-pill { display: inline-flex; align-items: center; }
.mic-pill .mic-more { width: 18px; margin-left: -6px; }
.mic-pill .mic-more svg { width: 12px; height: 12px; }
.mic-pill.recording .mic-main { display: inline-flex; align-items: center; white-space: nowrap; width: auto; padding: 0 9px; gap: 6px; color: #FF3B30; font: 600 14px var(--font); font-variant-numeric: tabular-nums; background: rgba(255, 59, 48, .12); border-radius: 15px; height: 30px; }
.rec-dot { width: 9px; height: 9px; border-radius: 50%; background: #FF3B30; animation: recblink 1.2s ease-in-out infinite; }
@keyframes recblink { 50% { opacity: .25; } }
.menu-spacer { width: 17px; flex: none; }
.item.voice { background: #FFF2E0; border: 1.5px solid #FF9500; border-radius: 24px; cursor: pointer; display: block; color: #1F1F1F; }
.item.voice.selected { box-shadow: 0 0 0 2px #007AFF; }
.item.voice .resize { display: none !important; }
.item.voice .vplay { position: absolute; left: 8px; top: 50%; margin-top: -15px; width: 30px; height: 30px; border-radius: 50%; background: #FF9500; color: #fff; display: grid; place-items: center; }
.item.voice .vplay svg { width: 14px; height: 14px; fill: currentColor; }
.item.voice .vtitle { position: absolute; left: 46px; right: 14px; top: 6px; font: 600 13px/18px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.voice .vtime { position: absolute; left: 46px; top: 24px; font: 11px/15px var(--font); color: #595959; font-variant-numeric: tabular-nums; }
.item.voice .vprog { position: absolute; left: 46px; bottom: 6px; height: 3px; border-radius: 1.5px; background: #FF9500; max-width: calc(100% - 64px); }
#app.hide-voice .item.voice { display: none; }
.voice-label { display: inline-flex; align-items: center; gap: 6px; color: #C76E00; max-width: 300px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.voice-label svg { width: 16px; height: 16px; flex: none; }
.playback-bar { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 26px; background: color-mix(in srgb, var(--bar) 85%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 0 0 .5px var(--hairline), 0 2px 10px rgba(0,0,0,.15); z-index: 20; font-variant-numeric: tabular-nums; font-size: 12px; animation: rise .2s ease-out; }
.playback-bar input { width: 220px; accent-color: #FF9500; }
.playback-bar [data-pb="play"] svg { fill: currentColor; }
.recordings-window { width: min(640px, 100%); }
.rec-list { display: flex; flex-direction: column; border-radius: 12px; background: var(--fill); overflow: hidden; }
.rec-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--hairline); }
.rec-row:last-child { border-bottom: 0; }
.rec-play { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.rec-play svg { width: 15px; height: 15px; fill: currentColor; }
.rec-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rec-text b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-text span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rec-row .btn svg { width: 15px; height: 15px; vertical-align: -3px; }
.rec-foot { font-size: 12.5px; }
.empty-state { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 36px 20px; color: var(--muted); text-align: center; }
.empty-state svg { width: 40px; height: 40px; }
.empty-state b { color: var(--ink); font-size: 17px; }

/* Texto de los PDF */
.pdf-sel { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.pdf-sel i { position: absolute; background: rgba(0, 122, 255, .28); border-radius: 2px; }
.pdf-panel { position: fixed; z-index: 40; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 14px; background: var(--surface); box-shadow: 0 0 0 .5px var(--hairline), 0 6px 22px rgba(0,0,0,.22); animation: rise .15s ease-out; }
.pdf-panel .pp-icon { color: var(--muted); display: grid; place-items: center; margin-right: 2px; }
.pdf-panel .pp-icon svg { width: 18px; height: 18px; }
.pdf-panel .swatch { width: 24px; height: 24px; border-radius: 50%; border: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); padding: 0; cursor: pointer; }
.pdf-panel .swatch:hover { transform: scale(1.12); }
.pdf-panel .sep { width: 1px; height: 22px; background: var(--hairline); margin: 0 4px; }
.pdf-panel .icon-btn { width: 32px; height: 32px; color: var(--ink); }
.tab-group { display: flex; align-items: flex-end; align-self: stretch; min-width: 0; flex: 0 1 auto; }
.tab-group > .chip { cursor: grab; }
.tab-group.reordering { z-index: 30; }
.tab-group.reordering > .chip { cursor: grabbing; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.popover .kbd-hint { margin-left: auto; padding-left: 16px; color: var(--muted); font-size: 12.5px; }
.popover button:hover:not(:disabled) .kbd-hint { color: rgba(255,255,255,.8); }
/* Barra del editor, lado derecho: grupos separados por una línea fina */
.bar .cluster { display: flex; align-items: center; gap: 2px; flex: none; }
.bar .bar-sep { width: 1px; height: 22px; background: var(--line, var(--hairline)); margin: 0 6px; flex: none; opacity: .9; }
.bar .pomo-slot { justify-content: flex-end; }
.bar .mic-slot { justify-content: flex-start; }
/* Modo lectura */
.reading-pill { display: none; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 14px; border: 0; border-radius: 18px; background: var(--fill); color: var(--ink); font: 500 14px var(--font); flex: none; cursor: pointer; }
.reading-pill svg { width: 17px; height: 17px; color: var(--accent); }
.reading-pill b { font-weight: 600; color: var(--accent); background: var(--surface); border-radius: 14px; padding: 4px 12px; }
#app.reading .reading-pill { display: inline-flex; animation: fade .2s; }
#app.reading .group[role="toolbar"], #app.reading #options, #app.reading .add-page { display: none; }
#app.reading #read-btn { background: var(--accent); color: #fff; }
#app.reading .page, #app.reading .page * { touch-action: pan-x pan-y pinch-zoom !important; }
#app.reading .layer.items { pointer-events: auto; cursor: grab; }
#app.reading .item, #app.reading .rich { cursor: grab; }
#app.reading .item.voice, #app.reading .item.link, #app.reading .pin, #app.reading a[data-link] { cursor: pointer; }
#app.reading .desk.panning, #app.reading .desk.panning * { cursor: grabbing !important; }

/* Carpetas en la biblioteca (como en Goodnotes) */
.folder-icon { aspect-ratio: 158 / 210; width: 100%; border: 0; padding: 0; background: transparent; position: relative; display: block; cursor: pointer; transition: transform .15s ease; }
.folder-icon::before { content: ""; position: absolute; left: 0; right: 0; bottom: 8%; height: 58%; border-radius: 8px; background: color-mix(in srgb, var(--c) 60%, #34405a); clip-path: polygon(0 0, 38% 0, 46% 9%, 100% 9%, 100% 100%, 0 100%); }
.folder-icon::after { content: ""; position: absolute; left: 0; right: 0; bottom: 8%; height: 50%; border-radius: 8px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 55%, white), color-mix(in srgb, var(--c) 75%, white)); box-shadow: 0 -1px 0 rgba(255,255,255,.35) inset, 0 4px 12px rgba(0,0,0,.12); }
.folder-icon:hover { transform: translateY(-2px); }
.folder-icon .count { position: absolute; z-index: 1; right: 10px; bottom: calc(8% + 8px); font: 600 12px var(--font); color: #fff; background: rgba(0,0,0,.22); border-radius: 99px; padding: 1px 7px; }
.title-row { background: var(--bar); flex: none; padding: 0; }
.crumbs { display: flex; align-items: center; gap: 4px; padding: 6px 20px 0; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.crumbs button { border: 0; background: transparent; color: var(--accent); padding: 2px 4px; border-radius: 6px; font: inherit; cursor: pointer; }
.crumbs button:hover { background: var(--fill); }
.large-title { display: flex; align-items: center; gap: 4px; }
.back-folder { border: 0; background: transparent; color: var(--accent); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; margin-left: -8px; cursor: pointer; padding: 0; }
.back-folder svg { width: 24px; height: 24px; stroke-width: 2.2; }
.back-folder:hover { background: var(--fill); }
.chip-dot { width: 12px; height: 12px; border-radius: 4px; background: var(--c); flex: none; margin: 0 2.5px; }
/* Seleccionar varias */
.library.selecting .cover, .library.selecting .folder-icon { transition: transform .15s, opacity .15s, filter .15s; }
.library.selecting .card:not(.picked) .cover, .library.selecting .card:not(.picked) .folder-icon { opacity: .55; }
.library.selecting .card:not(.picked) .name { opacity: .6; }
.pick-mark { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.25); display: grid; place-items: center; color: #fff; pointer-events: none; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.folder-card .pick-mark { top: auto; bottom: calc(8% + 50% - 34px); }
.card.picked .pick-mark { background: var(--accent); border-color: #fff; }
.pick-mark svg { width: 15px; height: 15px; stroke-width: 3; }
.lib-header.selecting { align-items: center; }
.sel-actions { display: flex; justify-content: center; gap: 22px; }
.lib-header.selecting .center { top: 14px; width: auto; }
.sel-act { border: 0; background: transparent; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 3px; font: 12px var(--font); padding: 4px 8px; border-radius: 10px; cursor: pointer; }
.sel-act svg { width: 22px; height: 22px; color: var(--accent); }
.sel-act.danger svg, .sel-act.danger { color: var(--danger); }
.sel-act:hover:not(:disabled) { background: var(--fill); }
.sel-act:disabled { opacity: .35; cursor: default; }
.sel-count { margin-left: auto; color: var(--muted); font-size: 13px; }
/* Ventana «Mover a…» */
.move-dialog { width: min(480px, 100%); }
.move-tree { max-height: 50vh; overflow: auto; border-radius: 12px; background: var(--fill); padding: 4px; display: flex; flex-direction: column; }
.move-row { border: 0; background: transparent; text-align: left; display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px calc(10px + var(--d) * 20px); border-radius: 8px; font: 15px var(--font); color: var(--ink); cursor: pointer; }
.move-row:hover:not(:disabled) { background: var(--fill-strong); }
.move-row[aria-selected="true"] { background: var(--accent); color: #fff; }
.move-row:disabled { opacity: .35; cursor: not-allowed; }
.move-row .mf { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--c); color: #fff; flex: none; }
.move-row .mf svg { width: 15px; height: 15px; }

/* Modo dinámico: carpetas como nebulosas, ruta y viaje al abrir */
.dfolder { position: absolute; width: 170px; margin-left: -85px; margin-top: -26px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; user-select: none; touch-action: none; transform: scale(var(--s, 1)); transition: transform .25s; will-change: left, top, transform; }
.dfolder .core { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #fff, color-mix(in srgb, var(--glow) 70%, white) 45%, var(--glow)); color: color-mix(in srgb, var(--glow) 40%, black); box-shadow: 0 0 22px var(--glow), 0 0 60px color-mix(in srgb, var(--glow) 60%, transparent); }
.dfolder .core svg { width: 24px; height: 24px; stroke-width: 2.2; }
.dfolder .lbl { margin-top: 70px; font: 700 15px var(--font); text-shadow: 0 1px 6px rgba(0,0,0,.9); max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dfolder .sub { font-size: 12px; color: rgba(255,255,255,.7); text-shadow: 0 1px 4px rgba(0,0,0,.9); }
.dfolder:hover { transform: scale(calc(var(--s, 1) * 1.08)); }
.dfolder:focus-visible, .dnode:focus-visible { outline: 2px solid #fff; outline-offset: 6px; border-radius: 12px; }
.dyn-crumbs { position: absolute; left: 20px; top: 16px; z-index: 4; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; color: rgba(255,255,255,.5); font-size: 14px; }
.dyn-crumbs button { border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.08); color: #fff; font: 600 13.5px var(--font); padding: 6px 12px; border-radius: 99px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.dyn-crumbs button svg { width: 15px; height: 15px; }
.dyn-crumbs button:hover:not([aria-current]) { background: rgba(255,255,255,.16); }
.dyn-crumbs button[aria-current] { cursor: default; border-color: var(--glow, rgba(255,255,255,.3)); box-shadow: 0 0 14px color-mix(in srgb, var(--glow, #8E7CFF) 50%, transparent); }
.dyn .reset { top: 60px; }
.dyn .hover-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; text-align: left; }
.dyn .hover-list span { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dyn .hover-list span::before { content: ""; width: 8px; height: 11px; border-radius: 2px; background: var(--c); box-shadow: 0 0 6px var(--c); flex: none; }
.dyn .hover-list .more::before { display: none; }
.dyn .hover-go { margin-top: 8px; font-weight: 600; color: color-mix(in srgb, var(--glow) 60%, white); }
.dyn-fly { position: fixed; z-index: 300; border-radius: 6px; overflow: hidden; perspective: 800px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 72%, white), color-mix(in srgb, var(--c) 93%, white)); box-shadow: 0 0 60px var(--c), 0 20px 80px rgba(0,0,0,.5); pointer-events: none; }
.dyn-fly .paper-in { position: absolute; inset: 0; background: var(--desk, #EAEBEB); }
.dyn .hint { transition: opacity .8s; }
.dyn .hint.gone { opacity: 0; }
/* El recuadro de foco solo cuando se va con el teclado (Tab); con el ratón no se queda marcado */
body:not(.kbd-nav) select:focus-visible, body:not(.kbd-nav) .options :focus-visible { outline: none; }
.options .item-acts { display: inline-flex; gap: 2px; }
.options .item-acts [data-act="delete"] { color: var(--danger); }
/* Cada parte del panel conserva su tamaño (si no, la fila de miniaturas de «Apartados» se aplasta) y se baja con la rueda */
.dyn .panel > * { flex-shrink: 0; }
.dyn .panel .strip { min-height: 100px; align-items: flex-start; }
.dyn .panel { overscroll-behavior: contain; }
/* Idioma en Ajustes */
.popover .lang-row { display: flex; gap: 6px; padding: 2px 6px 6px; }
.popover .lang-btn { flex: 1; border: 1px solid var(--hairline); border-radius: 9px; padding: 7px 10px; justify-content: center; }
.popover .lang-btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.popover .lang-btn svg { width: 22px; height: 15px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }

/* Botones que abren un menú o panel: con fondo mientras está abierto (se quita al cerrarlo). */
.icon-btn[aria-expanded="true"], .menu-btn[aria-expanded="true"], .options .btn[aria-expanded="true"] { background: var(--fill); }
/* Control «− 16 pt +»: el número abre el menú «Tamaño». */
.seg .size-btn { min-width: 58px; justify-content: center; font-variant-numeric: tabular-nums; }
.seg .size-btn[aria-expanded="true"] { background: var(--seg-thumb); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
/* Menú «Tamaño» (como en Goodnotes): título, deslizador con − / + y tamaños rápidos, con flecha hacia el control. */
.popover.size-pop { width: 284px; padding: 12px 12px 14px; gap: 10px; overflow: visible; background: var(--surface); }
.popover.size-pop::before { content: ""; position: absolute; top: -7px; left: calc(var(--arrow-x, 50%) - 7px); width: 13px; height: 13px; background: var(--surface);
  border-left: 1px solid var(--hairline); border-top: 1px solid var(--hairline); transform: rotate(45deg); border-top-left-radius: 3px; }
.size-pop .sz-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px; font-weight: 600; font-size: 15px; }
.size-pop .sz-val { font-weight: 600; font-size: 15px; color: var(--accent); font-variant-numeric: tabular-nums; }
.size-pop .sz-row { display: flex; align-items: center; gap: 8px; }
.size-pop .sz-range { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }
.popover.size-pop .sz-step { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 50%; background: var(--fill); color: var(--ink); flex: none; }
.popover.size-pop .sz-step:hover:not(:disabled) { background: var(--fill-strong); color: var(--ink); }
.popover.size-pop .sz-step:disabled { opacity: .35; }
.size-pop .sz-quick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.popover.size-pop .sz-quick button { justify-content: center; padding: 7px 0; border-radius: 8px; background: var(--fill); color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
.popover.size-pop .sz-quick button:hover:not(:disabled) { background: var(--fill-strong); color: var(--ink); }
.popover.size-pop .sz-quick button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
/* =============================================================================
   Tutorial de la primera vez (siempre en oscuro, como en la app nativa)
   ============================================================================= */
.onb { --rounded: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", system-ui, sans-serif; position: fixed; inset: 0; z-index: 200; color: #fff; overflow: hidden; font-family: var(--font); color-scheme: dark; animation: fade .4s ease-out; }
.onb.leaving { animation: onb-out .45s ease-in forwards; }
@keyframes onb-out { to { opacity: 0; transform: scale(1.03); } }
.onb-aurora, .onb-confetti { position: absolute; inset: 0; width: 100%; height: 100%; }
.onb-confetti { pointer-events: none; z-index: 2; }
.onb-stages { position: absolute; inset: 0; }
.onb-stage { position: absolute; inset: 0; display: flex; flex-direction: column; transition: transform .6s cubic-bezier(.2,.9,.25,1), opacity .45s ease; }
.onb-stage.in.from-right { transform: translateX(60px) scale(.98); opacity: 0; }
.onb-stage.in.from-left { transform: translateX(-60px) scale(.98); opacity: 0; }
.onb-stage.in.shown { transform: none; opacity: 1; }
.onb-stage.out { pointer-events: none; opacity: 0; transition: transform .3s ease-in, opacity .25s ease-in; }
.onb-stage.out.to-left { transform: translateX(-60px); }
.onb-stage.out.to-right { transform: translateX(60px); }
.onb-center { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 40px; text-align: center; position: relative; z-index: 3; }
.onb-title { font: 700 46px/1.1 var(--rounded); margin: 0; background: linear-gradient(#fff, #d1d1d1); -webkit-background-clip: text; background-clip: text; color: transparent; }
.onb-sub { margin: -14px 0 0; font-size: 20px; color: rgba(255,255,255,.7); max-width: 560px; }
.onb-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.onb-glass { font: 600 17px var(--font); color: #fff; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.1); padding: 13px 20px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: transform .25s cubic-bezier(.3,1.6,.5,1), background .2s, box-shadow .2s, opacity .2s; }
.onb-glass:hover:not(:disabled) { background: rgba(255,255,255,.16); transform: scale(1.03); }
.onb-glass:active:not(:disabled) { transform: scale(.96); }
.onb-glass:disabled { opacity: .45; cursor: default; }
.onb-glass.prominent { padding: 13px 26px; border-color: rgba(255,255,255,.35); background: linear-gradient(90deg, #7366FF, #BF59FF); box-shadow: 0 4px 12px rgba(175,82,222,.5); }
.onb-glass.prominent:hover:not(:disabled) { background: linear-gradient(90deg, #7366FF, #BF59FF); box-shadow: 0 4px 18px rgba(175,82,222,.8); }
.onb-glass:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.onb-glass svg { width: 18px; height: 18px; }
.onb-arrow { display: inline-flex; } .onb-arrow svg { width: 18px; height: 18px; stroke-width: 2.4; }
.onb-skip { position: absolute; top: 24px; right: 24px; z-index: 5; padding: 10px 18px; font-size: 15px; }
/* Bienvenida */
.onb-logo { width: 180px; height: 200px; position: relative; perspective: 600px; }
.onb-cover { position: absolute; inset: 0; border-radius: 22px; background: linear-gradient(135deg, #6B5CFF, #B84DF2); border: 1.5px solid rgba(255,255,255,.35); box-shadow: 0 0 40px rgba(175,82,222,.7), inset 24px 0 0 rgba(0,0,0,.18); animation: onb-cover .9s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes onb-cover { from { opacity: 0; transform: scale(.4) rotateX(60deg) rotateY(24deg); } }
.onb-sign { position: absolute; inset: 0; width: 100%; height: 100%; }
.onb-sign path { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 400; stroke-dashoffset: 400; filter: drop-shadow(0 0 6px rgba(255,255,255,.8)); animation: onb-draw 1.2s .6s ease-in-out forwards; }
@keyframes onb-draw { to { stroke-dashoffset: 0; } }
.onb-nib { position: absolute; left: 24px; top: 104px; color: #fff; opacity: 0; animation: onb-nib 1.2s .6s ease-in-out forwards; }
.onb-nib svg { width: 34px; height: 34px; stroke-width: 2.4; transform: rotate(-35deg); }
@keyframes onb-nib { 0% { opacity: 1; transform: translate(0, 0); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(120px, -20px); } }
.onb-word { margin: 0; font: 900 64px/1 var(--rounded); display: flex; }
.onb-word span { display: inline-block; background: linear-gradient(#fff, #CCBFFF); -webkit-background-clip: text; background-clip: text; color: transparent; animation: onb-letter .6s cubic-bezier(.3,1.5,.5,1) both; animation-delay: calc(1.1s + var(--i) * .07s); }
@keyframes onb-letter { from { opacity: 0; transform: translateY(24px); filter: blur(6px); } }
.onb-late { animation: onb-up .8s 1.8s ease-out both; margin-top: -8px; }
.onb-late2 { animation: onb-pop .7s 2.4s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes onb-up { from { opacity: 0; transform: translateY(12px); } }
@keyframes onb-pop { from { opacity: 0; transform: scale(.9); } }
/* Nombre */
.onb-wave { font-size: 60px; line-height: 1; transform-origin: 70% 80%; }

// =============================================================================
// Idiomas (español e italiano). La interfaz está escrita en español; al mostrarse, cada texto de
// la interfaz (y los títulos, ayudas y marcadores de posición) se traduce con el diccionario de
// i18n-it.js. Lo que escribe quien usa Folia (textos, títulos, páginas) no se toca nunca.
// =============================================================================
const LANGS = { es: { name: 'Español', locale: 'es-ES' }, it: { name: 'Italiano', locale: 'it-IT' } };
const I18N = {
  lang: (() => {
    try { const v = localStorage.getItem('libreta-lang'); if (LANGS[v]) return v; } catch (e) { /* sin almacenamiento */ }
    return /^it\b/i.test(navigator.language || '') ? 'it' : 'es';
  })(),
  dict: {},            // { it: { 'texto en español': 'testo in italiano' } }
  patterns: {},        // { it: [[/regex/, (m) => '...'], ...] }
  words: {},           // { it: [['palabra', 'parola'], ...] } para textos con números o nombres
  missing: /[?&]collect/.test(location.search) ? new Set() : null, // al probar: los textos sin traducir
};
const LOCALE = () => LANGS[I18N.lang].locale;
const SKIP_I18N = '[translate="no"], .rich, .page-inner, script, style, textarea, .title-input';

/** Traduce un texto de la interfaz (si hace falta). */
function tr(s) {
  if (I18N.lang === 'es' || s == null) return s;
  const str = String(s);
  const m = str.match(/^(\s*)([\s\S]*?)(\s*)$/);
  const core = m[2];
  if (!core || !/[A-Za-zÁÉÍÓÚáéíóúñÑ¿¡]/.test(core)) return str;
  const out = trCore(core);
  return out === null ? str : m[1] + out + m[3];
}
function trCore(core) {
  const d = I18N.dict[I18N.lang] || {};
  if (Object.prototype.hasOwnProperty.call(d, core)) return d[core];
  for (const [re, fn] of I18N.patterns[I18N.lang] || []) {
    const mm = core.match(re);
    if (mm) return typeof fn === 'function' ? fn(mm, trCore) : core.replace(re, fn);
  }
  // Último recurso: palabras sueltas (para «3 páginas · 15 ott 2026» y parecidos).
  let changed = false, out = core;
  for (const [es, it] of I18N.words[I18N.lang] || []) {
    const re = new RegExp(`(^|[^\\p{L}])${es.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(?=$|[^\\p{L}])`, 'gu');
    if (re.test(out)) { out = out.replace(re, `$1${it}`); changed = true; }
  }
  if (!changed && I18N.missing && core.length > 1 && /[a-záéíóúñ]{2}/i.test(core)) I18N.missing.add(core);
  return changed ? out : null;
}

// ---------- Traducir la página según aparece ----------
const I18N_ATTRS = ['title', 'aria-label', 'placeholder', 'alt'];
function translateTextNode(n) {
  const v = n.nodeValue;
  if (n.__trOut === v) return; // ya traducido por nosotros
  const p = n.parentElement;
  if (!p || p.closest(SKIP_I18N)) return;
  n.__trIn = v;
  const out = tr(v);
  n.__trOut = out;
  if (out !== v) n.nodeValue = out;
}
function translateAttrs(el) {
  if (el.closest(SKIP_I18N)) return;
  el.__trAttr = el.__trAttr || {};
  for (const a of I18N_ATTRS) {
    const v = el.getAttribute(a);
    if (v == null || el.__trAttr[a]?.out === v) continue;
    const out = tr(v);
    el.__trAttr[a] = { in: v, out };
    if (out !== v) el.setAttribute(a, out);
  }
}
function translateTree(root) {
  if (I18N.lang === 'es' || !root) return;
  if (root.nodeType === 3) return translateTextNode(root);
  if (root.nodeType !== 1) return;
  translateAttrs(root);
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    if (n.nodeType === 3) translateTextNode(n); else translateAttrs(n);
  }
}
/** Al volver al español, se recupera el texto original de todo lo ya traducido. */
function untranslateTree(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    if (n.nodeType === 3) { if (n.__trIn != null && n.nodeValue === n.__trOut) n.nodeValue = n.__trIn; n.__trOut = n.__trIn = undefined; }
    else if (n.__trAttr) { for (const [a, v] of Object.entries(n.__trAttr)) if (n.getAttribute(a) === v.out) n.setAttribute(a, v.in); n.__trAttr = null; }
  }
}

  if (I18N.lang === 'es') return;
  for (const m of list) {
    if (m.type === 'childList') m.addedNodes.forEach(translateTree);
    else if (m.type === 'characterData') translateTextNode(m.target);
    else if (m.type === 'attributes') translateAttrs(m.target);

});

  document.documentElement.lang = I18N.lang;
  i18nObserver.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: I18N_ATTRS });
  translateTree(document.body);
}

/** Cambiar de idioma: se vuelve a pintar todo en el idioma nuevo. */
function setLanguage(lang) {
  if (!LANGS[lang] || lang === I18N.lang) return;
  I18N.lang = lang;
  try { localStorage.setItem('libreta-lang', lang); } catch (e) { /* nada */ }
  document.documentElement.lang = lang;
  untranslateTree(document.body);
  translateExamples();
  if (S.view === 'editor') renderEditor(); else renderLibrary();
  translateTree(document.body);
  if (typeof Onboarding !== 'undefined' && Onboarding.el) Onboarding.relabel();
}

const FLAGS = {

};
function languageButtons(cls = '') {
  return Object.entries(LANGS).map(([k, l]) => `<button class="lang-btn ${cls}" data-lang="${k}" aria-pressed="${I18N.lang === k}" translate="no">${FLAGS[k]}<span>${l.name}</span></button>`).join('');
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-lang]');
  if (!b) return;
  setLanguage(b.dataset.lang);
  document.querySelectorAll('[data-lang]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.lang === I18N.lang));
});

      if (child.tagName === 'IMG' && /^data:image\//.test(child.getAttribute('src') || '')) keep.src = child.getAttribute('src');

      for (const attr of [...child.attributes]) child.removeAttribute(attr.name);
