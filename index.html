    const titles = [['Cardiología', '#FF3B30'], ['Digestivo', '#007AFF'], ['Cirugía vascular', '#34C759']].map(([n, c]) => [tr(n), c]);
    ctx.save(); ctx.beginPath(); ctx.roundRect(0, 0, W, H, 14); ctx.clip();
    ctx.fillStyle = onbGray(0.08); ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = onbGray(0.17); ctx.fillRect(0, 56, W, H - 56);
    const tw = (W - 20) / 3;
    [1, 2, 0].forEach((i) => {
      const slot = i === 0 ? 2 * move : i - move;
      const x = 10 + tw * slot, y = 16 - (i === 0 ? 6 * Math.sin(Math.PI * move) : 0);
      if (i === 0) {
        if (move > 0 && move < 1) { ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 8; }
        ctx.fillStyle = onbGray(0.17); ctx.beginPath(); ctx.roundRect(x, y, tw - 4, 40, [9, 9, 0, 0]); ctx.fill(); ctx.shadowColor = 'transparent';
      }
      const book = onbIcon('book', titles[i][1], 14, 2.2); if (book.complete) ctx.drawImage(book, x + 10, y + 13, 14, 14);
      ctx.font = `500 12.5px ${ROUNDED}`;
      let title = titles[i][0];
      while (title.length > 3 && ctx.measureText(title).width > tw - 42) title = title.slice(0, -2) + '…';
      this.label(ctx, title, x + 30, y + 20, `500 12.5px ${ROUNDED}`, '#fff', 'left');
    });
    this.label(ctx, tr('Arrastra para ordenar'), W / 2, H * 0.6 + 10, `600 17px ${ROUNDED}`, 'rgba(255,255,255,.7)');
    ctx.restore();
  },
  dynamic(ctx, W, H, t) {
    ctx.fillStyle = 'rgb(13,13,33)'; ctx.beginPath(); ctx.roundRect(0, 0, W, H, 14); ctx.fill();
    const colors = ['#AF52DE', '#007AFF', '#30B0C7', '#FF2D55'];
    const nodes = [[0.2, 0.3], [0.75, 0.25], [0.5, 0.7], [0.85, 0.75]].map(([x, y], i) => [W * x + 8 * Math.sin(t * 0.9 + i), H * y + 10 * Math.cos(t * 0.7 + i * 1.7)]);
    [[0, 1], [0, 2], [2, 3], [1, 3]].forEach(([a, b], e) => {
      ctx.setLineDash([6, 5]); ctx.lineDashOffset = -t * 25; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(...nodes[a]); ctx.lineTo(...nodes[b]); ctx.stroke(); ctx.setLineDash([]);
      const k = onbCycle(t + e * 0.4, 2.2), s = [nodes[a][0] + (nodes[b][0] - nodes[a][0]) * k, nodes[a][1] + (nodes[b][1] - nodes[a][1]) * k];
      const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], 9); g.addColorStop(0, 'rgba(50,215,255,.7)'); g.addColorStop(1, 'rgba(50,215,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s[0], s[1], 9, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s[0], s[1], 3, 0, 7); ctx.fill();
    });
    nodes.forEach((n, i) => {
      const g = ctx.createRadialGradient(n[0], n[1], 8, n[0], n[1], 42); g.addColorStop(0, colors[i] + '99'); g.addColorStop(1, colors[i] + '00');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(n[0], n[1], 40, 45, 0, 0, 7); ctx.fill();
      ctx.fillStyle = colors[i]; ctx.beginPath(); ctx.roundRect(n[0] - 17, n[1] - 22, 34, 44, 5); ctx.fill();
    });
  },
  voice(ctx, W, H, t) {
    const p = onbCycle(t, 5);
    this.paper(ctx, W, H);
    const bw = 5, gap = 4, total = 28 * bw + 27 * gap, x0 = W / 2 - total / 2, cy = H / 2 - 40;
    for (let i = 0; i < 28; i++) {
      const h = 10 + 40 * Math.abs(Math.sin(i * 0.7 + t * 4) * Math.cos(i * 0.31));
      ctx.fillStyle = i / 28 < p ? '#FF9500' : onbGray(0.75);
      ctx.beginPath(); ctx.roundRect(x0 + i * (bw + gap), cy - h / 2, bw, h, 2.5); ctx.fill();
    }
    const px = W / 2 - 125, py = cy + 56;
    ctx.fillStyle = 'rgb(255,242,224)'; ctx.strokeStyle = '#FF9500'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(px, py, 250, 50, 25); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FF9500'; ctx.beginPath(); ctx.arc(px + 27, py + 25, 15, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(px + 22, py + 18, 3.5, 14); ctx.fillRect(px + 28.5, py + 18, 3.5, 14);
    this.label(ctx, tr('Clase de Cardiología'), px + 52, py + 17, `600 16px ${ROUNDED}`, onbGray(0.15), 'left');
    this.label(ctx, `0:${String(Math.floor(p * 45)).padStart(2, '0')} / 0:45`, px + 52, py + 35, `12px ${ROUNDED}`, onbGray(0.4), 'left');
  },
  timer(ctx, W, H, t) {
    const p = onbCycle(t, 5), isBreak = p > 0.7, color = isBreak ? '#34C759' : '#FF3B30';
    const progress = isBreak ? (p - 0.7) / 0.3 : p / 0.7;
    const cx = W / 2, cy = H / 2, r = Math.min(W, H) / 2 - 27;
    ctx.lineWidth = 14; ctx.strokeStyle = color + '33'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
    ctx.shadowColor = color + 'B3'; ctx.shadowBlur = 10; ctx.lineCap = 'round'; ctx.strokeStyle = color;
    ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.max(0.001, progress) * Math.PI * 2); ctx.stroke(); ctx.shadowBlur = 0;
    const ic = onbIcon(isBreak ? 'coffee' : 'book', color, 26, 2.2); if (ic.complete) ctx.drawImage(ic, cx - 13, cy - 58, 26, 26);
    const secs = Math.floor((1 - progress) * (isBreak ? 300 : 1500));
    this.label(ctx, `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`, cx, cy + 2, `600 40px ${ROUNDED}`, '#fff');
    this.label(ctx, tr(isBreak ? 'Descanso' : 'Estudio'), cx, cy + 40, `600 15px ${ROUNDED}`, color);
  },
  search(ctx, W, H, t) {
    const p = onbCycle(t, 4), word = tr('célula'), typed = word.slice(0, Math.floor(onbRamp(p, 0.05, 0.3) * word.length)), results = onbRamp(p, 0.35, 0.5);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.roundRect(0, 0, W, 46, 12); ctx.fill();
    const mg = onbIcon('search', 'rgba(255,255,255,.7)', 20, 2); if (mg.complete) ctx.drawImage(mg, 12, 13, 20, 20);
    this.label(ctx, typed || tr('Buscar'), 42, 24, `20px ${ROUNDED}`, typed ? '#fff' : 'rgba(255,255,255,.4)', 'left');
    const books = ['#34C759', '#007AFF', '#AF52DE'], where = ['Biología · pág. 2', 'Apuntes · pág. 7', 'Resumen · pág. 1'].map(tr);
    for (let i = 0; i < 3; i++) {
      const k = onbRamp(results, i * 0.25, i * 0.25 + 0.5);
      if (k <= 0) continue;
      const y = 60 + i * 72 + 12 * (1 - k);
      ctx.save(); ctx.globalAlpha = k;
      ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.beginPath(); ctx.roundRect(0, y, W, 62, 12); ctx.fill();
      ctx.fillStyle = books[i]; ctx.beginPath(); ctx.roundRect(10, y + 11, 30, 40, 4); ctx.fill();
      this.label(ctx, where[i], 52, y + 20, `12px ${ROUNDED}`, 'rgba(255,255,255,.6)', 'left');
      const la = tr('La') + ' ', rest = ' ' + tr('es la unidad…'); ctx.font = `15px ${ROUNDED}`; const wl = ctx.measureText(la).width;
      ctx.font = `700 15px ${ROUNDED}`; const wc = ctx.measureText(word).width;
      ctx.fillStyle = '#FFD60A'; ctx.beginPath(); ctx.roundRect(52 + wl - 3, y + 32, wc + 6, 20, 10); ctx.fill();
      this.label(ctx, la, 52, y + 42, `15px ${ROUNDED}`, '#fff', 'left');
      this.label(ctx, word, 52 + wl, y + 42, `700 15px ${ROUNDED}`, '#000', 'left');
      this.label(ctx, rest, 52 + wl + wc, y + 42, `15px ${ROUNDED}`, '#fff', 'left');
      ctx.restore();
    }
  },
  shortcuts(ctx, W, H, t) {
    const p = onbCycle(t, 4);
    const keys = [[onbKey('toolHighlighter'), tr('Subrayador'), 0.1], [onbKey('closeTab'), tr('Cerrar pestaña'), 0.4], [onbKey('find'), tr('Buscar'), 0.7]];
    keys.forEach(([k, what, at], i) => {
      const pressed = p > at && p < at + 0.08, active = p > at && p < at + 0.3;
      const y = H / 2 - 100 + i * 70;
      ctx.font = `600 20px ${ROUNDED}`; const kw = Math.max(70, ctx.measureText(k).width + 26);
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.roundRect(0, y + (pressed ? 4 : 4), kw, 50, 10); ctx.fill();
      ctx.fillStyle = onbGray(pressed ? 0.35 : 0.22); ctx.beginPath(); ctx.roundRect(0, y + (pressed ? 3 : 0), kw, 50, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1; ctx.stroke();
      this.label(ctx, k, kw / 2, y + 25 + (pressed ? 3 : 0), `600 20px ${ROUNDED}`, '#fff');
      this.label(ctx, '→', kw + 22, y + 25, `18px ${ROUNDED}`, 'rgba(255,255,255,.4)');
      ctx.save(); ctx.translate(kw + 46, y + 25); const s = active ? 1.06 : 1; ctx.scale(s, s);
      this.label(ctx, what, 0, 0, `600 20px ${ROUNDED}`, active ? '#fff' : 'rgba(255,255,255,.4)', 'left'); ctx.restore();
    });
  },
  share(ctx, W, H, t) {
    const p = onbCycle(t, 3.2), cx = W / 2, cy = H / 2;
    const targets = [['comment', '#34C759', -120, -60], ['mail', '#5AC8FA', 120, -60], ['upload', '#007AFF', -120, 70], ['fileDown', '#fff', 120, 70]];
    targets.forEach(([ic, color, dx, dy], i) => {
      const k = onbSmooth(onbRamp(onbCycle(t + i * 0.2, 3.2), 0.1, 0.5));
      ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + dx * k, cy + dy * k); ctx.stroke(); ctx.setLineDash([]);
      const s = 0.6 + 0.4 * k;
      ctx.save(); ctx.translate(cx + dx, cy + dy); ctx.scale(s, s);
      ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.beginPath(); ctx.arc(0, 0, 27, 0, 7); ctx.fill();
      const img = onbIcon(ic, color, 26, 2); if (img.complete) ctx.drawImage(img, -13, -13, 26, 26);
      ctx.restore();
    });
    const s = 1 + 0.08 * Math.sin(p * Math.PI * 2);
    ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
    const doc = onbIcon('pdf', '#fff', 56, 1.6); if (doc.complete) ctx.drawImage(doc, -28, -28, 56, 56);
    ctx.restore();
  },
};

// ---------- El recorrido ----------
const Onboarding = {
  el: null, stage: null, selected: null, raf: 0,

  maybeShow() {
    let seen = null;
    try { seen = localStorage.getItem(ONB_KEY); } catch (e) { /* sin almacenamiento */ }
    if (!seen) this.open();
  },
  get name() { try { return (localStorage.getItem(ONB_NAME) || '').trim(); } catch (e) { return ''; } },
  set name(v) { try { localStorage.setItem(ONB_NAME, v); } catch (e) { /* nada */ } },
  get firstName() { return this.name.split(/\s+/)[0] || ''; },

  open() {
    this.close(true);
    this.selected = new Set(ONB_TOPICS.map((t) => t.id));
    const el = document.createElement('div');
    el.className = 'onb';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.setAttribute('aria-label', 'Tutorial de Folia');
    el.innerHTML = `<canvas class="onb-aurora" aria-hidden="true"></canvas><div class="onb-stages"></div>
      <button class="onb-glass onb-skip" data-onb="skip">Omitir tutorial</button>`;
    document.body.appendChild(el);
    this.el = el;
    el.addEventListener('click', (e) => this.onClick(e));
    el.addEventListener('keydown', (e) => this.onKey(e));
    this.startAurora();
    this.go('welcome');
  },
  close(silent) {
    cancelAnimationFrame(this.raf);
    cancelAnimationFrame(this.demoRaf);
    cancelAnimationFrame(this.confettiRaf);
    if (!this.el) return;
    const el = this.el;
    this.el = null;
    if (silent) return el.remove();
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 450);
  },
  finish(create) {
    try { localStorage.setItem(ONB_KEY, 'done'); } catch (e) { /* nada */ }
    this.close();
    if (create) setTimeout(() => newNotebookDialog(), 300);
  },

  // Transición entre etapas: entra desde un lado, sale por el otro.
  go(stage, forward = true) {
    const host = this.el?.querySelector('.onb-stages');
    if (!host) return;
    this.stage = stage;
    cancelAnimationFrame(this.demoRaf);
    cancelAnimationFrame(this.confettiRaf);
    // Primero se va el paso actual y, cuando ya se ha desvanecido, entra el siguiente.
    clearTimeout(this.enterTimer);
    host.querySelectorAll('.onb-stage.pending').forEach((x) => x.remove());
    const old = host.querySelector('.onb-stage:not(.out)');
    if (old) { old.classList.add('out', forward ? 'to-left' : 'to-right'); setTimeout(() => old.remove(), 400); }
    const st = document.createElement('div');
    st.className = `onb-stage in ${forward ? 'from-right' : 'from-left'}`;
    st.innerHTML = this.html(stage);
    this.el.querySelector('.onb-skip').hidden = stage === 'done';
    const enter = () => {
      st.classList.remove('pending');
      host.appendChild(st);
      requestAnimationFrame(() => requestAnimationFrame(() => st.classList.add('shown')));
      this.after(stage, st);
    };
    if (old && !onbReduce()) { st.classList.add('pending'); this.enterTimer = setTimeout(enter, 300); } else enter();
  },
  html(stage) {
    const name = this.firstName;
    const glass = (label, act, prominent, extra = '') => `<button class="onb-glass ${prominent ? 'prominent' : ''}" data-onb="${act}" ${extra}>${label}</button>`;
    const arrow = `<span class="onb-arrow">${icon('chevronRight')}</span>`;
    const title = (t, sub) => `<h1 class="onb-title">${esc(t)}</h1><p class="onb-sub">${esc(sub)}</p>`;
    if (stage === 'welcome') {
      return `<div class="onb-center">
        <div class="onb-logo" aria-hidden="true"><div class="onb-cover"></div>
          <svg viewBox="0 0 180 200" class="onb-sign"><path d="M40 125 C 52 76, 64 148, 76 88 C 88 50, 100 150, 114 110 C 128 70, 142 140, 158 92" /></svg>
          <span class="onb-nib">${icon('pen')}</span></div>
        <h1 class="onb-word" aria-label="Folia">${[...'Folia'].map((c, i) => `<span style="--i:${i}">${c}</span>`).join('')}</h1>
        <p class="onb-sub onb-late">Tus apuntes, a mano y a tu manera.</p>
        <div class="onb-langs onb-late" role="group" aria-label="Idioma">${languageButtons('onb-glass')}</div>
        <div class="onb-late2">${glass(`Empezar ${arrow}`, 'start', true)}</div></div>`;
    }
    if (stage === 'name') {
      return `<div class="onb-center">
        <div class="onb-wave" aria-hidden="true">👋</div>
        ${title('¿Cómo te llamas?', 'Así te puedo guiar durante el recorrido.')}
        <label class="onb-name"><input type="text" id="onb-name" placeholder="Tu nombre" autocomplete="given-name" maxlength="40" value="${esc(this.name)}" aria-label="Tu nombre"><i></i></label>
        <div class="onb-row">${glass('Prefiero no decirlo', 'noname', false)}${glass(`Continuar ${arrow}`, 'name', true, this.name ? '' : 'disabled')}</div></div>`;
    }
    if (stage === 'ask') {
      const card = (act, sym, colors, t, sub, prominent) => `<button class="onb-choice ${prominent ? 'prominent' : ''}" data-onb="${act}" style="--c1:${colors[0]};--c2:${colors[1]}">
        <span class="onb-tile">${icon(sym)}</span><b>${t}</b><span>${sub}</span></button>`;
      return `<div class="onb-center">
        ${title(name ? `Encantado, ${name}` : '¡Encantado!', '¿Te enseño cómo funciona Folia? Son un par de minutos y eliges qué ver.')}
        <div class="onb-row onb-rise">${card('yes', 'sparkles', ['#AF52DE', '#007AFF'], 'Sí, enséñame', 'Un recorrido rápido por lo que tú elijas.', true)}
        ${card('no', 'compass', ['#8E8E93', 'rgba(142,142,147,.6)'], 'Ahora no', 'Prefiero explorarla yo. Podré verlo más tarde.', false)}</div></div>`;
    }
    if (stage === 'topics') {
      return `<div class="onb-topics">
        <div class="onb-head">${title(name ? `¿Qué quieres aprender, ${name}?` : '¿Qué quieres aprender?', 'Está todo seleccionado. Quita lo que ya sepas.')}</div>
        <div class="onb-grid">${ONB_TOPICS.map((t, i) => `<button class="onb-topic" data-topic="${t.id}" aria-pressed="${this.selected.has(t.id)}" style="--c1:${t.colors[0]};--c2:${t.colors[1]};--i:${i}">
          <span class="onb-tile">${icon(t.sym)}</span><span class="onb-tt"><b>${t.title}</b><span>${t.subtitle}</span></span>
          <span class="onb-check">${icon('check')}</span></button>`).join('')}</div>
        <div class="onb-row onb-foot">${glass('', 'all', false)}${glass('', 'begin', true)}</div></div>`;
    }
    if (stage.startsWith('lesson:')) {
      const lessons = this.lessons(), index = Number(stage.slice(7)), topic = lessons[index];
      const [intro, steps, tip] = (I18N.lang === 'it' ? onbLessonIt : onbLesson)(topic.id, name);
      return `<div class="onb-lesson" style="--c1:${topic.colors[0]};--c2:${topic.colors[1]}">
        <div class="onb-progress" role="progressbar" aria-valuemin="1" aria-valuemax="${lessons.length}" aria-valuenow="${index + 1}" aria-label="Tema ${index + 1} de ${lessons.length}">
          ${lessons.map((_, i) => `<i class="${i <= index ? 'on' : ''}"></i>`).join('')}</div>
        <div class="onb-lesson-body">
          <div class="onb-demo"><canvas width="388" height="278" aria-hidden="true"></canvas></div>
          <div class="onb-copy">
            <div class="onb-kicker"><span class="onb-tile small">${icon(topic.sym)}</span>Tema ${index + 1} de ${lessons.length}</div>
            <h1>${topic.title}</h1>
            <p class="onb-intro">${esc(intro)}</p>
            <ul class="onb-steps">${steps.map(([sym, text], i) => `<li style="--i:${i}"><span class="onb-step-icon">${icon(sym)}</span><span>${esc(text)}</span></li>`).join('')}</ul>
            ${topic.id === 'language' ? `<div class="onb-langs">${languageButtons('onb-glass')}</div>` : ''}
            <p class="onb-tip"><span>${icon('lightbulb')}</span>${esc(tip)}</p>
          </div></div>
        <div class="onb-nav">${glass(`<span class="onb-arrow back">${icon('back')}</span> Atrás`, 'back', false)}${glass(`${index + 1 === lessons.length ? 'Terminar' : 'Siguiente'} ${arrow}`, 'next', true)}</div></div>`;
    }
    // Final
    return `<canvas class="onb-confetti" aria-hidden="true"></canvas><div class="onb-center">
      <div class="onb-seal" aria-hidden="true"><svg viewBox="0 0 24 24"><defs><linearGradient id="onb-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34C759"/><stop offset="1" stop-color="#32D2FF"/></linearGradient></defs>
        <path fill="url(#onb-g)" d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/>
        <path d="m9 12 2 2 4-4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      ${title(name ? `¡Todo listo, ${name}!` : '¡Todo listo!', 'Puedes volver a ver el tutorial cuando quieras desde + › Ver el tutorial.')}
      <div class="onb-row">${glass('Ir a mis libretas', 'library', false)}${glass(`${icon('plus')} Crear mi primera libreta`, 'create', true)}</div></div>`;
  },
  lessons() { return ONB_TOPICS.filter((t) => this.selected.has(t.id)); },
  /** Al cambiar de idioma: la lección (que lleva tu nombre y tus atajos) se vuelve a escribir. */
  relabel() {
    const st = this.el?.querySelector('.onb-stage:not(.out)');
    if (!st || !this.stage?.startsWith('lesson:')) return;
    const fresh = document.createElement('div');
    fresh.innerHTML = this.html(this.stage);
    const copy = st.querySelector('.onb-copy'), next = fresh.querySelector('.onb-copy');
    if (copy && next) { next.classList.add('instant'); copy.replaceWith(next); }
    st.querySelectorAll('.onb-nav .onb-glass').forEach((b, i) => { const nb = fresh.querySelectorAll('.onb-nav .onb-glass')[i]; if (nb) b.innerHTML = nb.innerHTML; });
  },
  after(stage, st) {
    if (stage === 'welcome') setTimeout(() => st.querySelector('[data-onb="start"]')?.focus({ preventScroll: true }), 2500);
    if (stage === 'name') {
      const input = st.querySelector('#onb-name');
      setTimeout(() => input.focus(), 400);
      input.addEventListener('input', () => {
        st.querySelector('[data-onb="name"]').disabled = !input.value.trim();
        const wave = st.querySelector('.onb-wave');
        wave.classList.remove('waving'); void wave.offsetWidth; wave.classList.add('waving');
      });
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && input.value.trim()) { e.preventDefault(); this.act('name'); } });
    }
    if (stage === 'ask') setTimeout(() => st.querySelector('[data-onb="yes"]')?.focus({ preventScroll: true }), 300);
    if (stage === 'topics') this.refreshTopics(st);
    if (stage.startsWith('lesson:')) this.startDemo(st, this.lessons()[Number(stage.slice(7))]);
    if (stage === 'done') this.startConfetti(st.querySelector('.onb-confetti'));
  },
  refreshTopics(st = this.el?.querySelector('.onb-stage:not(.out)')) {
    if (!st) return;
    const n = this.selected.size, all = n === ONB_TOPICS.length;
    st.querySelectorAll('[data-topic]').forEach((b) => b.setAttribute('aria-pressed', this.selected.has(b.dataset.topic)));
    st.querySelector('[data-onb="all"]').textContent = all ? 'Quitar todo' : 'Seleccionar todo';
    st.querySelector('[data-onb="begin"]').innerHTML = `${n ? `Empezar · ${n} ${n === 1 ? 'tema' : 'temas'}` : 'Terminar'} <span class="onb-arrow">${icon('chevronRight')}</span>`;
  },
  onClick(e) {
    const topic = e.target.closest('[data-topic]');
    if (topic) {
      const id = topic.dataset.topic;
      if (this.selected.has(id)) this.selected.delete(id); else this.selected.add(id);
      topic.classList.remove('pop'); void topic.offsetWidth; topic.classList.add('pop');
      return this.refreshTopics();
    }
    const b = e.target.closest('[data-onb]');
    if (b && !b.disabled) this.act(b.dataset.onb);
  },
  act(a) {
    const stage = this.stage, lesson = stage?.startsWith('lesson:') ? Number(stage.slice(7)) : -1;
    if (a === 'skip') return this.confirmSkip();
    if (a === 'start') return this.go('name');
    if (a === 'noname') { this.name = ''; return this.go('ask'); }
    if (a === 'name') { this.name = this.el.querySelector('#onb-name').value.trim(); return this.go('ask'); }
    if (a === 'yes') return this.go('topics');
    if (a === 'no') return this.finish(false);
    if (a === 'all') { this.selected = this.selected.size === ONB_TOPICS.length ? new Set() : new Set(ONB_TOPICS.map((t) => t.id)); return this.refreshTopics(); }
    if (a === 'begin') return this.go(this.selected.size ? 'lesson:0' : 'done');
    if (a === 'back') return this.go(lesson === 0 ? 'topics' : `lesson:${lesson - 1}`, false);
    if (a === 'next') return this.go(lesson + 1 < this.lessons().length ? `lesson:${lesson + 1}` : 'done');
    if (a === 'library') return this.finish(false);
    if (a === 'create') return this.finish(true);
  },
  onKey(e) {
    if (e.target.closest?.('.onb-confirm')) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); return this.stage === 'done' ? this.finish(false) : this.confirmSkip(); }
    if (this.stage?.startsWith('lesson:') && !e.target.matches('input')) {
      if (e.key === 'ArrowRight') { e.preventDefault(); this.act('next'); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); this.act('back'); }
    }
    if (e.key === 'Enter' && !e.target.closest('button') && !e.target.matches('input')) {
      const main = { welcome: 'start', ask: 'yes', topics: 'begin', done: 'create' }[this.stage];
      if (main) { e.preventDefault(); this.act(main); }
    }
  },
  confirmSkip() {
    if (this.el.querySelector('.onb-confirm')) return;
    const box = document.createElement('div');
    box.className = 'onb-confirm';
    box.innerHTML = `<div class="onb-confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="onb-skip-t">
      <h2 id="onb-skip-t">¿Omitir el tutorial?</h2><p>Podrás verlo cuando quieras desde + › Ver el tutorial.</p>
      <div class="onb-row"><button class="onb-glass" data-c="stay">Seguir con el tutorial</button><button class="onb-glass prominent" data-c="skip">Omitir</button></div></div>`;
    this.el.appendChild(box);
    const done = () => box.remove();
    box.addEventListener('click', (e) => {
      e.stopPropagation();
      const c = e.target.closest('[data-c]')?.dataset.c;
      if (c === 'skip') { done(); this.finish(false); } else if (c === 'stay' || e.target === box) done();
    });
    box.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(); } });
    setTimeout(() => box.querySelector('[data-c="stay"]').focus(), 30);
  },

  // ---------- Fondo: aurora con estrellas (30 fotogramas por segundo) ----------
  startAurora() {
    const canvas = this.el.querySelector('.onb-aurora'), ctx = canvas.getContext('2d');
    let last = 0;
    const blobs = [['115,64,242', 0.7, (t) => 0.25 + 0.08 * Math.sin(t * 0.21), (t) => 0.3 + 0.1 * Math.cos(t * 0.17)],
      ['26,153,217', 0.6, (t) => 0.75 + 0.07 * Math.cos(t * 0.19), (t) => 0.65 + 0.08 * Math.sin(t * 0.23)],
      ['217,64,153', 0.45, (t) => 0.6 + 0.1 * Math.sin(t * 0.13), (t) => 0.2 + 0.07 * Math.sin(t * 0.29)],
      ['51,64,204', 0.5, (t) => 0.2 + 0.06 * Math.cos(t * 0.11), (t) => 0.85 + 0.05 * Math.cos(t * 0.31)]];
    const frame = (now) => {
      if (!this.el) return;
      this.raf = requestAnimationFrame(frame);
      if (now - last < 1000 / 30 && last) return;
      last = now;
      const dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
      if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) { canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); }
      const t = onbReduce() ? 0 : now / 1000;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = 'rgb(10,10,26)'; ctx.fillRect(0, 0, W, H);
      for (const [rgb, size, fx, fy] of blobs) {
        const x = W * fx(t), y = H * fy(t), r = W * size * 0.62;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(${rgb},.55)`); g.addColorStop(0.5, `rgba(${rgb},.25)`); g.addColorStop(1, `rgba(${rgb},0)`);
        ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }
      const rnd = onbRandom(7);
      for (let i = 0; i < 110; i++) {
        const x = rnd() * W, y = rnd() * H, phase = rnd() * 6.28, r = 0.6 + rnd() * 1.2;
        ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.5 * (0.5 + 0.5 * Math.sin(t * 1.3 + phase))})`;
        ctx.beginPath(); ctx.arc(x + r, y + r, r, 0, 7); ctx.fill();
      }
      if (onbReduce()) cancelAnimationFrame(this.raf);
    };
    this.raf = requestAnimationFrame(frame);
  },
  startDemo(st, topic) {
    const canvas = st.querySelector('.onb-demo canvas'), ctx = canvas.getContext('2d');
    const dpr = Math.min(devicePixelRatio || 1, 2), W = 388, H = 278;
    canvas.width = W * dpr; canvas.height = H * dpr;
    // El reloj de la animación empieza al entrar en el tema (tras la entrada de la tarjeta).
    const start = (this.demoStart = performance.now() + 350);
    const frame = (now) => {
      if (!document.contains(canvas)) return;
      this.demoRaf = requestAnimationFrame(frame);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.save();
      OnbDemos[topic.id](ctx, W, H, onbReduce() ? 1.6 : Math.max(0, now - start) / 1000, topic.colors);
      ctx.restore();
    };
    this.demoRaf = requestAnimationFrame(frame);
  },
  startConfetti(canvas) {
    if (!canvas || onbReduce()) return;
    const ctx = canvas.getContext('2d'), start = performance.now();
    const colors = ['#FF2D55', '#AF52DE', '#32D2FF', '#FFD60A', '#34C759', '#FF9500', '#007AFF'];
    const frame = (now) => {
      if (!document.contains(canvas)) return;
      const t = (now - start) / 1000, dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
      if (canvas.width !== Math.round(W * dpr)) { canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      const rnd = onbRandom(42);
      let alive = false;
      for (let i = 0; i < 140; i++) {
        const x0 = rnd() * W, delay = rnd() * 0.6, speed = 180 + rnd() * 260, sway = rnd() * 40, spin = rnd() * 8 - 4;
        const time = Math.max(0, t - delay), y = -20 + speed * time + 60 * time * time;
        if (y > H + 20) continue;
        alive = true;
        ctx.save(); ctx.translate(x0 + sway * Math.sin(time * 3 + i), y); ctx.rotate(spin * time);
        ctx.globalAlpha = Math.min(1, Math.max(0, 3.5 - time));
        ctx.fillStyle = colors[i % colors.length]; ctx.beginPath(); ctx.roundRect(-4, -7, 8, 14, 2); ctx.fill();
        ctx.restore();
      }
      if (alive && t < 4) this.confettiRaf = requestAnimationFrame(frame);
    };
    this.confettiRaf = requestAnimationFrame(frame);
  },
};

// =============================================================================
// Libretas de ejemplo (la primera vez) e inicio
// =============================================================================
/** Libretas de ejemplo creadas antes: el subrayado era un trazo que, según la letra del ordenador,
 *  no caía encima del texto. Se cambia por el resaltado del propio texto (una sola vez). */
function fixExampleHighlights(nb) {
  let changed = false;
  for (const page of nb.pages) {
    const before = page.strokes.length;
    page.strokes = page.strokes.filter((s) => !(s.tool === 'highlighter' && s.points[0] && ((s.points[0][0] === 392 && s.points[0][1] === 194) || (s.points[0][0] === 92 && s.points[0][1] === 170))));
    if (page.strokes.length === before) continue;
    for (const it of page.items) {
      for (const words of ['<b>perfectamente rectos</b>', '<b>membrana plasmática</b>']) {
        if (it.html?.includes(words) && !it.html.includes('<span style="background-color:#FFE66B">' + words)) it.html = it.html.replace(words, '<span style="background-color:#FFE66B">' + words + '</span>');
      }
    }
    changed = true;
  }
  if (changed) { touch(nb); Store.put(nb); }
}
/** La app se llamaba Libreta: la libreta de bienvenida pasa a llamarse con el nombre nuevo (si no se le cambió el título). */
function renameWelcome(nb) {
  const titles = { 'Bienvenida a Libreta': 'Bienvenida a Folia', 'Benvenuto in Libreta': 'Benvenuto in Folia' };
  if (!titles[nb.title]) return;
  nb.title = titles[nb.title];
  for (const page of nb.pages) for (const it of page.items) if (it.html) it.html = it.html.replace('esto es Libreta', 'esto es Folia').replace('questa è Libreta', 'questa è Folia');
  Store.put(nb);
}
/** Las libretas de ejemplo que aún no se han abierto se cambian al idioma elegido (y su carpeta). */
function translateExamples() {
  const old = S.notebooks.filter((n) => n.example);
  // Solo si siguen todas sin abrir (si ya usaste alguna, se quedan como están).
  if (old.length < 2) return;
  const folder = Folders.byId(old[0].folder);
  for (const nb of old) { S.notebooks = S.notebooks.filter((n) => n.id !== nb.id); Store.remove(nb.id); S.tabs = S.tabs.filter((id) => id !== nb.id); }
  saveTabs();
  for (const nb of exampleNotebooks()) { delete nb.space; nb.folder = folder?.id || null; S.notebooks.push(nb); Store.put(nb); }
  if (folder && ['Ejemplos', 'Esempi'].includes(folder.name)) Folders.rename(folder.id, I18N.lang === 'it' ? 'Esempi' : 'Ejemplos');
}
function exampleNotebooks() {
  const L = (es, it) => (I18N.lang === 'it' ? it : es);
  const style = (o) => Object.assign({}, DEFAULT_TEXT, o);
  const text = (x, y, w, html, base) => ({ id: uid(), type: 'text', x, y, w, html, base: style(base) });
  const line = (pts) => Shapes.densify(pts).map(([x, y]) => [x, y, 0.5]);

  const temas = newNotebook(L('Biología · Tema 3', 'Biologia · Tema 3'), '#2E7D4F', 'ruled', 'white');
  temas.space = L('Ejemplos', 'Esempi');
  temas.example = true;
  temas.pages.push(newPage('grid', 'cream'));
  const [t1, t2] = temas.pages;
  t1.items.push(
    text(64, 60, 660, L('La célula', 'La cellula'), { font: 'serif', size: 40, bold: true }),
    text(64, 140, 660, L('La <span style="background-color:#FFE66B"><b>membrana plasmática</b></span> separa el interior de la célula del exterior y controla qué entra y qué sale.', 'La <span style="background-color:#FFE66B"><b>membrana plasmatica</b></span> separa l’interno della cellula dall’esterno e controlla cosa entra e cosa esce.'), { size: 21 }),
    { id: uid(), type: 'sticky', x: 520, y: 320, w: 220, h: 200, color: STICKY_COLORS[0], html: L('Repasar el <b>transporte activo</b> antes del examen', 'Ripassare il <b>trasporto attivo</b> prima dell’esame'), base: style({ font: 'hand', size: 24 }) },
    { id: uid(), type: 'comment', x: 30, y: 150, title: L('Profe', 'Prof'), color: COMMENT_COLORS[0], expanded: false, html: L('Esto entra seguro en el examen.', 'Questo esce sicuro all’esame.'), base: style({ size: 16 }) },
  );
  t2.items.push(text(64, 60, 660, L('Esquema del orgánulo', 'Schema dell’organello'), { font: 'serif', size: 32, bold: true }));
  const circle = Array.from({ length: 70 }, (_, i) => { const a = (i / 64) * Math.PI * 2; return [400 + 150 * Math.cos(a), 360 + 100 * Math.sin(a), 0.5]; });
  t2.strokes.push({ id: uid(), tool: 'pen', kind: 'pen', color: '#1E5BD8', width: 3, points: circle });
  temas.outline = [{ id: uid(), title: L('La célula', 'La cellula'), pageId: t1.id, level: 0 }, { id: uid(), title: L('Esquema', 'Schema'), pageId: t2.id, level: 1 }];

  const nb = newNotebook(L('Bienvenida a Folia', 'Benvenuto in Folia'), '#1F7A8C', 'dots', 'white');
  nb.space = L('Ejemplos', 'Esempi');
  nb.example = true;
  const page = nb.pages[0];
  const link = `<a data-link='${JSON.stringify({ nb: temas.id, page: t2.id })}'>${L('esquema del orgánulo', 'schema dell’organello')}</a>`;
  page.items.push(
    text(64, 70, 640, L('Hola, esto es Folia', 'Ciao, questa è Folia'), { font: 'serif', size: 40, bold: true }),
    text(64, 150, 660, L('Prueba el bolígrafo (P) y escribe aquí debajo. Con el subrayador (H) en «H / V», tus subrayados quedan <span style="background-color:#FFE66B"><b>perfectamente rectos</b></span>.', 'Prova la penna (P) e scrivi qui sotto. Con l’evidenziatore (H) in «H / V», le tue sottolineature restano <span style="background-color:#FFE66B"><b>perfettamente dritte</b></span>.'), { size: 21 }),
    text(64, 300, 300, L('Dibuja un círculo y mantén el ratón quieto al final: se vuelve perfecto.', 'Disegna un cerchio e tieni fermo il mouse alla fine: diventa perfetto.'), { font: 'hand', size: 26, color: '#1E5BD8' }),
    text(64, 560, 660, L(`Los enlaces llevan a otras libretas o páginas: haz clic en el ${link} para verlo. Activa el <b>Modo dinámico</b> en la biblioteca para ver cómo se relacionan tus libretas.`, `I collegamenti portano ad altri quaderni o pagine: fai clic sullo ${link} per vederlo. Attiva la <b>Modalità dinamica</b> nella libreria per vedere come si collegano i tuoi quaderni.`), { size: 19 }),
    { id: uid(), type: 'link', x: 64, y: 700, w: 300, h: 56, target: { nb: temas.id, page: null } },
    text(64, 980, 660, L('Todo se guarda en este navegador. Para pasarle tus apuntes a alguien, usa Compartir → PDF. Para llevártelo todo a otro ordenador, usa «Copia de seguridad».', 'Tutto si salva in questo browser. Per passare i tuoi appunti a qualcuno, usa Condividi → PDF. Per portare tutto su un altro computer, usa «Backup».'), { size: 17, color: '#5D6475', italic: true }),
  );
  const c2 = Array.from({ length: 70 }, (_, i) => { const a = (i / 64) * Math.PI * 2; return [520 + 70 * Math.cos(a), 360 + 70 * Math.sin(a), 0.5]; });
  page.strokes.push({ id: uid(), tool: 'pen', kind: 'pen', color: '#E0362C', width: 3, points: c2 });
  page.strokes.push({ id: uid(), tool: 'pen', kind: 'pen', color: '#1C1C1E', width: 2.5, points: line([[370, 345], [440, 360]]) });
  page.strokes.push({ id: uid(), tool: 'pen', kind: 'pen', color: '#1C1C1E', width: 2.5, points: line([[424, 346], [440, 360], [422, 372]]) });
  return [nb, temas];
}

async function start() {
  startI18n();
  Pomo.load();
  Shortcuts.load();
  await Store.open();
  S.notebooks = (await Store.all()).map(normalizeNotebook);
  S.notebooks.forEach(fixExampleHighlights);
  S.notebooks.forEach(renameWelcome);
  const seeded = Prefs.load().seeded;
  if (!S.notebooks.length && !seeded) {
    for (const nb of exampleNotebooks()) { S.notebooks.push(nb); Store.put(nb); }
    Prefs.save(Object.assign(Prefs.load(), { seeded: true }));
  }
  // Carpetas. Los «espacios» de versiones anteriores (y los ejemplos) pasan a carpetas, una sola vez.
  Folders.list = await Store.get('folders', []);
  const spaces = await Store.get('spaces', []);
  const before = new Set(Folders.list.map((f) => f.id));
  Folders.migrate(S.notebooks, spaces);
  for (const nb of S.notebooks) if (nb._migrated) { delete nb._migrated; Store.put(nb); }
  if (spaces.length) Store.set('spaces', []);
  Folders.save();
  S.dynpos = await Store.get('dynpos', {});
  // Las posiciones del modo dinámico iban por nombre de espacio: ahora, por carpeta.
  for (const f of Folders.list) if (!before.has(f.id) && S.dynpos[f.name]) { S.dynpos[f.id] = S.dynpos[f.name]; delete S.dynpos[f.name]; Store.set('dynpos', S.dynpos); }
  const tabs = await Store.get('tabs', { tabs: [], active: null });
  S.tabs = (tabs.tabs || []).filter((id) => nbById(id));
  S.active = null; // se empieza siempre en la biblioteca; las pestañas siguen abiertas
  renderLibrary();
  Onboarding.maybeShow();
  // Descargas (PDF, PNG y copia): solo si el visor lo permite.
  try { if (window.claude?.use) S.downloads = await window.claude.use('downloads'); } catch (e) { S.downloads = null; }
}
start();

// ---------- App instalable (versión publicada, no en la página de claude.ai) ----------
if ('serviceWorker' in navigator && location.protocol !== 'file:' && document.querySelector('link[rel="manifest"]')) {
  navigator.serviceWorker.register('sw.js').then((registration) => {
    // Versión nueva esperando: se avisa y se aplica cuando el usuario quiera.
    const offer = (worker) => {
      if (!worker || !navigator.serviceWorker.controller) return;
      const bar = document.createElement('div');
      bar.className = 'toast';
      bar.innerHTML = 'Hay una versión nueva de Folia. <button class="btn primary" style="margin-left:10px">Actualizar</button>';
      bar.querySelector('button').onclick = () => { flushAll(); worker.postMessage('skipWaiting'); };
      document.body.appendChild(bar);
    };
    if (registration.waiting) offer(registration.waiting);
    registration.addEventListener('updatefound', () => {
      const worker = registration.installing;
      worker?.addEventListener('statechange', () => { if (worker.state === 'installed') offer(worker); });
    });
  }).catch(() => { /* sin modo sin conexión */ });
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
}
// «Instalar Folia en este ordenador» (Chrome y Edge): aparece en el menú + de la biblioteca.
addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  window.libretaInstall = async () => {
    event.prompt();
    await event.userChoice.catch(() => {});
    window.libretaInstall = null;
  };
});
addEventListener('appinstalled', () => { window.libretaInstall = null; toast('Folia instalada. Ábrela desde el menú Inicio o el Dock.'); });
// Que el navegador no borre las libretas para hacer sitio.
navigator.storage?.persist?.().catch(() => {});
