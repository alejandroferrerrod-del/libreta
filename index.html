function addOutline(nb, page, title) {
  const num = (id) => nb.pages.findIndex((p) => p.id === id);
  const at = nb.outline.findIndex((o) => num(o.pageId) > num(page.id));
  const index = at < 0 ? nb.outline.length : at;
  nb.outline.splice(index, 0, { id: uid(), title, pageId: page.id, level: index > 0 ? nb.outline[index - 1].level : 0 });
  touch(); renderSidebar();
}
function renderOutline(body, nb) {
  const num = (id) => nb.pages.findIndex((p) => p.id === id);
  const current = [...nb.outline].reverse().find((o) => num(o.pageId) >= 0 && num(o.pageId) <= currentPageIndex)?.id;
  body.innerHTML = `<button class="btn" id="ol-add" style="width:100%;justify-content:center;margin-bottom:10px">+ Añadir página ${currentPageIndex + 1}</button>
    ${nb.outline.length ? nb.outline.map((o) => `<div class="outline-row ${o.id === current ? 'current' : ''}" data-current="${o.id === current}" data-ol="${o.id}" draggable="true" style="padding-left:${6 + o.level * 16}px">
      <span class="lvl${o.level}">${esc(o.title)}</span><span class="pg">${num(o.pageId) >= 0 ? num(o.pageId) + 1 : '—'}</span></div>`).join('')
      : '<p class="side-empty">Esquema vacío. Crea un índice: añade la página actual con un título y usa clic derecho para hacer apartados y subapartados.</p>'}`;
  $('#ol-add', body).onclick = () => promptDialog(`Añadir la página ${currentPageIndex + 1} al esquema`, '', (title) => addOutline(nb, nb.pages[currentPageIndex], title), 'Título del apartado');
  body.onclick = (e) => { const r = e.target.closest('[data-ol]'); if (r) { const o = nb.outline.find((x) => x.id === r.dataset.ol); if (o && num(o.pageId) >= 0) scrollToPage(o.pageId); } };
  body.oncontextmenu = (e) => {
    const r = e.target.closest('[data-ol]');
    if (!r) return;
    e.preventDefault();
    const i = nb.outline.findIndex((x) => x.id === r.dataset.ol), o = nb.outline[i];
    popover({ x: e.clientX, y: e.clientY }, `<button data-act="rename">Renombrar…</button>
      <button data-act="in" ${i === 0 || o.level > nb.outline[i - 1].level || o.level >= 3 ? 'disabled' : ''}>Sangrar (subapartado)</button>
      <button data-act="out" ${o.level === 0 ? 'disabled' : ''}>Quitar sangría</button><hr><button data-act="del">Eliminar del esquema</button>`, (act) => {
      if (act === 'rename') return promptDialog('Renombrar apartado', o.title, (v) => { o.title = v; touch(); renderSidebar(); }, 'Título');
      if (act === 'in') o.level++;
      if (act === 'out') o.level--;
      if (act === 'del') nb.outline.splice(i, 1);
      touch(); renderSidebar();
    });
  };
  body.ondragstart = (e) => { const r = e.target.closest('[data-ol]'); if (r) e.dataTransfer.setData('text/x-libreta-outline', r.dataset.ol); };
  body.ondragover = (e) => { if (e.dataTransfer.types.includes('text/x-libreta-outline')) e.preventDefault(); };
  body.ondrop = (e) => {
    const id = e.dataTransfer.getData('text/x-libreta-outline'), r = e.target.closest('[data-ol]');
    if (!id || !r || r.dataset.ol === id) return;
    e.preventDefault();
    const from = nb.outline.findIndex((x) => x.id === id);
    const [moved] = nb.outline.splice(from, 1);
    nb.outline.splice(nb.outline.findIndex((x) => x.id === r.dataset.ol), 0, moved);
    if (nb.outline[0]) nb.outline[0].level = 0;
    touch(); renderSidebar();
  };
}

// ---------- Búsqueda en la libreta ----------
function openSearchPanel() {
  $('.search-panel')?.remove();
  const nb = activeNb();
  const panel = document.createElement('div');
  panel.className = 'search-panel';
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-label', 'Buscar en la libreta');
  panel.innerHTML = `<div style="display:flex;align-items:center"><label class="search" for="nb-q">${icon('search')}<input id="nb-q" type="search" placeholder="Buscar en «${esc(nb.title)}»" autocomplete="off"></label>
    <button class="icon-btn" data-x aria-label="Cerrar búsqueda">${icon('close')}</button></div><div class="list" id="nb-results"></div>`;
  document.body.appendChild(panel);
  const input = $('#nb-q', panel), list = $('#nb-results', panel);
  input.focus();
  const run = () => {
    const q = input.value.trim();
    if (!q) { list.innerHTML = ''; return; }
    const hits = searchNotebook(nb, q, 60);
    list.innerHTML = hits.length ? hits.map((h) => `<button class="result" data-page="${h.pageId}" data-item="${h.itemId || ''}"><span><span class="where">Página ${h.pageIndex + 1} · ${SOURCE_NAMES[h.source]}</span><br>${h.snippet}</span></button>`).join('')
      : '<p class="side-empty">Sin resultados. La escritura a mano no se puede buscar en la versión web.</p>';
  };
  input.addEventListener('input', run);
  panel.addEventListener('click', (e) => {
    if (e.target.closest('[data-x]')) return panel.remove();
    const r = e.target.closest('.result');
    if (!r) return;
    if (r.dataset.item) flashItem(r.dataset.page, r.dataset.item, input.value.trim());
    else { scrollToPage(r.dataset.page); setTimeout(() => flashRect(r.dataset.page, null), 350); }
  });
  panel.addEventListener('keydown', (e) => { if (e.key === 'Escape') panel.remove(); });
}

// ---------- Copiar, cortar y pegar ----------
function copySelection() {
  if (S.lasso) {
    S.clipboard = { kind: 'strokes', data: clone(lassoStrokes()), pageId: S.lasso.pageId, text: ' ' };
  } else {
    const found = findItem(S.selected);
    if (!found) return false;
    S.clipboard = { kind: 'item', data: clone(found.item), pageId: found.page.id, text: RICH_TYPES.includes(found.item.type) ? itemText(found.item) || ' ' : ' ' };
  }
  navigator.clipboard?.writeText?.(S.clipboard.text).catch(() => {});
  toast('Copiado');
  return true;
}
function deleteSelection() {
  if (S.lasso) {
    const page = activeNb().pages.find((p) => p.id === S.lasso.pageId), before = snapshotPage(page);
    page.strokes = page.strokes.filter((s) => !S.lasso.ids.includes(s.id));
    commit(page, before); clearLasso(); return;
  }
  const found = findItem(S.selected || S.editing);
  if (!found) return;
  const before = snapshotPage(found.page);
  found.page.items = found.page.items.filter((i) => i.id !== found.item.id);
  S.selected = S.editing = null;
  commit(found.page, before);
  renderItems(found.page);
  renderOptions();
}
function duplicateSelection() { if (copySelection()) pasteInternal(); }
function pasteInternal() {
  const cb = S.clipboard;
  if (!cb) return false;
  updateCurrentPage();
  const page = activeNb().pages[currentPageIndex];
  const before = snapshotPage(page);
  const offset = cb.pageId === page.id ? 24 : 0;
  if (cb.kind === 'strokes') {
    const strokes = clone(cb.data).map((s) => ({ ...s, id: uid(), points: s.points.map(([x, y, p]) => [x + offset, y + offset, p]) }));
    page.strokes.push(...strokes);
    cb.data = clone(strokes); cb.pageId = page.id;
    commit(page, before); renderInk(page);
    if (S.tool !== 'lasso') setTool('lasso');
    setLasso(page, strokes.map((s) => s.id));
    return true;
  }
  const item = clone(cb.data);
  item.id = uid(); item.x += offset; item.y += offset;
  if (item.type === 'comment') item.expanded = false;
  cb.data = clone(item); cb.pageId = page.id;
  page.items.push(item);
  commit(page, before);
  if (INK_TOOLS.includes(S.tool)) setTool('select');
  renderItems(page);
  select({ pageId: page.id, itemId: item.id });
  return true;
}
function pasteText(text) {
  updateCurrentPage();
  const page = activeNb().pages[currentPageIndex];
  const base = Object.assign({}, S.textDefault);
  if (page.paper === 'dark' && luminance(base.color) < 0.4) base.color = '#F2F2F7';
  const desk = $('#desk'), v = views.get(page.id);
  const y = Math.max(20, (desk.scrollTop + desk.clientHeight / 3 - v.wrap.offsetTop) / S.zoom);
  const item = { id: uid(), type: 'text', x: 110, y: Math.min(page.h - 80, y), w: 520, html: textToHTML(text), base };
  const before = snapshotPage(page);
  page.items.push(item);
  commit(page, before);
  if (INK_TOOLS.includes(S.tool)) setTool('select');
  renderItems(page);
  select({ pageId: page.id, itemId: item.id });
}
const typingInField = () => { const a = document.activeElement; return a && (a.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)); };
document.addEventListener('copy', (e) => {
  if (S.view !== 'editor' || typingInField() || (!S.selected && !S.lasso)) return;
  if (copySelection()) { e.clipboardData?.setData('text/plain', S.clipboard.text); e.preventDefault(); }
});
document.addEventListener('cut', (e) => {
  if (S.view !== 'editor' || typingInField() || (!S.selected && !S.lasso)) return;
  if (copySelection()) { e.clipboardData?.setData('text/plain', S.clipboard.text); e.preventDefault(); deleteSelection(); }
});
document.addEventListener('paste', (e) => {
  if (S.view !== 'editor' || typingInField()) return;
  const files = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith('image/'));
  const text = e.clipboardData?.getData('text/plain') || '';
  e.preventDefault();
  // Si lo último copiado es nuestro, se pega eso; si no, la imagen o el texto de otra app.
  if (S.clipboard && !files.length && (!text || text === S.clipboard.text)) { pasteInternal(); return; }
  if (files.length) { files.forEach((f, i) => insertImageFile(f, null, files.length - 1 - i)); return; }
  if (text.trim()) pasteText(text);
});

// ---------- Deshacer y rehacer ----------
function snapshotPage(page) { return clone({ strokes: page.strokes, items: page.items, template: page.template, paper: page.paper }); }
function commit(page, before) {
  const nb = activeNb();
  (S.undo[nb.id] = S.undo[nb.id] || []).push({ pageId: page.id, state: before });
  if (S.undo[nb.id].length > 150) S.undo[nb.id].shift();
  S.redo[nb.id] = [];
  page._v = (page._v || 0) + 1;
  touch(nb);
  clearTimeout(Dyn.sideTimer);
  Dyn.sideTimer = setTimeout(() => { if (S.sidebarMode !== 'outline') loadThumbs($('#side-body') || document.createElement('div'), nb); }, 600);
}
function restore(from, to) {
  if (S.editing) { document.activeElement?.blur?.(); stopEditing(); }
  const nb = activeNb();
  const entry = (from[nb.id] || []).pop();
  if (!entry) return;
  const page = nb.pages.find((p) => p.id === entry.pageId);
  if (!page) return;
  (to[nb.id] = to[nb.id] || []).push({ pageId: page.id, state: snapshotPage(page) });
  Object.assign(page, clone(entry.state));
  page._v = (page._v || 0) + 1;
  S.selected = S.editing = null;
  clearLasso();
  renderPaper(page); renderInk(page); renderItems(page); renderOptions();
  touch(nb);
  loadThumbs($('#side-body') || document.createElement('div'), nb);
}
const undo = () => restore(S.undo, S.redo);
const redo = () => restore(S.redo, S.undo);

// ---------- Teclado ----------
// El resto de atajos (herramientas, pestañas, deshacer, buscar…) están en shortcuts.js y se pueden cambiar.
document.addEventListener('keydown', (e) => {
  if (S.view !== 'editor' || e.defaultPrevented) return;
  if (typingInField()) {
    if (e.key === 'Escape' && document.activeElement.isContentEditable) document.activeElement.blur();
    return;
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && (S.selected || S.lasso)) { e.preventDefault(); return deleteSelection(); }
  if (e.key === 'Escape') { closePopover(); previewEl?.remove(); $('.search-panel')?.remove(); $('#pomo-panel')?.remove(); clearLasso(); return select(null); }
});

// =============================================================================
// Atajos de teclado personalizables (como en la app nativa).
// «mod» es ⌘ en el Mac y Ctrl en Windows. Las combinaciones que el navegador se reserva (cerrar
// pestaña, nueva ventana, recargar…) no se pueden usar; por eso las pestañas de Libreta van con Alt.
// =============================================================================
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform) || /Mac OS/.test(navigator.userAgent);

const SHORTCUT_GROUPS = ['Herramientas', 'Pestañas', 'Edición', 'Texto', 'Páginas', 'Otros'];
const K = (key, o = {}) => ({ key, mod: !!o.mod, shift: !!o.shift, alt: !!o.alt, ctrl: !!o.ctrl });
/** [id, grupo, título, dónde funciona, teclas de serie] */
const SHORTCUT_ACTIONS = [
  ['toolPen', 'Herramientas', 'Bolígrafo', 'editor', [K('p')]],
  ['toolHighlighter', 'Herramientas', 'Subrayador', 'editor', [K('h')]],
  ['toolEraser', 'Herramientas', 'Goma', 'editor', [K('e')]],
  ['toolLasso', 'Herramientas', 'Lazo', 'editor', [K('l')]],
  ['toolText', 'Herramientas', 'Texto', 'editor', [K('t')]],
  ['toolSticky', 'Herramientas', 'Post-it', 'editor', [K('n')]],
  ['toolComment', 'Herramientas', 'Comentario', 'editor', [K('c')]],
  ['toolLink', 'Herramientas', 'Enlace', 'editor', [K('k')]],
  ['toolSelect', 'Herramientas', 'Seleccionar', 'editor', [K('v')]],
  ['insertImage', 'Herramientas', 'Insertar imagen', 'editor', [K('i', { alt: true })]],
  ['closeTab', 'Pestañas', 'Cerrar pestaña', 'editor', [K('w', { alt: true })]],
  ['nextTab', 'Pestañas', 'Pestaña siguiente', 'editor', [K('right', { alt: true })]],
  ['previousTab', 'Pestañas', 'Pestaña anterior', 'editor', [K('left', { alt: true })]],
  ...[1, 2, 3, 4, 5, 6, 7, 8].map((n) => [`tab${n}`, 'Pestañas', `Pestaña ${n}`, 'editor', [K(String(n), { alt: true })]]),
  ['lastTab', 'Pestañas', 'Última pestaña', 'editor', [K('9', { alt: true })]],
  ['backToLibrary', 'Pestañas', 'Volver a la biblioteca', 'editor', [K('l', { alt: true })]],
  ['undo', 'Edición', 'Deshacer', 'editor', [K('z', { mod: true })]],
  ['redo', 'Edición', 'Rehacer', 'editor', [K('z', { mod: true, shift: true }), K('y', { mod: true })]],
  ['find', 'Edición', 'Buscar', 'both', [K('f', { mod: true })]],
  ['bold', 'Texto', 'Negrita', 'editor', [K('b', { mod: true })]],
  ['italic', 'Texto', 'Cursiva', 'editor', [K('i', { mod: true })]],
  ['underline', 'Texto', 'Subrayado', 'editor', [K('u', { mod: true })]],
  ['strikethrough', 'Texto', 'Tachado', 'editor', [K('x', { mod: true, shift: true })]],
  ['biggerText', 'Texto', 'Letra más grande', 'editor', [K('+', { mod: true }), K('=', { mod: true })]],
  ['smallerText', 'Texto', 'Letra más pequeña', 'editor', [K('-', { mod: true })]],
  ['newPage', 'Páginas', 'Añadir página', 'editor', [K('p', { alt: true })]],
  ['nextPage', 'Páginas', 'Página siguiente', 'editor', [K('right', { mod: true })]],
  ['previousPage', 'Páginas', 'Página anterior', 'editor', [K('left', { mod: true })]],
  ['pagesOverview', 'Páginas', 'Ver todas las páginas', 'editor', [K('p', { mod: true, shift: true })]],
  ['bookmark', 'Páginas', 'Marcador de la página', 'editor', [K('d', { mod: true })]],
  ['share', 'Páginas', 'Compartir', 'editor', [K('s', { mod: true, shift: true })]],
  ['toggleSidebar', 'Páginas', 'Mostrar u ocultar la barra lateral', 'editor', [K('s', { mod: true, alt: true })]],
  ['timer', 'Otros', 'Temporizador de estudio', 'editor', [K('t', { alt: true })]],
  ['newNotebook', 'Otros', 'Nueva libreta', 'library', [K('n', { alt: true })]],
  ['shortcutsSettings', 'Otros', 'Atajos de teclado', 'both', [K('?')]],
];
const SHORTCUT_BY_ID = Object.fromEntries(SHORTCUT_ACTIONS.map((a) => [a[0], { id: a[0], group: a[1], title: a[2], where: a[3], defaults: a[4] }]));

const Shortcuts = {
  map: {},
  recording: false,

  load() {
    try { this.map = JSON.parse(localStorage.getItem('libreta-shortcuts') || '{}'); } catch (e) { this.map = {}; }
  },
  save() { try { localStorage.setItem('libreta-shortcuts', JSON.stringify(this.map)); } catch (e) { /* sin guardar */ } },
  bindings(id) { return this.map[id] || SHORTCUT_BY_ID[id].defaults; },
  same: (a, b) => a.key === b.key && a.mod === b.mod && a.shift === b.shift && a.alt === b.alt && a.ctrl === b.ctrl,
  owner(binding) { return SHORTCUT_ACTIONS.map((a) => a[0]).find((id) => this.bindings(id).some((b) => this.same(b, binding))); },
  /** Pone una combinación (en lugar de `old`, o añadida). Si otra acción la tenía, se le quita y se devuelve. */
  assign(binding, id, old) {
    const owner = this.owner(binding);
    if (owner && owner !== id) this.map[owner] = this.bindings(owner).filter((b) => !this.same(b, binding));
    const list = [...this.bindings(id)];
    const index = old ? list.findIndex((b) => this.same(b, old)) : -1;
    if (index >= 0) list[index] = binding; else if (!list.some((b) => this.same(b, binding))) list.push(binding);
    this.map[id] = list;
    this.save();
    return owner && owner !== id ? owner : null;
  },
  remove(binding, id) { this.map[id] = this.bindings(id).filter((b) => !this.same(b, binding)); this.save(); },
  reset(id) {
    for (const b of SHORTCUT_BY_ID[id].defaults) {
      const owner = this.owner(b);
      if (owner && owner !== id) this.map[owner] = this.bindings(owner).filter((x) => !this.same(x, b));
    }
    delete this.map[id];
    this.save();
  },
  resetAll() { this.map = {}; this.save(); },
  isDefault(id) { return JSON.stringify(this.bindings(id)) === JSON.stringify(SHORTCUT_BY_ID[id].defaults); },

  /** «⌥W» en el Mac; «Alt+W» en Windows. */
  display(b) {
    const names = { left: '←', right: '→', up: '↑', down: '↓', tab: '⇥', enter: '↩', escape: 'Esc', ' ': 'Espacio', backspace: '⌫', delete: 'Supr' };
    const key = names[b.key] || b.key.toUpperCase();
    if (IS_MAC) return `${b.ctrl ? '⌃' : ''}${b.alt ? '⌥' : ''}${b.shift ? '⇧' : ''}${b.mod ? '⌘' : ''}${key}`;
    return [b.mod && 'Ctrl', b.alt && 'Alt', b.shift && 'Mayús', key].filter(Boolean).join('+');
  },
  /** La combinación de una pulsación (con Alt se mira la tecla física: en el Mac, ⌥1 escribe «¡»). */
  fromEvent(e) {
    let key;
    if (/^Key[A-Z]$/.test(e.code) && (e.altKey || e.metaKey || e.ctrlKey)) key = e.code.slice(3).toLowerCase();
    else if (/^Digit\d$/.test(e.code) && (e.altKey || e.metaKey || e.ctrlKey)) key = e.code.slice(5);
    else key = { arrowleft: 'left', arrowright: 'right', arrowup: 'up', arrowdown: 'down' }[e.key.toLowerCase()] || e.key.toLowerCase();
    if (['shift', 'control', 'alt', 'meta', 'capslock', 'dead'].includes(key)) return null;
    // «?» y «+» ya llevan Mayús en el teclado: no cuenta como modificador.
    const shift = ['?', '+', '!', '¡', '¿'].includes(key) ? false : e.shiftKey;
    return { key, mod: IS_MAC ? e.metaKey : e.ctrlKey, shift, alt: e.altKey, ctrl: IS_MAC ? e.ctrlKey : false };
  },
  /** Combinaciones que el navegador no deja usar. */
  isReserved(b) {
    if (b.mod && !b.alt && ['w', 't', 'n', 'q', 'r', 'l', 'tab'].includes(b.key)) return true;
    if (b.mod && /^[1-9]$/.test(b.key) && !b.alt) return true;
    if (b.mod && b.shift && ['n', 't', 'r', 'i', 'j', 'c', 'w', 'q', 'delete'].includes(b.key)) return true;
    if (!IS_MAC && b.ctrl) return true;
    return ['f5', 'f11', 'f12'].includes(b.key);
  },
  isPlain: (b) => !b.mod && !b.alt && !b.ctrl,

  /** ¿Qué acción corresponde a esta pulsación ahora mismo? */
  match(e) {
    const binding = this.fromEvent(e);
    if (!binding) return null;
    const context = S.view === 'editor' ? 'editor' : 'library';
    for (const [id, , , where] of SHORTCUT_ACTIONS) {
      if (where !== 'both' && where !== context) continue;
      if (this.bindings(id).some((b) => this.same(b, binding))) return { id, binding };
    }
    return null;
  },

  perform(id) {
    const nb = activeNb();
    const tools = { toolPen: 'pen', toolHighlighter: 'highlighter', toolEraser: 'eraser', toolLasso: 'lasso', toolText: 'text', toolSticky: 'sticky', toolComment: 'comment', toolLink: 'link', toolSelect: 'select' };
    if (tools[id]) return setTool(tools[id]);
    const tabIndex = S.tabs.indexOf(S.active);
    switch (id) {
      case 'insertImage': return $('#add-image')?.click();
      case 'closeTab': return S.active && closeTab(S.active);
      case 'nextTab': case 'previousTab':
        if (S.tabs.length > 1) openNotebook(S.tabs[(tabIndex + (id === 'nextTab' ? 1 : -1) + S.tabs.length) % S.tabs.length]);
        return;
      case 'lastTab': return S.tabs.length && openNotebook(S.tabs[S.tabs.length - 1]);
      case 'backToLibrary': return backToLibrary();
      case 'undo': return undo();
      case 'redo': return redo();
      case 'find': return S.view === 'editor' ? openSearchPanel() : $('#search')?.focus();
      case 'bold': return textStyle({ bold: true });
      case 'italic': return textStyle({ italic: true });
      case 'underline': return textStyle({ underline: true });
      case 'strikethrough': return textStyle({ strike: true });
      case 'biggerText': return textStyle({ size: 2 });
      case 'smallerText': return textStyle({ size: -2 });
      case 'newPage': return newPageDialog();
      case 'nextPage': case 'previousPage': {
        updateCurrentPage();
        const page = nb?.pages[currentPageIndex + (id === 'nextPage' ? 1 : -1)];
        return page && scrollToPage(page.id);
      }
      case 'pagesOverview': return $('#pages-btn')?.click();
      case 'bookmark': return $('#bm-btn')?.click();
      case 'share': return $('#share-btn')?.click();
      case 'toggleSidebar': return $('#side-btn')?.click();
      case 'timer':
        if (!Pomo.visible) { Pomo.visible = true; Pomo.changed(); }
        return $('#pomo-btn') && Pomo.openPanel($('#pomo-btn'));
      case 'newNotebook': return newNotebookDialog();
      case 'shortcutsSettings': return shortcutsDialog();
      default: {
        const n = /^tab(\d)$/.exec(id);
        if (n && S.tabs[Number(n[1]) - 1]) openNotebook(S.tabs[Number(n[1]) - 1]);
      }
    }
  },
};

document.addEventListener('keydown', (e) => {
  if (Shortcuts.recording || e.defaultPrevented) return;
  const typing = typeof typingInField === 'function' && typingInField();
  const found = Shortcuts.match(e);
  if (!found) return;
  // Una tecla sola mientras se escribe es una letra, no un atajo.
  if (typing && Shortcuts.isPlain(found.binding)) return;
  // Con un diálogo abierto, solo los atajos de texto (que actúan sobre lo que se escribe).
  if (document.querySelector('.scrim') && found.id !== 'shortcutsSettings') return;
  e.preventDefault();
  Shortcuts.perform(found.id);
}, true);

/** «Atajos de teclado»: cambiar, añadir, quitar y volver a los de siempre. */
function shortcutsDialog() {
  if (document.querySelector('.shortcuts-dialog')) return;
  const row = (id) => {
    const a = SHORTCUT_BY_ID[id];
    return `<div class="sc-row"><span>${esc(a.title)}</span><span class="sc-keys">
      ${Shortcuts.bindings(id).map((b) => `<button class="sc-key" data-edit="${id}" data-b='${JSON.stringify(b)}' title="Cambiar (clic derecho para quitar)">${esc(Shortcuts.display(b))}</button>`).join('')}
      <button class="sc-add" data-add="${id}" title="Añadir otra combinación" aria-label="Añadir otra combinación para ${esc(a.title)}">${icon('plus')}</button>
      <button class="sc-reset" data-reset="${id}" ${Shortcuts.isDefault(id) ? 'hidden' : ''} title="Volver a ${esc(a.defaults.map((b) => Shortcuts.display(b)).join(' o '))}" aria-label="Restablecer">${icon('rotate')}</button></span></div>`;
  };
  const body = () => `<p class="sc-help">Haz clic en una combinación para cambiarla, en + para añadir otra y con clic derecho para quitarla. Las teclas solas (como H para el subrayador) no funcionan mientras escribes.${IS_MAC ? '' : ' En la web, las pestañas de Libreta van con Alt porque Ctrl+W, Ctrl+T o Ctrl+1 son del navegador.'}</p>
    ${SHORTCUT_GROUPS.map((g) => `<h3>${g}</h3>${SHORTCUT_ACTIONS.filter((a) => a[1] === g).map((a) => row(a[0])).join('')}`).join('')}`;
  const scrim = dialog(`<h2>Atajos de teclado</h2><div class="sc-list">${body()}</div>
    <div class="actions"><button class="btn" data-act="reset-all">Restablecer todo</button><span class="spacer"></span><button class="btn primary" data-act="done">Listo</button></div>`, (act, b, close) => {
    if (act === 'done') close();
    if (act === 'reset-all') confirmDialog('¿Volver a los atajos de siempre?', 'Se perderán los cambios que hayas hecho.', 'Restablecer todo', () => { Shortcuts.resetAll(); refresh(); });
  }, true);
  scrim.querySelector('.dialog').classList.add('shortcuts-dialog');
  const list = scrim.querySelector('.sc-list');
  const refresh = () => { const top = list.scrollTop; list.innerHTML = body(); list.scrollTop = top; };
  const record = (id, old) => {
    Shortcuts.recording = true;
    const overlay = document.createElement('div');
    overlay.className = 'sc-recorder';
    overlay.innerHTML = `<div>${icon('keyboard')}<b>Pulsa la combinación para «${esc(SHORTCUT_BY_ID[id].title)}»</b><small>Esc para cancelar</small></div>`;
    document.body.appendChild(overlay);
    const finish = (message) => {
      Shortcuts.recording = false;
      removeEventListener('keydown', onKey, true);
      overlay.remove();
      refresh();
      if (message) toast(message);
    };
    const onKey = (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (e.key === 'Escape' && !e.shiftKey && !e.altKey && !e.metaKey && !e.ctrlKey) return finish();
      const binding = Shortcuts.fromEvent(e);
      if (!binding) return;
      if (Shortcuts.isReserved(binding)) return finish(`${Shortcuts.display(binding)} la usa el navegador; elige otra combinación.`);
      const previous = Shortcuts.assign(binding, id, old);
      finish(previous ? `${Shortcuts.display(binding)} ya no es «${SHORTCUT_BY_ID[previous].title}»: ahora es «${SHORTCUT_BY_ID[id].title}».` : null);
    };
    addEventListener('keydown', onKey, true);
    overlay.addEventListener('click', () => finish());
  };
  list.addEventListener('click', (e) => {
    const edit = e.target.closest('[data-edit]'), add = e.target.closest('[data-add]'), reset = e.target.closest('[data-reset]');
    if (edit) record(edit.dataset.edit, JSON.parse(edit.dataset.b));
    if (add) record(add.dataset.add, null);
    if (reset) { Shortcuts.reset(reset.dataset.reset); refresh(); }
  });
  list.addEventListener('contextmenu', (e) => {
    const edit = e.target.closest('[data-edit]');
    if (!edit) return;
    e.preventDefault();
    Shortcuts.remove(JSON.parse(edit.dataset.b), edit.dataset.edit);
    refresh();
  });
}

function exampleNotebooks() {

  const temas = newNotebook('Biología · Tema 3', '#2E7D4F', 'ruled', 'white');
  temas.space = 'Ejemplos';
  temas.example = true;

  const [t1, t2] = temas.pages;
  t1.items.push(
    text(64, 60, 660, 'La célula', { font: 'serif', size: 40, bold: true }),

  t2.strokes.push({ id: uid(), tool: 'pen', kind: 'pen', color: '#1E5BD8', width: 3, points: circle });
  temas.outline = [{ id: uid(), title: 'La célula', pageId: t1.id, level: 0 }, { id: uid(), title: 'Esquema', pageId: t2.id, level: 1 }];

  const nb = newNotebook('Bienvenida a Libreta', '#1F7A8C', 'dots', 'white');
  nb.space = 'Ejemplos';

  const page = nb.pages[0];

  page.items.push(
    text(64, 70, 640, 'Hola, esto es Libreta', { font: 'serif', size: 40, bold: true }),
    text(64, 150, 660, 'Prueba el bolígrafo (B) y escribe aquí debajo. Con el subrayador (H) en «H / V», tus subrayados quedan <b>perfectamente rectos</b>.', { size: 21 }),
    text(64, 300, 300, 'Dibuja un círculo y mantén el ratón quieto al final: se vuelve perfecto.', { font: 'hand', size: 26, color: '#1E5BD8' }),
    text(64, 560, 660, `Los enlaces llevan a otras libretas o páginas: haz clic en el ${link} para verlo. Activa el <b>Modo dinámico</b> en la biblioteca para ver cómo se relacionan tus libretas.`, { size: 19 }),
    { id: uid(), type: 'link', x: 64, y: 700, w: 300, h: 56, target: { nb: temas.id, page: null } },
    text(64, 980, 660, 'Todo se guarda en este navegador. Para pasarle tus apuntes a alguien, usa Compartir → PDF. Para llevártelo todo a otro ordenador, usa «Copia de seguridad».', { size: 17, color: '#5D6475', italic: true }),
  );
  page.strokes.push({ id: uid(), tool: 'highlighter', kind: 'pen', color: '#FFD60A', width: 18, points: line([[392, 194], [585, 194]]) });
  const c2 = Array.from({ length: 70 }, (_, i) => { const a = (i / 64) * Math.PI * 2; return [520 + 70 * Math.cos(a), 360 + 70 * Math.sin(a), 0.5]; });
  page.strokes.push({ id: uid(), tool: 'pen', kind: 'pen', color: '#E0362C', width: 3, points: c2 });
  page.strokes.push({ id: uid(), tool: 'pen', kind: 'pen', color: '#1C1C1E', width: 2.5, points: line([[370, 345], [440, 360]]) });
  page.strokes.push({ id: uid(), tool: 'pen', kind: 'pen', color: '#1C1C1E', width: 2.5, points: line([[424, 346], [440, 360], [422, 372]]) });
  return [nb, temas];
}

async function start() {
  Pomo.load();
  Shortcuts.load();
  await Store.open();
  S.notebooks = (await Store.all()).map(normalizeNotebook);
  const seeded = Prefs.load().seeded;
  if (!S.notebooks.length && !seeded) {
    for (const nb of exampleNotebooks()) { S.notebooks.push(nb); Store.put(nb); }
    Prefs.save(Object.assign(Prefs.load(), { seeded: true }));
  }
  const spaces = await Store.get('spaces', []);
  S.spaces = [...new Set([...spaces, ...S.notebooks.map((n) => n.space).filter(Boolean)])].sort((a, b) => a.localeCompare(b, 'es'));
  S.dynpos = await Store.get('dynpos', {});
  const tabs = await Store.get('tabs', { tabs: [], active: null });
  S.tabs = (tabs.tabs || []).filter((id) => nbById(id));
  S.active = null; // se empieza siempre en la biblioteca; las pestañas siguen abiertas
  renderLibrary();
  // Descargas (PDF, PNG y copia): solo si el visor lo permite.
  try { if (window.claude?.use) S.downloads = await window.claude.use('downloads'); } catch (e) { S.downloads = null; }
}
start();

// ---------- App instalable (versión publicada, no en la página de claude.ai) ----------
if ('serviceWorker' in navigator && location.protocol !== 'file:' && document.querySelector('link[rel="manifest"]')) {
  navigator.serviceWorker.register('sw.js').then((registration) => {
    // Versión nueva esperando: se avisa y se aplica cuando el usuario quiera.
    const offer = (worker) => {
      if (!worker || !navigator.serviceWorker.controller) return;
      const bar = document.createElement('div');
      bar.className = 'toast';
      bar.innerHTML = 'Hay una versión nueva de Libreta. <button class="btn primary" style="margin-left:10px">Actualizar</button>';
      bar.querySelector('button').onclick = () => { flushAll(); worker.postMessage('skipWaiting'); };
      document.body.appendChild(bar);
    };
    if (registration.waiting) offer(registration.waiting);
    registration.addEventListener('updatefound', () => {
      const worker = registration.installing;
      worker?.addEventListener('statechange', () => { if (worker.state === 'installed') offer(worker); });
    });
  }).catch(() => { /* sin modo sin conexión */ });
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
}
// «Instalar Libreta en este ordenador» (Chrome y Edge): aparece en el menú + de la biblioteca.
addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  window.libretaInstall = async () => {
    event.prompt();
    await event.userChoice.catch(() => {});
    window.libretaInstall = null;
  };
});
addEventListener('appinstalled', () => { window.libretaInstall = null; toast('Libreta instalada. Ábrela desde el menú Inicio o el Dock.'); });
// Que el navegador no borre las libretas para hacer sitio.
navigator.storage?.persist?.().catch(() => {});
