      resolve({ src: file.type === 'image/png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.86), w: c.width, h: c.height });
    };
    reader.readAsDataURL(file);
  });
}

// Navegación con teclado: mostrar el recuadro de foco solo entonces.
addEventListener('keydown', (e) => { if (e.key === 'Tab') document.body.classList.add('kbd-nav'); }, true);
addEventListener('pointerdown', () => document.body.classList.remove('kbd-nav'), true);

// =============================================================================
// Dibujo: papel, tinta, miniaturas y exportación (PDF y PNG)
// =============================================================================

function drawPaper(ctx, page) {
  const paper = PAPERS[page.paper] || PAPERS.white;
  const W = page.w, H = page.h;
  ctx.fillStyle = paper.fill;
  ctx.fillRect(0, 0, W, H);
  if (page.bg) return; // página de PDF: el fondo es la imagen
  ctx.strokeStyle = paper.line;
  ctx.fillStyle = paper.line;
  ctx.lineWidth = 1;
  const hline = (y, x0 = 0, x1 = W) => { ctx.moveTo(x0, y); ctx.lineTo(x1, y); };
  const margin = (x) => { ctx.stroke(); ctx.beginPath(); ctx.strokeStyle = 'rgba(235, 115, 115, .6)'; ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); ctx.strokeStyle = paper.line; ctx.beginPath(); };
  ctx.beginPath();
  switch (page.template) {
    case 'ruled': for (let y = 110; y < H - 20; y += 32) hline(y); margin(90); break;
    case 'narrow': for (let y = 96; y < H - 20; y += 24) hline(y); margin(90); break;
    case 'grid':
      for (let x = 24; x < W; x += 24) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
      for (let y = 24; y < H; y += 24) hline(y);
      break;
    case 'dots':
      ctx.stroke(); ctx.beginPath();
      for (let x = 24; x < W; x += 24) for (let y = 24; y < H; y += 24) { ctx.moveTo(x + 1.4, y); ctx.arc(x, y, 1.4, 0, Math.PI * 2); }
      ctx.fill();
      break;
    case 'cornell': {
      const summary = H - 230;
      for (let y = 110; y < summary - 20; y += 32) hline(y);
      ctx.stroke(); ctx.beginPath(); ctx.lineWidth = 2;
      hline(90); ctx.moveTo(220, 90); ctx.lineTo(220, summary); hline(summary);
      break;
    }
    case 'music': {
      let y = 90;
      while (y + 36 < H - 50) { for (let i = 0; i < 5; i++) hline(y + i * 9, 50, W - 50); y += 36 + 70; }
      break;
    }
    default: break;
  }
  ctx.stroke();
}

function strokePath(ctx, p) {
  ctx.beginPath();
  ctx.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length - 1; i++) ctx.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);
  ctx.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
}
function drawStroke(ctx, s, paper, faded = false) {
  const p = s.points;
  if (!p || !p.length) return;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = ctx.fillStyle = displayColor(s.color, paper);
  if (faded) ctx.globalAlpha = 0.2;
  if (s.tool === 'highlighter') {
    ctx.globalAlpha *= 0.38;
    ctx.lineWidth = s.width;
    strokePath(ctx, p);
    ctx.stroke();
  } else if (p.length === 1) {
    ctx.beginPath(); ctx.arc(p[0][0], p[0][1], s.width * 0.6, 0, Math.PI * 2); ctx.fill();
  } else if (s.kind === 'pencil') {
    // Lápiz: una sola pasada algo translúcida. Antes había una segunda pasada interior más fina que, con
    // grosor alto, se veía como un núcleo más oscuro con un borde claro (dos tonos).
    ctx.globalAlpha *= 0.8;
    ctx.lineWidth = Math.max(0.8, s.width * 0.75);
    strokePath(ctx, p);
    ctx.stroke();
  } else {
    for (let i = 1; i < p.length; i++) {
      const a = p[i - 1], b = p[i];
      let w;
      if (s.kind === 'fountain') {
        // Pluma: más gruesa en un sentido que en otro, como una plumilla inclinada.
        const angle = Math.atan2(b[1] - a[1], b[0] - a[0]);
        w = s.width * (0.35 + 1.15 * Math.abs(Math.sin(angle - Math.PI / 4)));
      } else {
        const pressure = ((a[2] ?? 0.5) + (b[2] ?? 0.5)) / 2;
        w = s.width * (0.45 + pressure * 1.1);
      }
      ctx.lineWidth = w;
      ctx.beginPath();
      if (i === 1) ctx.moveTo(a[0], a[1]); else ctx.moveTo((p[i - 2][0] + a[0]) / 2, (p[i - 2][1] + a[1]) / 2);
      ctx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      if (i === p.length - 1) ctx.lineTo(b[0], b[1]);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function fontCSS(base, scale = 1) {
  return `${base.italic ? 'italic ' : ''}${base.bold ? '700 ' : '400 '}${base.size * scale}px ${FONTS[base.font]?.css || FONTS.sans.css}`;
}
function wrapText(ctx, text, x, y, maxW, lineH, maxY = Infinity) {
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && line) { if (y > maxY) return; ctx.fillText(line, x, y); y += lineH; line = word; } else line = test;
    }
    if (y > maxY) return;
    ctx.fillText(line, x, y); y += lineH;
  }
}

/** Dibujo aproximado de una página (texto sin formato por tramos) para miniaturas y portadas. */
async function drawPageQuick(ctx, page) {
  drawPaper(ctx, page);
  if (page.bg) { const img = await loadImage(page.bg); if (img) ctx.drawImage(img, 0, 0, page.w, page.h); }
  for (const it of page.items) {
    if (it.type === 'voice') {
      if (!S.showVoiceNotes) continue;
      ctx.fillStyle = '#FFF2E0'; ctx.strokeStyle = '#FF9500'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(it.x, it.y, it.w, it.h, it.h / 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#FF9500'; ctx.beginPath(); ctx.arc(it.x + 23, it.y + it.h / 2, 13, 0, 7); ctx.fill();
      ctx.fillStyle = '#555'; ctx.fillRect(it.x + 46, it.y + 15, it.w * 0.55, 6); ctx.fillRect(it.x + 46, it.y + 27, 34, 4);
      continue;
    }
    if (it.type === 'image') {
      const img = await loadImage(it.src);
      if (img) ctx.drawImage(img, it.x, it.y, it.w, it.h);
    } else if (it.type === 'text' || it.type === 'sticky') {
      if (it.type === 'sticky') { ctx.fillStyle = it.color; ctx.fillRect(it.x, it.y, it.w, it.h); }
      else if (it.base.bg) { ctx.fillStyle = it.base.bg; ctx.fillRect(it.x, it.y, it.w, it.h || it.base.size * 2); }
      ctx.font = fontCSS(it.base);
      ctx.fillStyle = displayColor(it.base.color, it.type === 'sticky' ? 'white' : page.paper);
      ctx.textBaseline = 'top';
      const pad = it.type === 'sticky' ? 14 : 8;
      wrapText(ctx, htmlText(it.html), it.x + pad, it.y + pad, it.w - pad * 2, it.base.size * 1.35, it.type === 'sticky' ? it.y + it.h - it.base.size : Infinity);
    }
  }
  for (const s of page.strokes) drawStroke(ctx, s, page.paper);
  for (const it of page.items) {
    if (it.type !== 'comment') continue;
    ctx.fillStyle = it.color;
    ctx.beginPath(); ctx.arc(it.x + 17, it.y + 17, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText((it.title || '•').trim().charAt(0).toUpperCase(), it.x + 17, it.y + 18);
    ctx.textAlign = 'start';
  }
}

const thumbCache = new Map();
/** Miniatura (dataURL) de una página, con caché mientras no cambie. */
/** La miniatura si ya está hecha (para ponerla sin esperar). */
function cachedThumb(page, width = 180) { const u = thumbCache.get(`${page.id}:${page._v || 0}:${width}`); return typeof u === 'string' ? u : ''; }
/** <img> de una miniatura con su proporción reservada: la lista no salta al cargar. */
function thumbImg(page, alt = '') {
  const src = cachedThumb(page);
  return `<img alt="${alt}" data-src="${page.id}" draggable="false" style="aspect-ratio:${page.w}/${page.h}"${src ? ` src="${src}"` : ''}>`;
}
async function pageThumb(page, width = 180) {
  const key = `${page.id}:${page._v || 0}:${width}`;
  if (thumbCache.has(key)) return thumbCache.get(key);
  const scale = width / page.w;
  const c = document.createElement('canvas');
  c.width = Math.round(page.w * scale * 2); c.height = Math.round(page.h * scale * 2);
  const ctx = c.getContext('2d');
  ctx.scale(scale * 2, scale * 2);
  await drawPageQuick(ctx, page);
  const url = c.toDataURL('image/jpeg', 0.82);
  thumbCache.set(key, url);
  return url;
}

// ---------- Exportación fiel (con el formato del texto), mediante html2canvas ----------

/** Página completa como lienzo, con el texto enriquecido tal cual se ve. */
async function renderPageCanvas(page, scale = 2) {
  const stage = document.createElement('div');
  stage.className = 'hidden-stage';
  const el = buildStaticPage(page);
  stage.appendChild(el);
  document.body.appendChild(stage);
  await Promise.all($$('img', el).map((img) => (img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; }))));
  try {
    if (window.html2canvas) {
      return await window.html2canvas(el, { scale, backgroundColor: null, logging: false, useCORS: true, width: page.w, height: page.h });
    }
    // Sin html2canvas: el dibujo aproximado.
    const c = document.createElement('canvas');
    c.width = page.w * scale; c.height = page.h * scale;
    const ctx = c.getContext('2d'); ctx.scale(scale, scale);
    await drawPageQuick(ctx, page);
    return c;
  } finally { stage.remove(); }
}
/** Página en DOM sin interacción (para exportar). */
function buildStaticPage(page) {
  const el = document.createElement('div');
  Object.assign(el.style, { position: 'relative', width: page.w + 'px', height: page.h + 'px', overflow: 'hidden', background: PAPERS[page.paper]?.fill || '#fff' });
  const paper = document.createElement('canvas');
  paper.width = page.w * 2; paper.height = page.h * 2;
  Object.assign(paper.style, { position: 'absolute', left: 0, top: 0, width: page.w + 'px', height: page.h + 'px' });
  const pctx = paper.getContext('2d'); pctx.scale(2, 2); drawPaper(pctx, page);
  el.appendChild(paper);
  if (page.bg) { const bg = document.createElement('img'); bg.src = page.bg; Object.assign(bg.style, { position: 'absolute', left: 0, top: 0, width: page.w + 'px', height: page.h + 'px' }); el.appendChild(bg); }
  for (const it of page.items) {
    if (it.type === 'link' || it.type === 'comment') continue;
    el.appendChild(staticItem(it, page));
  }
  const ink = document.createElement('canvas');
  ink.width = page.w * 2; ink.height = page.h * 2;
  Object.assign(ink.style, { position: 'absolute', left: 0, top: 0, width: page.w + 'px', height: page.h + 'px' });
  const ictx = ink.getContext('2d'); ictx.scale(2, 2);
  for (const s of page.strokes) drawStroke(ictx, s, page.paper);
  el.appendChild(ink);
  for (const it of page.items) {
    if (it.type !== 'comment') continue;
    const pin = document.createElement('div');
    pin.className = 'pin';
    pin.style.cssText = `left:${it.x}px;top:${it.y}px;--c:${it.color}`;
    pin.innerHTML = `${esc((it.title || '•').trim().charAt(0).toUpperCase())}<span class="name">${esc(it.title)}</span>`;
    el.appendChild(pin);
  }
  return el;
}
function staticItem(it, page) {
  const div = document.createElement('div');
  if (it.type === 'voice') return div; // el audio no cabe en un PDF ni en una imagen
  div.style.cssText = `position:absolute;left:${it.x}px;top:${it.y}px;width:${it.w}px;${it.h && it.type !== 'text' ? `height:${it.h}px;` : ''}`;
  if (it.type === 'image') {
    const img = document.createElement('img');
    img.src = it.src;
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block';
    div.appendChild(img);
    return div;
  }
  const rich = document.createElement('div');
  rich.className = 'rich';
  rich.innerHTML = it.html || '';
  applyBase(rich, it.base, it.type === 'sticky' ? 'white' : page.paper);
  if (it.type === 'sticky') { div.style.background = it.color; div.style.padding = '16px 14px'; div.style.overflow = 'hidden'; div.style.boxShadow = '0 3px 8px rgba(0,0,0,.22)'; }
  else {
    div.style.padding = '6px 8px';
    if (it.base.bg) div.style.background = it.base.bg;
    if (it.base.border) div.style.border = `1.5px solid ${it.base.color}`;
  }
  div.appendChild(rich);
  return div;
}
/** Estilo base de un texto (lo que no lleva formato propio por tramos). */
function applyBase(el, base, paper) {
  Object.assign(el.style, {
    fontFamily: FONTS[base.font]?.css || FONTS.sans.css, fontSize: base.size + 'px', color: displayColor(base.color, paper),
    fontWeight: base.bold ? '700' : '400', fontStyle: base.italic ? 'italic' : 'normal',
    textDecoration: [base.underline && 'underline', base.strike && 'line-through'].filter(Boolean).join(' ') || 'none',
    textAlign: base.align || 'left',
  });
}

async function exportPDF(nb, pages = nb.pages) {
  if (!window.jspdf) { toast('No se ha podido cargar el generador de PDF. Revisa la conexión y recarga.'); return; }
  toast(`Preparando el PDF (${pages.length} ${pages.length === 1 ? 'página' : 'páginas'})…`);
  const { jsPDF } = window.jspdf;
  const first = pages[0];
  const pdf = new jsPDF({ unit: 'pt', format: [first.w, first.h], orientation: first.w > first.h ? 'landscape' : 'portrait', compress: true });
  for (let i = 0; i < pages.length; i++) {
    const page = pages[i];
    if (i) pdf.addPage([page.w, page.h], page.w > page.h ? 'landscape' : 'portrait');
    const canvas = await renderPageCanvas(page, 2);
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, page.w, page.h);
  }
  pdf.setProperties({ title: nb.title, creator: 'Folia' });
  const name = (nb.title || 'libreta').replace(/[\\/:*?"<>|]/g, '-');
  if (await saveFile(`${name}${pages.length === 1 && nb.pages.length > 1 ? ' - página ' + (nb.pages.indexOf(pages[0]) + 1) : ''}.pdf`, pdf.output('blob'))) toast('PDF descargado');
}
async function exportPNG(nb, page) {
  const canvas = await renderPageCanvas(page, 2);
  const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
  const name = (nb.title || 'libreta').replace(/[\\/:*?"<>|]/g, '-');
  if (await saveFile(`${name} - página ${nb.pages.indexOf(page) + 1}.png`, blob)) toast('Imagen descargada');
}

function paperPreview(canvas, template, paper, landscape = false, width = 54) {
  const page = { w: landscape ? LANDSCAPE.w : PORTRAIT.w, h: landscape ? LANDSCAPE.h : PORTRAIT.h, template, paper };
  const h = width * page.h / page.w;
  canvas.width = width * 2; canvas.height = h * 2;
  canvas.style.width = width + 'px'; canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(width * 2 / page.w, width * 2 / page.w);
  drawPaper(ctx, page);
}

/** Portada de una libreta (color, vista previa de página o foto). */
function coverHTML(nb, { label = true, tag = 'button', extra = '' } = {}) {
  const c = nb.cover || { type: 'color' };
  const inner = c.type === 'color' || !c.image
    ? (label ? `<span translate="no">${esc(nb.title)}</span>` : '')
    : `<img src="${c.image}" alt="">`;
  const cls = c.type === 'photo' && c.image ? 'photo' : c.type === 'page' && c.image ? 'page' : 'color';
  return `<${tag} class="cover ${cls}" style="--c:${nb.color}" ${extra}>${inner}</${tag}>`;
}

// ---------- Búsqueda en todas las libretas ----------
function foldMap(text) {
  let folded = '';
  const map = [];
  for (let i = 0; i < text.length; i++) for (const ch of fold(text[i])) { folded += ch; map.push(i); }
  return { folded, map };
}
/** Coincidencias (sin distinguir mayúsculas ni tildes) con su posición en el texto original. */
function findMatches(text, query, limit = 5) {
  const q = fold(query.trim());
  if (!q || !text) return [];
  const { folded, map } = foldMap(text);
  const out = [];
  let from = 0;
  while (out.length < limit) {
    const i = folded.indexOf(q, from);
    if (i < 0) break;
    out.push({ start: map[i], end: map[i + q.length - 1] + 1 });
    from = i + q.length;
  }
  return out;
}
function snippetHTML(text, m) {
  const a = Math.max(0, m.start - 40), b = Math.min(text.length, m.end + 40);
  const clean = (s) => esc(s.replace(/\s+/g, ' '));
  return `${a > 0 ? '…' : ''}${clean(text.slice(a, m.start))}<mark>${clean(text.slice(m.start, m.end))}</mark>${clean(text.slice(m.end, b))}${b < text.length ? '…' : ''}`;
}
function highlightAll(text, query) {
  const ms = findMatches(text, query, 50);
  let out = '', last = 0;
  for (const m of ms) { out += esc(text.slice(last, m.start)) + '<mark>' + esc(text.slice(m.start, m.end)) + '</mark>'; last = m.end; }
  return out + esc(text.slice(last));
}
const SOURCE_NAMES = { text: 'Cuadro de texto', sticky: 'Post-it', comment: 'Comentario', pdf: 'PDF' };
/** Coincidencias de una libreta: [{ pageIndex, pageId, itemId, source, snippet }]. */
function searchNotebook(nb, query, limit = 30) {
  const hits = [];
  nb.pages.forEach((page, pageIndex) => {
    for (const item of page.items) {
      if (!['text', 'sticky', 'comment'].includes(item.type)) continue;
      const text = itemText(item);
      for (const m of findMatches(text, query)) hits.push({ pageIndex, pageId: page.id, itemId: item.id, source: item.type, snippet: snippetHTML(text, m) });
    }
    if (page.pdfText) for (const m of findMatches(page.pdfText, query)) hits.push({ pageIndex, pageId: page.id, itemId: null, source: 'pdf', snippet: snippetHTML(page.pdfText, m) });
  });
  return hits.slice(0, limit);
}

      ${folders.length || notebooks.length ? `<div class="shelf">${folders.map(folderCardHTML).join('')}${notebooks.map(cardHTML).join('')}</div>`

    $('#dyn-btn').addEventListener('click', () => { S.dynamic = !S.dynamic; savePrefs(); renderLibrary(); });
    $('#select-btn').addEventListener('click', () => setSelecting(true));
    $('#new-btn').addEventListener('click', (e) => newMenu(e.currentTarget));
    $('#settings-btn').addEventListener('click', (e) => settingsMenu(e.currentTarget));

}

function setSelecting(on) { S.selecting = on; S.picked = new Set(); renderLibrary(); }

function resultsHTML(q) {

    ${groups.map((g) => `<section><h2>${mini(g.nb)} ${esc(g.nb.title)}</h2>${g.hits.map((h) => `

// ---------- Duplicar, borrar y acciones con varios a la vez ----------
function duplicateNotebook(nb, folder) {
  const copy = clone(nb);
  copy.id = uid(); copy.title += folder === nb.folder ? ' (copia)' : ''; copy.created = copy.modified = Date.now(); delete copy.example;
  copy.folder = folder || null;
  const ids = new Map();
  for (const p of copy.pages) { const id = uid(); ids.set(p.id, id); p.id = id; }
  copy.outline.forEach((o) => { o.pageId = ids.get(o.pageId) || o.pageId; });
  S.notebooks.push(copy); Store.put(copy);
  return copy;
}
function duplicateFolder(f, parent, top = true) {
  const copy = Folders.create(f.name + (top ? ' (copia)' : ''), parent);
  copy.color = f.color;
  for (const nb of S.notebooks.filter((x) => x.folder === f.id)) duplicateNotebook(nb, copy.id);
  for (const sub of Folders.children(f.id)) duplicateFolder(sub, copy.id, false);
  Folders.save();
  return copy;
}
function deleteNotebook(nb) {
  S.notebooks = S.notebooks.filter((n) => n.id !== nb.id); Store.remove(nb.id);
  (nb.recordings || []).forEach((r) => Voice.forgetIfUnused(r.id));
  S.tabs = S.tabs.filter((id) => id !== nb.id); if (S.active === nb.id) S.active = S.tabs[0] || null; saveTabs();
}
/** Borrar libretas y carpetas (las carpetas, con todo lo que tienen dentro), tras preguntar. */
function deleteItemsConfirm(items, after = refresh) {
  const nbs = new Set(), folders = new Set();
  for (const it of items) {
    if (it.kind === 'nb') nbs.add(it.id);
    else { folders.add(it.id); Folders.tree(it.id).forEach(({ folder }) => folders.add(folder.id)); Folders.notebooksIn(it.id).forEach((nb) => nbs.add(nb.id)); }
  }
  const nf = items.filter((i) => i.kind === 'folder').length;
  const title = items.length === 1 ? `¿Eliminar «${items[0].kind === 'nb' ? nbById(items[0].id).title : Folders.byId(items[0].id).name}»?` : `¿Eliminar ${items.length} elementos?`;
  const what = nf ? `Se borrará${nbs.size === 1 ? '' : 'n'} ${nbs.size} libreta${nbs.size === 1 ? '' : 's'} (también las que hay dentro de las carpetas). ` : '';
  confirmDialog(title, `${what}Se borran de este navegador y no se puede deshacer.`, 'Eliminar', () => {
    for (const id of nbs) { const nb = nbById(id); if (nb) deleteNotebook(nb); }
    Folders.list = Folders.list.filter((f) => !folders.has(f.id)); Folders.save();
    S.picked = new Set();
    after();
    toast('Eliminado');
  });
}
function pickedItems() { return [...S.picked].map((k) => { const [kind, id] = k.split(':'); return { kind, id }; }).filter((i) => (i.kind === 'nb' ? nbById(i.id) : Folders.byId(i.id))); }
async function selectionAction(act) {
  const items = pickedItems();
  if (!items.length) return;
  if (act === 'move') return moveDialog(items, () => { S.picked = new Set(); renderLibrary(); });
  if (act === 'delete') return deleteItemsConfirm(items, renderLibrary);
  if (act === 'duplicate') {
    for (const it of items) { if (it.kind === 'nb') duplicateNotebook(nbById(it.id), nbById(it.id).folder); else duplicateFolder(Folders.byId(it.id), Folders.byId(it.id).parent); }
    S.picked = new Set(); renderLibrary(); return toast(items.length === 1 ? 'Duplicado' : `${items.length} elementos duplicados`);
  }
  if (act === 'export') {
    const list = [...new Set(items.flatMap((it) => (it.kind === 'nb' ? [nbById(it.id)] : Folders.notebooksIn(it.id))))];
    if (!list.length) return toast('No hay libretas que exportar');
    toast(`Exportando ${list.length} ${list.length === 1 ? 'libreta' : 'libretas'} en PDF…`);
    for (const nb of list) await exportPDF(nb);
  }
}
function refresh() { if (S.view === 'library') renderLibrary(); else renderEditor(); }

// ---------- Portada ----------
function coverDialog(nb) {
  let tab = nb.cover?.type || 'color';
  const scrim = dialog(`<h2>Portada de «${esc(nb.title)}»</h2>
    <div class="seg" id="cover-tabs">${[['color', 'Color'], ['page', 'Página'], ['photo', 'Foto']].map(([k, n]) => `<button data-act="tab" data-v="${k}" aria-pressed="${k === tab}">${n}</button>`).join('')}</div>
    <div id="cover-body"></div>
    <div class="actions"><button class="btn primary" data-act="done">Listo</button></div>`, async (act, b, close) => {
    if (act === 'done') return close();
    if (act === 'tab') { tab = b.dataset.v; b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); return draw(); }
    if (act === 'color') { nb.color = b.dataset.v; nb.cover = { type: 'color' }; }
    if (act === 'page') { const page = nb.pages.find((p) => p.id === b.dataset.v); nb.cover = { type: 'page', pageId: page.id, image: await pageThumb(page, 300) }; }
    if (act === 'photo') return pickFile('image/*', async (f) => {
      try { const img = await readImageFile(f, 900); nb.cover = { type: 'photo', image: img.src }; touch(nb); Store.put(nb); refresh(); draw(); } catch (e) { toast('No se ha podido leer esa imagen.'); }
    });
    touch(nb); Store.put(nb); refresh(); draw();
  });
  async function draw() {
    const body = $('#cover-body', scrim);
    if (tab === 'color') body.innerHTML = `<div class="choices">${COVERS.map((c) => `<button class="swatch" style="background:${c};width:40px;height:40px" data-act="color" data-v="${c}" aria-label="Color ${c}" aria-pressed="${nb.cover.type === 'color' && nb.color === c}"></button>`).join('')}</div>`;
    if (tab === 'photo') body.innerHTML = `<p>Elige una imagen de tu ordenador. Se recorta por el centro para llenar la portada.</p><button class="btn primary" data-act="photo">Elegir imagen…</button>`;
    if (tab === 'page') {
      body.innerHTML = `<p>La portada mostrará esta página. Se actualiza al cerrar la libreta.</p><div class="pick-grid" id="cover-pages"></div>`;
      const grid = $('#cover-pages', body);
      for (const [i, page] of nb.pages.entries()) {
        grid.insertAdjacentHTML('beforeend', `<button data-act="page" data-v="${page.id}" style="${nb.cover.pageId === page.id ? 'border-color:var(--accent)' : ''}"><img src="${await pageThumb(page)}" alt="">Página ${i + 1}</button>`);
      }
    }
  }
  draw();
}

function templateChoices(sel, paper, landscape) {

function drawTemplatePreviews(root, paper, landscape) {

}
function newNotebookDialog() {
  const choice = { color: COVERS[0], template: 'ruled', paper: 'white', landscape: false };

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">

  (act, b, close, sc) => {

      drawTemplatePreviews(sc, choice.paper, choice.landscape);

      S.notebooks.push(nb); Store.put(nb); close(); openNotebook(nb.id);
    }
  });
  drawTemplatePreviews(scrim, choice.paper, choice.landscape);

// ---------- Importar PDF ----------
async function importPDF(file) {
  if (!window.pdfjsLib) { toast('No se ha podido cargar el lector de PDF. Revisa la conexión y recarga.'); return; }
  try {
    toast('Importando el PDF…');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const data = new Uint8Array(await file.arrayBuffer());
    const pdf = await pdfjsLib.getDocument({ data, isEvalSupported: false }).promise;
    const nb = newNotebook(file.name.replace(/\.pdf$/i, ''), COVERS[Math.floor(Math.random() * COVERS.length)], 'blank', 'white');
    nb.folder = S.folder || null;
    nb.pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const p = await pdf.getPage(i);
      const vp1 = p.getViewport({ scale: 1 });
      const landscape = vp1.width > vp1.height;
      const w = landscape ? LANDSCAPE.w : PORTRAIT.w;
      const h = Math.round(w * vp1.height / vp1.width);
      const vp = p.getViewport({ scale: (w * 1.6) / vp1.width });
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      await p.render({ canvasContext: ctx, viewport: vp }).promise;
      const text = (await p.getTextContent()).items.map((t) => t.str + (t.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+/g, ' ').trim();
      const pdfRuns = await pdfTextRuns(p, p.getViewport({ scale: w / vp1.width }));
      nb.pages.push({ id: uid(), w, h, template: 'blank', paper: 'white', bg: canvas.toDataURL('image/jpeg', 0.85), pdfText: text, pdfRuns, strokes: [], items: [] });
      if (i % 5 === 0) toast(`Importando el PDF… ${i} de ${pdf.numPages}`);
    }
    S.notebooks.push(nb); Store.put(nb);
    toast(`PDF importado: ${nb.pages.length} ${nb.pages.length === 1 ? 'página' : 'páginas'}`);
    openNotebook(nb.id);
  } catch (e) {
    console.error(e);
    toast('No se ha podido abrir ese PDF.');
  }
}

// ---------- Copia de seguridad ----------
function backupMenu(anchor) {
  popover(anchor, `<div class="label">Todas tus libretas</div>
    <button data-act="save">Guardar copia (archivo .json)</button>
    <button data-act="load">Recuperar copia…</button>`, (act) => {
    if (act === 'save') saveBackup();
    if (act === 'load') loadBackup();
  });
}
function loadBackup() {
  {
    pickFile('.json,application/json', async (file) => {
      try {
        const data = JSON.parse(await file.text());
        const list = Array.isArray(data.notebooks) ? data.notebooks : [];
        let added = 0;
        // Primero las carpetas (y los espacios de copias antiguas, que pasan a carpetas).
        for (const f of data.folders || []) if (f?.id && !Folders.byId(f.id)) Folders.list.push(f);
        Folders.migrate(list.filter((nb) => nb && nb.id), data.spaces || []);
        Folders.save();
        for (const nb of list) {
          if (!nb || !nb.id || !Array.isArray(nb.pages)) continue;
          normalizeNotebook(nb);
          const i = S.notebooks.findIndex((n) => n.id === nb.id);
          if (i >= 0) S.notebooks[i] = nb; else S.notebooks.push(nb);
          Store.put(nb); added++;
        }
        for (const [id, url] of Object.entries(data.audio || {})) { try { await Store.putAudio(id, await (await fetch(url)).blob()); } catch (e) { /* audio dañado */ } }
        renderLibrary();
        toast(added ? `Recuperadas ${added} libretas` : 'El archivo no tenía libretas');
      } catch (e) { toast('Ese archivo no es una copia de Folia.'); }
    });
  }
}
async function saveBackup() {
  flushAll();
  // El audio de las grabaciones va dentro, en base64.
  const audio = {};
  for (const r of S.notebooks.flatMap((n) => n.recordings || [])) {
    if (audio[r.id]) continue;
    const blob = await Store.getAudio(r.id);
    if (blob) audio[r.id] = await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
  }
  const data = JSON.stringify({ app: 'Folia', version: 4, saved: new Date().toISOString(), folders: Folders.list, notebooks: S.notebooks, audio });
  if (await saveFile(`libreta-copia-${new Date().toISOString().slice(0, 10)}.json`, new Blob([data], { type: 'application/json' }))) toast('Copia guardada');
}

// =============================================================================
// Modo dinámico: las libretas flotan en el espacio, unidas por sus enlaces. Las carpetas son
// nebulosas con sus libretas orbitando: al hacer clic se viaja dentro (a velocidad de la luz) y
// al volver se sale hacia atrás. Doble clic en una libreta la abre creciendo desde su portada.
// Todo el fondo, las nebulosas y los enlaces van en un solo lienzo (para que vaya suave).
// =============================================================================
const Dyn = { running: false };
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const easeInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const easeOutBack = (k) => { const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const easeIn = (k) => k * k * k;
const clamp01 = (k) => Math.min(1, Math.max(0, k));
/** Viajando entre carpetas (mientras, no se hace caso a los clics). Aparecer no cuenta. */
const dynBusy = () => !!Dyn.anim && Dyn.anim.kind !== 'emerge';

function stopDynamic() {
  Dyn.running = false;
  if (Dyn.raf) cancelAnimationFrame(Dyn.raf);
  if (Dyn.onResize) removeEventListener('resize', Dyn.onResize);
}

/** Qué representa a una libreta en el nivel `level`: ella misma o la subcarpeta (hija de `level`) que la contiene. */
function dynRep(nb, level) {
  if ((nb.folder || null) === (level || null)) return `n:${nb.id}`;
  const path = Folders.path(nb.folder);
  const i = level ? path.findIndex((f) => f.id === level) : -1;
  if (level && i < 0) return null;
  const child = path[i + 1];
  return child ? `f:${child.id}` : null;
}

/** El grafo del nivel actual: carpetas y libretas, y los enlaces entre ellas (agrupados por carpeta). */
function dynamicGraph(level = S.folder) {
  level = level || null;
  const folders = Folders.children(level);
  const notebooks = S.notebooks.filter((nb) => (nb.folder || null) === level);
  const nodes = [...folders.map((f) => ({ key: `f:${f.id}`, kind: 'folder', folder: f })), ...notebooks.map((nb) => ({ key: `n:${nb.id}`, kind: 'nb', nb, id: nb.id }))];
  const pageIndex = new Map(S.notebooks.map((nb) => [nb.id, new Map(nb.pages.map((p, i) => [p.id, i]))]));
  const details = S.notebooks.flatMap(notebookLinks).map((d) => ({ ...d, targetPage: d.target.page ? pageIndex.get(d.target.nb)?.get(d.target.page) : undefined }));
  const reps = new Map(S.notebooks.map((nb) => [nb.id, dynRep(nb, level)]));
  const edges = new Map();
  for (const d of details) {
    const a = reps.get(d.source), b = reps.get(d.target.nb);
    if (!a || !b || a === b) continue;
    const key = a + '|' + b;
    const e = edges.get(key) || { from: a, to: b, count: 0, pages: new Set(), whole: false, direct: a.startsWith('n:') && b.startsWith('n:') };
    e.count++;
    if (d.targetPage !== undefined) e.pages.add(d.targetPage + 1); else e.whole = true;
    edges.set(key, e);
  }
  for (const e of edges.values()) e.labels = e.direct ? [...e.pages].sort((x, y) => x - y).concat(e.whole ? [null] : []) : [null];
  return { nodes, edges: [...edges.values()], details };
}

async function startDynamic(root) {
  stopDynamic();
  if (!root) return;
  Object.assign(Dyn, { running: true, root, selected: null, selectedAt: 0, cam: [0, 0], camTarget: [0, 0], zoom: 1, zoomTarget: 1, dragging: null, anim: null, warp: 0.04, flash: null });
  root.innerHTML = `<canvas></canvas><div class="nodes"></div>
    <nav class="dyn-crumbs" aria-label="Ruta"></nav>
    <button class="btn reset" hidden>Recolocar automáticamente</button>
    <div class="hint">Clic en una carpeta para entrar · arrastra para colocar · pasa el ratón para ver · clic en una libreta para sus vínculos · doble clic para abrirla</div>`;
  const canvas = $('canvas', root), nodesEl = $('.nodes', root), resetBtn = $('.reset', root), crumbsEl = $('.dyn-crumbs', root);
  const ctx = canvas.getContext('2d');
  const W = () => root.clientWidth, H = () => root.clientHeight;
  let g, base = {}, born = new Map(), phase = new Map(), layout = {};

  // ---------- Escena (un nivel de carpetas) ----------
  const spaceKey = () => S.folder || '*';
  const manual = () => (S.dynpos[spaceKey()] = S.dynpos[spaceKey()] || {});
  function build() {
    g = dynamicGraph(S.folder);
    Dyn.g = g;
    Dyn.selected = null;
    $('.panel', root)?.remove();
    hideHover();
    nodesEl.innerHTML = '';
    layout = Graph.layout(g.nodes.map((n) => n.key), g.edges.map((e) => [e.from, e.to]), 280);
    phase = new Map(g.nodes.map((n, i) => [n.key, (i * 2.399) % (Math.PI * 2)]));
    for (const n of g.nodes) {
      const el = document.createElement('div');
      el.dataset.key = n.key;
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      if (n.kind === 'nb') {
        el.className = 'dnode';
        el.dataset.id = n.nb.id;
        el.style.setProperty('--glow', n.nb.color);
        el.innerHTML = `${coverHTML(n.nb, { label: false, tag: 'div' })}<div class="lbl" translate="no">${esc(n.nb.title)}</div>`;
        el.setAttribute('aria-label', `${n.nb.title}, ${degree(n.key)} vínculos`);
      } else {
        const inside = Folders.notebooksIn(n.folder.id).length;
        el.className = 'dfolder';
        el.dataset.folder = n.folder.id;
        el.style.setProperty('--glow', Folders.color(Folders.top(n.folder.id)));
        el.innerHTML = `<span class="core">${icon('folder')}</span><div class="lbl" translate="no">${esc(n.folder.name)}</div><div class="sub">${inside} ${inside === 1 ? 'libreta' : 'libretas'}</div>`;
        el.setAttribute('aria-label', `Carpeta ${n.folder.name}, ${inside} libretas. Entrar`);
      }
      nodesEl.appendChild(el);
    }
    const empty = !g.nodes.length;
    root.querySelector('.hint').textContent = empty ? 'Esta carpeta está vacía.' : 'Clic en una carpeta para entrar · arrastra para colocar · pasa el ratón para ver · clic en una libreta para sus vínculos · doble clic para abrirla';
    resetBtn.hidden = !Object.keys(manual()).length;
    place();
    renderCrumbs();
    const hint = root.querySelector('.hint');
    hint.classList.remove('gone'); clearTimeout(Dyn.hintTimer);
    if (!empty) Dyn.hintTimer = setTimeout(() => hint.classList.add('gone'), 7000);
  }
  function degree(key) { return g.edges.filter((e) => e.from === key || e.to === key).reduce((s, e) => s + e.count, 0); }
  function place() {
    base = Graph.place(layout, W(), H() - 40, 150, { w: 250, h: 230 }); // abajo queda sitio para los nombres
    for (const [id, rel] of Object.entries(manual())) if (base[id]) base[id] = [rel[0] * W(), rel[1] * H()];
  }
  function renderCrumbs() {
    const path = Folders.path(S.folder);
    crumbsEl.innerHTML = `<button data-crumb="" ${path.length ? '' : 'aria-current="page"'}>${icon('sparkles')} Libretas</button>`
      + path.map((f, i) => `<span>›</span><button translate="no" data-crumb="${f.id}" ${i === path.length - 1 ? 'aria-current="page"' : ''} style="--glow:${Folders.color(Folders.top(f.id))}">${esc(f.name)}</button>`).join('');
  }
  crumbsEl.addEventListener('click', (e) => {
    const b = e.target.closest('[data-crumb]');
    if (!b || b.getAttribute('aria-current')) return;
    leaveTo(b.dataset.crumb || null);
  });
  resetBtn.addEventListener('click', () => { S.dynpos[spaceKey()] = {}; Store.set('dynpos', S.dynpos); resetBtn.hidden = true; place(); });

  function sizeCanvas() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = W() * dpr; canvas.height = H() * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  Dyn.onResize = () => { place(); sizeCanvas(); };
  addEventListener('resize', Dyn.onResize);
  sizeCanvas();

  // ---------- Posición en pantalla (con cámara, flotación y animaciones de viaje) ----------
  function rest(key, t) {
    if (Dyn.dragging?.key === key && Dyn.dragging.moved) return Dyn.dragging.at;
    const b = base[key] || [W() / 2, H() / 2];
    const ph = phase.get(key) || 0;
    const f = reduceMotion() ? [0, 0] : [Math.sin(t * 0.5 + ph) * 7, Math.cos(t * 0.4 + ph * 1.3) * 9];
    return [W() / 2 + (b[0] - W() / 2) * Dyn.zoom + Dyn.cam[0] + f[0], H() / 2 + (b[1] - H() / 2) * Dyn.zoom + Dyn.cam[1] + f[1]];
  }
  /** Posición, escala y opacidad de cada nodo en este fotograma. */
  function view(key, t, now) {
    let p = rest(key, t), s = 1, a = 1;
    const A = Dyn.anim;
    const c = [W() / 2, H() / 2];
    if (A) {
      const k = clamp01((now - A.start) / A.dur);
      if (A.kind === 'dive') {
        // La cámara se lanza hacia la carpeta: todo se agranda alrededor de ella y se aparta.
        const e = easeIn(k), z = 1 + 9 * e, focus = [A.focus[0] + (c[0] - A.focus[0]) * easeInOut(k), A.focus[1] + (c[1] - A.focus[1]) * easeInOut(k)];
        p = [focus[0] + (p[0] - A.focus[0]) * z, focus[1] + (p[1] - A.focus[1]) * z];
        s = 1 + 3 * e; a = key === A.key ? 1 - clamp01((k - 0.55) / 0.35) : 1 - clamp01(k * 1.6);
      } else if (A.kind === 'emerge') {
        // Al llegar: todo nace del centro y se despliega, cada uno un poco después del anterior.
        const kk = clamp01((now - A.start - (born.get(key) || 0)) / (A.dur * 0.75));
        const e = easeOutBack(kk);
        p = [c[0] + (p[0] - c[0]) * e, c[1] + (p[1] - c[1]) * e];
        s = 0.2 + 0.8 * clamp01(e); a = clamp01(kk * 2);
      } else if (A.kind === 'rise') {
        // Volver: lo de dentro se recoge hacia el centro y se aleja.
        const e = easeIn(k);
        p = [c[0] + (p[0] - c[0]) * (1 - e), c[1] + (p[1] - c[1]) * (1 - e)];
        s = 1 - 0.85 * e; a = 1 - clamp01(k * 1.3);
      } else if (A.kind === 'land') {
        // Y aparecer fuera: la escena de arriba viene desde muy cerca de la carpeta de la que salimos.
        const e = easeInOut(k), z = 6 - 5 * e, focus = A.focusKey && base[A.focusKey] ? rest(A.focusKey, t) : c;
        p = [focus[0] + (p[0] - focus[0]) * z, focus[1] + (p[1] - focus[1]) * z];
        s = 2.4 - 1.4 * e; a = key === A.focusKey ? 1 : clamp01((k - 0.15) / 0.6);
      }
    }
    return { p, s, a };
  }

  // ---------- Viajes entre carpetas ----------
  function enterFolder(fid) {
    if (dynBusy()) return;
    const key = `f:${fid}`, f = Folders.byId(fid);
    const color = Folders.color(Folders.top(fid));
    hideHover(); select(null);
    if (reduceMotion()) { goLevel(fid); return; }
    const t = performance.now() / 1000;
    Dyn.anim = { kind: 'dive', start: performance.now(), dur: 900, key, focus: rest(key, t), color };
    Dyn.flash = { color, start: performance.now() + 550, dur: 900 };
    Dyn.warpTarget = 1;
    setTimeout(() => {
      goLevel(fid);
      const a = (Dyn.anim = { kind: 'emerge', start: performance.now(), dur: 1100 });
      Dyn.warpTarget = 0.04;
      setTimeout(() => { if (Dyn.anim === a) Dyn.anim = null; }, 1150);
    }, 900);
    void f;
  }
  function leaveTo(target) {
    if (dynBusy()) return;
    // La carpeta de este nivel por la que se vuelve (para salir «desde» ella).
    const path = Folders.path(S.folder);
    const i = target ? path.findIndex((f) => f.id === target) : -1;
    const from = path[i + 1];
    hideHover(); select(null);
    if (reduceMotion()) { goLevel(target); return; }
    Dyn.anim = { kind: 'rise', start: performance.now(), dur: 650 };
    Dyn.warpTarget = -0.9;
    setTimeout(() => {
      goLevel(target);
      const a = (Dyn.anim = { kind: 'land', start: performance.now(), dur: 1000, focusKey: from ? `f:${from.id}` : null });
      Dyn.flash = { color: from ? Folders.color(Folders.top(from.id)) : '#8E7CFF', start: performance.now() - 200, dur: 700 };
      Dyn.warpTarget = 0.04;
      setTimeout(() => { if (Dyn.anim === a) Dyn.anim = null; }, 1050);
    }, 650);
  }
  function goLevel(fid) {
    S.folder = fid || null;
    build();
    born = new Map(g.nodes.map((n) => {
      const b = base[n.key] || [W() / 2, H() / 2];
      return [n.key, Math.min(380, Math.hypot(b[0] - W() / 2, b[1] - H() / 2) * 0.6)];
    }));
  }
  Dyn.enterFolder = enterFolder;
  Dyn.leaveTo = leaveTo;

  /** Abrir una libreta: su portada crece hasta llenar la pantalla y se abre. */
  function openWithZoom(id) {
    const nb = nbById(id), el = nodesEl.querySelector(`.dnode[data-id="${id}"] .cover`);
    if (!nb) return;
    if (!el || reduceMotion()) return openNotebook(id);
    const r = el.getBoundingClientRect();
    const fly = document.createElement('div');
    fly.className = 'dyn-fly';
    fly.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;--c:${nb.color}`;
    fly.innerHTML = `<div class="paper-in"></div>`;
    document.body.appendChild(fly);
    const vw = innerWidth, vh = innerHeight;
    fly.animate([
      { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px`, borderRadius: '6px', transform: 'rotateY(0deg)' },
      { left: `${vw / 2 - r.width * 1.6}px`, top: `${vh / 2 - r.height * 1.6}px`, width: `${r.width * 3.2}px`, height: `${r.height * 3.2}px`, borderRadius: '10px', transform: 'rotateY(-12deg)', offset: 0.45 },
      { left: '0px', top: '0px', width: `${vw}px`, height: `${vh}px`, borderRadius: '0px', transform: 'rotateY(0deg)' },
    ], { duration: 700, easing: 'cubic-bezier(.7,0,.2,1)', fill: 'forwards' });
    fly.querySelector('.paper-in').animate([{ opacity: 0 }, { opacity: 0, offset: 0.55 }, { opacity: 1 }], { duration: 700, fill: 'forwards' });
    Dyn.warpTarget = 0.7;
    setTimeout(() => {
      openNotebook(id);
      fly.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, easing: 'ease-out', fill: 'forwards' }).onfinish = () => fly.remove();
    }, 720);
  }
  Dyn.openWithZoom = openWithZoom;

  // ---------- Interacción ----------
  nodesEl.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.dnode, .dfolder');
    if (!el || dynBusy()) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return; // solo el botón izquierdo arrastra
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* puntero sintético */ }
    const r = root.getBoundingClientRect();
    Dyn.dragging = { key: el.dataset.key, el, start: [e.clientX, e.clientY], at: [e.clientX - r.left, e.clientY - r.top], moved: false };
  });
  nodesEl.addEventListener('pointermove', (e) => {
    const d = Dyn.dragging;
    if (!d) return;
    const r = root.getBoundingClientRect();
    d.at = [e.clientX - r.left, e.clientY - r.top];
    if (Math.hypot(e.clientX - d.start[0], e.clientY - d.start[1]) > 5) { d.moved = true; hideHover(); }
  });
  nodesEl.addEventListener('pointerup', () => {
    const d = Dyn.dragging;
    Dyn.dragging = null;
    if (!d) return;
    if (d.moved) {
      const b = [W() / 2 + (d.at[0] - Dyn.cam[0] - W() / 2) / Dyn.zoom, H() / 2 + (d.at[1] - Dyn.cam[1] - H() / 2) / Dyn.zoom];
      manual()[d.key] = [Math.min(Math.max(b[0], 60), W() - 60) / W(), Math.min(Math.max(b[1], 60), H() - 60) / H()];
      Store.set('dynpos', S.dynpos);
      resetBtn.hidden = false;
      place();
    } else if (d.key.startsWith('f:')) enterFolder(d.key.slice(2));
    else select(d.key);
  });
  // Clic derecho: el menú de la carpeta o de la libreta (como en la biblioteca).
  nodesEl.addEventListener('contextmenu', (e) => {
    const el = e.target.closest('.dnode, .dfolder');
    if (!el) return;
    e.preventDefault();
    Dyn.dragging = null;
    hideHover();
    const at = { x: e.clientX, y: e.clientY };
    if (el.dataset.folder) folderMenu(at, Folders.byId(el.dataset.folder));
    else notebookMenu(at, nbById(el.dataset.id));
  });
  nodesEl.addEventListener('dblclick', (e) => { const el = e.target.closest('.dnode'); if (el) openWithZoom(el.dataset.id); });
  nodesEl.addEventListener('keydown', (e) => {
    const el = e.target.closest('.dnode, .dfolder');
    if (!el) return;
    if (el.classList.contains('dfolder') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return enterFolder(el.dataset.folder); }
    if (e.key === 'Enter') openWithZoom(el.dataset.id);
    if (e.key === ' ') { e.preventDefault(); select(el.dataset.key); }
  });
  root.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && S.folder && !e.target.closest('input')) { e.preventDefault(); leaveTo(Folders.byId(S.folder)?.parent || null); }
  });
  nodesEl.addEventListener('pointerover', (e) => { const el = e.target.closest('.dnode, .dfolder'); if (el && !Dyn.dragging && !dynBusy() && el.dataset.key !== Dyn.selected) showHover(el.dataset.key); });
  nodesEl.addEventListener('pointerout', (e) => { const el = e.target.closest('.dnode, .dfolder'); if (el && !el.contains(e.relatedTarget)) hideHover(); });
  canvas.addEventListener('click', () => select(null));

  let hoverEl = null;
  async function showHover(key) {
    hideHover();
    hoverEl = document.createElement('div');
    hoverEl.className = 'hover-card';
    hoverEl.dataset.key = key;
    if (key.startsWith('f:')) {
      const f = Folders.byId(key.slice(2)), list = Folders.notebooksIn(f.id).sort((a, b) => b.modified - a.modified);
      const subs = Folders.children(f.id).length;
      hoverEl.style.setProperty('--glow', Folders.color(Folders.top(f.id)));
      hoverEl.innerHTML = `<div style="font-weight:700;font-size:14px" translate="no">${esc(f.name)}</div><div style="opacity:.75">${list.length} ${list.length === 1 ? 'libreta' : 'libretas'}${subs ? ` · ${subs} ${subs === 1 ? 'carpeta' : 'carpetas'}` : ''}</div>
        <div class="hover-list">${list.slice(0, 4).map((nb) => `<span style="--c:${nb.color}" translate="no">${esc(nb.title)}</span>`).join('')}${list.length > 4 ? `<span class="more">y ${list.length - 4} más…</span>` : ''}</div>
        <div class="hover-go">Clic para entrar</div>`;
      root.appendChild(hoverEl);
      return;
    }
    const nb = nbById(key.slice(2));
    hoverEl.style.setProperty('--glow', nb.color);
    hoverEl.innerHTML = `<img alt=""><div style="margin-top:6px;font-weight:700" translate="no">${esc(nb.title)}</div><div style="opacity:.75">${nb.pages.length} ${nb.pages.length === 1 ? 'página' : 'páginas'} · ${degree(key)} ${degree(key) === 1 ? 'vínculo' : 'vínculos'}</div>`;
    root.appendChild(hoverEl);
    const url = await pageThumb(nb.pages[0], 180);
    if (hoverEl?.dataset.key === key) $('img', hoverEl).src = url;
  }
  function hideHover() { hoverEl?.remove(); hoverEl = null; }

  function select(key) {
    hideHover();
    Dyn.selected = key;
    Dyn.selectedAt = performance.now();
    $('.panel', root)?.remove();
    if (!key) { Dyn.camTarget = [0, 0]; Dyn.zoomTarget = 1; return; }
    const b = base[key];
    Dyn.zoomTarget = 1.15;
    const targetX = W() > 760 ? (W() - 400) / 2 : W() / 2;
    Dyn.camTarget = [targetX - (W() / 2 + (b[0] - W() / 2) * 1.15), H() / 2 - (H() / 2 + (b[1] - H() / 2) * 1.15)];
    renderPanel(key.slice(2));
  }
  Dyn.select = (id) => select(id ? `n:${id}` : null);

  async function renderPanel(id) {
    const nb = nbById(id);
    const out = g.details.filter((d) => d.source === id && d.target.nb !== id);
    const inc = g.details.filter((d) => d.target.nb === id && d.source !== id);
    const internal = g.details.filter((d) => d.source === id && d.target.nb === id);
    const comments = nb.pages.flatMap((p, i) => p.items.filter((it) => it.type === 'comment').map((it) => ({ it, i, page: p })));
    const row = (other, text, page, extra, openPage) => `<button class="lrow" data-go="${other?.id || ''}" data-page="${openPage || ''}">
      <span style="width:12px;height:12px;border-radius:50%;background:${other?.color || '#888'};box-shadow:0 0 6px ${other?.color || '#888'};flex:none"></span>
      <span style="flex:1;min-width:0"><b ${other ? 'translate="no"' : ''}>${esc(other?.title || 'Libreta borrada')}</b><small>${[other && other.folder !== nb.folder && Folders.label(other), text && `«${esc(text)}»`, page !== undefined && `pág. ${page + 1}`, extra].filter(Boolean).join(' · ')}</small></span>
      <span aria-hidden="true">↗</span></button>`;
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.style.setProperty('--glow', nb.color);
    panel.innerHTML = `
      <div style="display:flex;align-items:flex-start;gap:8px"><div style="flex:1"><h3 translate="no">${esc(nb.title)}</h3>
        <small style="color:#A9B0C6">${nb.folder ? esc(Folders.label(nb)) + ' · ' : ''}${nb.pages.length} ${nb.pages.length === 1 ? 'página' : 'páginas'} · ${formatDate(nb.modified)}</small></div>
        <button class="btn" data-close aria-label="Cerrar panel">✕</button></div>
      <img alt="" style="width:100%;border-radius:10px;background:#fff">
      <button class="btn primary" data-open-nb style="justify-content:center;background:${nb.color};color:#fff">${nb.lastPageId ? 'Abrir donde lo dejaste' : 'Abrir libreta'}</button>
      <h4>Vínculos</h4>
      ${!out.length && !inc.length && !internal.length ? '<small style="color:#A9B0C6">Esta libreta aún no tiene vínculos. Selecciona un texto y pulsa «Enlace», o usa la herramienta de enlace.</small>' : ''}
      ${out.length ? `<small style="color:#A9B0C6">Enlaza a</small>${out.map((d) => row(nbById(d.target.nb), d.text, d.targetPage, `desde pág. ${d.pageIndex + 1}`, d.target.page)).join('')}` : ''}
      ${inc.length ? `<small style="color:#A9B0C6">Enlazado desde</small>${inc.map((d) => row(nbById(d.source), d.text, d.pageIndex, d.targetPage !== undefined ? `a la pág. ${d.targetPage + 1}` : '', nbById(d.source)?.pages[d.pageIndex]?.id)).join('')}` : ''}
      ${internal.length ? `<small style="color:#A9B0C6">Dentro de esta libreta</small>${internal.map((d) => row(nb, d.text, d.targetPage, `desde pág. ${d.pageIndex + 1}`, d.target.page)).join('')}` : ''}
      <h4>Apartados</h4>
      <div class="strip">${nb.pages.map((p, i) => `<button data-page-open="${p.id}"><img alt="" data-thumb="${i}">${i + 1}</button>`).join('')}</div>
      ${comments.length ? `<small style="color:#A9B0C6">Comentarios</small>${comments.map((c) => `<button class="lrow" data-go="${nb.id}" data-page="${c.page.id}"><span style="width:10px;height:10px;border-radius:50%;background:${c.it.color}"></span><span style="flex:1">${esc(c.it.title)}</span><small>pág. ${c.i + 1}</small></button>`).join('')}` : ''}
      ${nb.outline.length ? `<small style="color:#A9B0C6">Esquema</small>${nb.outline.map((o) => `<button class="lrow" data-go="${nb.id}" data-page="${o.pageId}" style="padding-left:${10 + o.level * 14}px"><span style="flex:1">${esc(o.title)}</span></button>`).join('')}` : ''}`;
    root.appendChild(panel);
    panel.addEventListener('click', (e) => {
      if (e.target.closest('[data-close]')) return select(null);
      if (e.target.closest('[data-open-nb]')) return openWithZoom(id);
      const po = e.target.closest('[data-page-open]');
      if (po) return openNotebook(id, { pageId: po.dataset.pageOpen });
      const go = e.target.closest('[data-go]');
      if (go && go.dataset.go) {
        if (e.target.textContent === '↗' || go.dataset.go === id) return openNotebook(go.dataset.go, { pageId: go.dataset.page || null });
        if (g.nodes.some((n) => n.key === `n:${go.dataset.go}`)) return select(`n:${go.dataset.go}`);
        return openNotebook(go.dataset.go, { pageId: go.dataset.page || null });
      }
    });
    $('img', panel).src = await pageThumb(nb.pages[0], 340);
    for (const img of $$('img[data-thumb]', panel)) img.src = await pageThumb(nb.pages[Number(img.dataset.thumb)], 64);
  }

  // ---------- Dibujo ----------
  // Estrellas en 3D: avanzan hacia la cámara; al viajar se estiran como a velocidad de la luz.
  const rnd = onbRandom(11);
  const stars = Array.from({ length: 220 }, () => ({ x: rnd() * 2 - 1, y: rnd() * 2 - 1, z: 0.05 + rnd() * 0.95, tw: rnd() * 6.28 }));
  const blobs = [['63,89,255', 0.07, 0], ['191,64,242', 0.05, 1.7], ['26,217,217', 0.06, 3.1], ['255,89,153', 0.045, 4.4]];
  const rgb = (hex) => { const h = hex.replace('#', ''); const n = parseInt(h.length === 3 ? h.replace(/./g, (c) => c + c) : h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  let lastNow = performance.now();
  Dyn.warpTarget = 0.04;
  function frame(now) {
    if (!Dyn.running || !document.body.contains(root)) return;
    const dt = Math.min(0.05, (now - lastNow) / 1000); lastNow = now;
    const t = reduceMotion() ? 0 : now / 1000;
    Dyn.cam = Dyn.cam.map((c, i) => c + (Dyn.camTarget[i] - c) * 0.08);
    Dyn.zoom += (Dyn.zoomTarget - Dyn.zoom) * 0.08;
    Dyn.warp += ((reduceMotion() ? 0 : Dyn.warpTarget) - Dyn.warp) * Math.min(1, dt * 4);
    const w = W(), h = H(), cx = w / 2, cy = h / 2, focal = Math.max(w, h) * 0.5;
    const tint = Dyn.anim?.color || (S.folder ? Folders.color(Folders.top(S.folder)) : null);
    // Fondo y nebulosas de fondo (degradados radiales: no hace falta difuminar nada grande)
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, '#070918'); grad.addColorStop(1, '#150C30');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'screen';
    blobs.forEach(([c, sp, ph], i) => {
      const x = w * (0.5 + 0.38 * Math.sin(t * sp + ph)), y = h * (0.5 + 0.34 * Math.cos(t * sp * 1.3 + ph * 0.7));
      const r = Math.min(w, h) * (0.55 + 0.08 * Math.sin(t * sp * 2 + ph));
      const col = tint && i === 0 ? rgb(tint).join(',') : c;
      const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, `rgba(${col},.30)`); rg.addColorStop(1, `rgba(${col},0)`);
      ctx.fillStyle = rg; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    });
    ctx.globalCompositeOperation = 'source-over';
    // Estrellas
    const speed = Dyn.warp;
    ctx.lineCap = 'round';
    for (const s of stars) {
      const pz = s.z;
      s.z -= speed * dt * 1.2;
      if (s.z <= 0.03) { s.z = 1; s.x = rnd() * 2 - 1; s.y = rnd() * 2 - 1; continue; }
      if (s.z > 1) { s.z = 0.04; s.x = (rnd() * 2 - 1) * 0.3; s.y = (rnd() * 2 - 1) * 0.3; continue; }
      const sx = cx + (s.x / s.z) * focal * 0.5, sy = cy + (s.y / s.z) * focal * 0.5;
      if (sx < -50 || sx > w + 50 || sy < -50 || sy > h + 50) { s.z = 1; s.x = rnd() * 2 - 1; s.y = rnd() * 2 - 1; continue; }
      const bright = (1 - s.z) * (0.55 + 0.45 * Math.sin(t * 1.7 + s.tw));
      const streak = Math.abs(speed) > 0.12;
      if (streak) {
        const px = cx + (s.x / pz) * focal * 0.5, py = cy + (s.y / pz) * focal * 0.5;
        ctx.strokeStyle = `rgba(220,230,255,${Math.min(1, 0.3 + bright)})`; ctx.lineWidth = Math.max(0.6, (1 - s.z) * 2.6);
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(sx, sy); ctx.stroke();
      } else {
        ctx.fillStyle = `rgba(255,255,255,${0.15 + bright * 0.85})`;
        ctx.beginPath(); ctx.arc(sx, sy, Math.max(0.5, (1 - s.z) * 1.8), 0, 6.283); ctx.fill();
      }
    }
    // Enlaces
    const views = new Map(g.nodes.map((n) => [n.key, view(n.key, t, now)]));
    const near = new Set(g.edges.flatMap((e) => (e.from === Dyn.selected ? [e.to] : e.to === Dyn.selected ? [e.from] : [])));
    g.edges.forEach((e, index) => {
      const A = views.get(e.from), B = views.get(e.to);
      if (!A || !B) return;
      const alpha = Math.min(A.a, B.a);
      if (alpha <= 0.01) return;
      const a = A.p, b = B.p;
      const involved = Dyn.selected && (e.from === Dyn.selected || e.to === Dyn.selected);
      const faded = Dyn.selected && !involved;
      const fromNode = g.nodes.find((n) => n.key === e.from);
      const color = fromNode.kind === 'nb' ? fromNode.nb.color : Folders.color(Folders.top(fromNode.folder.id));
      const width = (1 + Math.log2(e.count)) * (involved ? 2.2 : e.direct ? 1.2 : 1.6);
      // Un poco curvado: queda más orgánico.
      const mx = (a[0] + b[0]) / 2 + (b[1] - a[1]) * 0.12, my = (a[1] + b[1]) / 2 - (b[0] - a[0]) * 0.12;
      const path = () => { ctx.beginPath(); ctx.moveTo(...a); ctx.quadraticCurveTo(mx, my, ...b); };
      ctx.strokeStyle = color; ctx.globalAlpha = alpha * (faded ? 0.04 : involved ? 0.35 : 0.16); ctx.lineWidth = width * 6;
      path(); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.globalAlpha = alpha * (faded ? 0.08 : involved ? 0.95 : 0.45); ctx.lineWidth = width;
      ctx.setLineDash([10, 8]); ctx.lineDashOffset = -t * (involved ? 60 : 25);
      path(); ctx.stroke();
      ctx.setLineDash([]);
      if (faded) { ctx.globalAlpha = 1; return; }
      const particles = involved ? Math.max(3, Math.min(e.labels.length, 4)) : e.direct ? 1 : Math.min(3, e.count), sp = involved ? 0.45 : 0.2;
      for (let k = 0; k < particles; k++) {
        const raw = t * sp + k / particles + index * 0.17, u = raw % 1, lap = Math.floor(raw);
        const label = e.labels[Math.abs(lap * particles + k) % e.labels.length];
        const q = 1 - u, p = [q * q * a[0] + 2 * q * u * mx + u * u * b[0], q * q * a[1] + 2 * q * u * my + u * u * b[1]];
        if (label != null) {
          // Hojita con el número de la página que se «envía».
          const big = involved, wv = big ? 18 : 15, hv = big ? 23 : 19, fold = 5;
          ctx.globalAlpha = alpha * 0.35; ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(p[0] - wv / 2 - 5, p[1] - hv / 2 - 5, wv + 10, hv + 10, 6); ctx.fill();
          ctx.globalAlpha = alpha; ctx.fillStyle = '#fff'; ctx.strokeStyle = color; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(p[0] - wv / 2, p[1] - hv / 2); ctx.lineTo(p[0] + wv / 2 - fold, p[1] - hv / 2); ctx.lineTo(p[0] + wv / 2, p[1] - hv / 2 + fold);
          ctx.lineTo(p[0] + wv / 2, p[1] + hv / 2); ctx.lineTo(p[0] - wv / 2, p[1] + hv / 2); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#222'; ctx.font = `700 ${big ? 11 : 9}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(String(label), p[0], p[1] + 1);
        } else {
          const r = involved ? 4 : 2.8;
          ctx.globalAlpha = alpha * 0.3; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(p[0], p[1], r * 3, 0, 6.283); ctx.fill();
          ctx.globalAlpha = alpha; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 6.283); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    });
    // Nebulosas de las carpetas, con sus libretas orbitando (en 3D: las de detrás, más pequeñas y oscuras)
    for (const n of g.nodes) {
      if (n.kind !== 'folder') continue;
      const { p, s, a } = views.get(n.key);
      if (a <= 0.01) continue;
      const col = rgb(Folders.color(Folders.top(n.folder.id))), c = col.join(',');
      const hovered = hoverEl?.dataset.key === n.key;
      const pulse = 1 + 0.06 * Math.sin(t * 1.6 + (phase.get(n.key) || 0)) + (hovered ? 0.12 : 0);
      const R = 92 * s * pulse;
      ctx.globalAlpha = a;
      ctx.globalCompositeOperation = 'screen';
      const neb = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], R * 1.5);
      neb.addColorStop(0, `rgba(${c},.85)`); neb.addColorStop(0.25, `rgba(${c},.38)`); neb.addColorStop(0.6, `rgba(${c},.12)`); neb.addColorStop(1, `rgba(${c},0)`);
      ctx.fillStyle = neb; ctx.beginPath(); ctx.arc(p[0], p[1], R * 1.5, 0, 6.283); ctx.fill();
      // Brazos de la nebulosa girando
      ctx.lineWidth = 2 * s;
      for (let k = 0; k < 3; k++) {
        const rot = t * (0.25 + k * 0.07) + k * 2.1 + (phase.get(n.key) || 0);
        ctx.strokeStyle = `rgba(${c},${0.35 - k * 0.08})`;
        ctx.beginPath(); ctx.ellipse(p[0], p[1], R * (0.75 + k * 0.18), R * (0.28 + k * 0.06), rot, 0.3, 2.6); ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
      const inside = Folders.notebooksIn(n.folder.id).slice(0, 9);
      const orbit = inside.map((nb, i) => {
        const ang = t * 0.45 + (i / Math.max(inside.length, 1)) * 6.283 + (phase.get(n.key) || 0);
        return { nb, x: Math.cos(ang) * R * 0.95, y: Math.sin(ang) * R * 0.32, depth: Math.sin(ang) };
      }).sort((u, v) => u.depth - v.depth);
      for (const o of orbit) {
        const sc = s * (0.75 + 0.3 * (o.depth + 1) / 2), ww = 14 * sc, hh = 19 * sc;
        ctx.globalAlpha = a * (0.45 + 0.55 * (o.depth + 1) / 2);
        ctx.shadowColor = o.nb.color; ctx.shadowBlur = 10 * sc;
        ctx.fillStyle = o.nb.color; ctx.beginPath(); ctx.roundRect(p[0] + o.x - ww / 2, p[1] + o.y - hh / 2, ww, hh, 2.5 * sc); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(p[0] + o.x - ww / 2, p[1] + o.y - hh / 2 + 1, 2.5 * sc, hh - 2);
      }
      ctx.globalAlpha = 1;
    }
    // Ondas de la libreta seleccionada
    if (Dyn.selected && !reduceMotion() && views.get(Dyn.selected)) {
      const c = views.get(Dyn.selected).p, color = nbById(Dyn.selected.slice(2))?.color || '#fff', el = (now - Dyn.selectedAt) / 1000;
      for (let k = 0; k < 3; k++) {
        const u = el - k * 0.18;
        if (u <= 0 || u >= 1.4) continue;
        const pr = u / 1.4, r = 40 + pr * 260;
        ctx.globalAlpha = 0.7 * (1 - pr); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(c[0], c[1], r, 0, 6.283); ctx.stroke();
      }
      const pulse = 70 + Math.sin(now / 1000 * 2.4) * 10;
      ctx.globalAlpha = 0.25; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(c[0], c[1], pulse, 0, 6.283); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // Destello del color de la carpeta al cruzar
    if (Dyn.flash) {
      const k = (now - Dyn.flash.start) / Dyn.flash.dur;
      if (k > 1) Dyn.flash = null;
      else if (k > 0) {
        const f = k < 0.25 ? k / 0.25 : 1 - (k - 0.25) / 0.75;
        const c = rgb(Dyn.flash.color).join(',');
        const fg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.75);
        fg.addColorStop(0, `rgba(255,255,255,${0.9 * f})`); fg.addColorStop(0.25, `rgba(${c},${0.75 * f})`); fg.addColorStop(1, `rgba(${c},${0.25 * f})`);
        ctx.fillStyle = fg; ctx.fillRect(0, 0, w, h);
      }
    }
    // Posición de las portadas y las carpetas (elementos de la página, encima del lienzo)
    for (const el of nodesEl.children) {
      const key = el.dataset.key, v = views.get(key);
      if (!v) continue;
      el.style.left = v.p[0] + 'px'; el.style.top = v.p[1] + 'px';
      el.style.opacity = v.a;
      el.style.setProperty('--s', v.s);
      el.style.pointerEvents = dynBusy() ? 'none' : '';
      el.classList.toggle('sel', key === Dyn.selected);
      el.classList.toggle('dim', !!Dyn.selected && key !== Dyn.selected && !near.has(key));
      if (hoverEl && hoverEl.dataset.key === key) { hoverEl.style.left = (v.p[0] - 100) + 'px'; hoverEl.style.top = key.startsWith('f:') ? (v.p[1] + 90) + 'px' : Math.max(8, v.p[1] - 280) + 'px'; }
    }
    Dyn.raf = requestAnimationFrame(frame);
  }

  // Al entrar en el modo dinámico, todo aparece desde el centro.
  goLevel(S.folder);
  if (!reduceMotion()) { const a = (Dyn.anim = { kind: 'emerge', start: performance.now(), dur: 1200 }); Dyn.warp = 0.8; setTimeout(() => { if (Dyn.anim === a) Dyn.anim = null; }, 1250); }
  Dyn.raf = requestAnimationFrame(frame);
}

// =============================================================================
// Temporizador de estudio (pomodoro): igual que en la app nativa.
// No cuenta segundos: guarda la hora a la que acaba cada fase, así es exacto aunque se cierre la
// pestaña. La primera vez que se empieza pide permiso para avisar con una notificación.
// =============================================================================
const POMO_PHASES = {
  focus: { title: 'Estudio', color: '#FF3B30', icon: 'book' },
  shortBreak: { title: 'Descanso', color: '#34C759', icon: 'sun' },
  longBreak: { title: 'Descanso largo', color: '#30B0C7', icon: 'sun' },
};
const POMO_DEFAULTS = { focusMinutes: 25, shortBreakMinutes: 5, longBreakMinutes: 15, sessionsBeforeLongBreak: 4, autoStartNext: true, alarm: true };

const Pomo = {
  settings: Object.assign({}, POMO_DEFAULTS),
  // phase, completed (sesiones de estudio terminadas en la tanda), endAt (en marcha), paused (segundos que quedaban)
  state: { phase: 'focus', completed: 0, endAt: null, paused: null },
  announcement: null,
  ticker: null,
  visible: true,

  load() {
    try {
      const saved = JSON.parse(localStorage.getItem('libreta-pomodoro') || '{}');
      Object.assign(this.settings, saved.settings || {});
      Object.assign(this.state, saved.state || {});
      this.visible = saved.visible !== false;
    } catch (e) { /* sin datos guardados */ }
    this.tick();
    if (this.state.endAt) this.startTicker();
  },
  save() {
    try { localStorage.setItem('libreta-pomodoro', JSON.stringify({ settings: this.settings, state: this.state, visible: this.visible })); } catch (e) { /* sin guardar */ }
  },
  duration(phase) {
    const s = this.settings;
    return 60 * (phase === 'focus' ? s.focusMinutes : phase === 'shortBreak' ? s.shortBreakMinutes : s.longBreakMinutes);
  },
  get running() { return this.state.endAt != null; },
  get paused() { return this.state.paused != null; },
  get fresh() { return !this.running && !this.paused && this.state.phase === 'focus' && this.state.completed === 0; },
  remaining(now = Date.now()) {
    if (this.state.endAt) return Math.max(0, (this.state.endAt - now) / 1000);
    return this.state.paused ?? this.duration(this.state.phase);
  },
  progress(now = Date.now()) { const total = this.duration(this.state.phase); return total > 0 ? 1 - this.remaining(now) / total : 0; },
  remainingText() { const sec = Math.ceil(this.remaining()); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; },
  next() {
    const st = this.state;
    if (st.phase === 'focus') {
      const done = st.completed + 1;
      return { phase: done >= Math.max(1, this.settings.sessionsBeforeLongBreak) ? 'longBreak' : 'shortBreak', completed: done };
    }
    return { phase: 'focus', completed: st.phase === 'longBreak' ? 0 : st.completed };
  },
  moveToNext(startAt) {
    const n = this.next();
    this.state = { phase: n.phase, completed: n.completed, endAt: startAt != null ? startAt + this.duration(n.phase) * 1000 : null, paused: null };
  },
  startOrPause() {
    if (this.running) {
      this.state.paused = this.remaining();
      this.state.endAt = null;
    } else {
      this.state.endAt = Date.now() + (this.state.paused ?? this.duration(this.state.phase)) * 1000;
      this.state.paused = null;
      Alarm.unlock();
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
      this.startTicker();
    }
    this.announcement = null;
    this.changed();
  },
  skip() { this.moveToNext(this.running ? Date.now() : null); this.announcement = null; this.changed(); },
  reset() { this.state = { phase: 'focus', completed: 0, endAt: null, paused: null }; this.announcement = null; this.changed(); },
  startTicker() {
    if (this.ticker) return;
    this.ticker = setInterval(() => { this.tick(); if (!this.running) { clearInterval(this.ticker); this.ticker = null; } this.render(); }, 500);
  },
  /** Avanza el reloj: si una o varias fases han terminado, suena la alarma y se avisa. */
  tick() {
    const now = Date.now();
    let last = null, guard = 0;
    while (this.state.endAt && this.state.endAt <= now && guard++ < 50) {
      last = this.state.phase;
      const end = this.state.endAt;
      this.moveToNext(this.settings.autoStartNext ? end : null);
    }
    if (!last) return;
    if (this.settings.alarm) Alarm.play();
    const next = this.state.phase, minutes = Math.round(this.duration(next) / 60);
    this.announcement = { next, minutes, waiting: !this.running, at: now };
    const title = next === 'focus' ? 'Vuelta al estudio' : '¡Hora del descanso!';
    if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification(title, { body: `${POMO_PHASES[last].title} terminado. Ahora: ${POMO_PHASES[next].title.toLowerCase()} de ${minutes} min.`, icon: 'icon-192.png' }); } catch (e) { /* sin aviso */ }
    }
    this.changed();
  },
  changed() { this.save(); this.render(); },

  // ---------- Interfaz ----------
  /** El reloj de la barra: un icono parado; el tiempo y la fase en marcha. Siempre del mismo ancho. */
  buttonHTML() {
    if (!this.visible) return '';
    if (this.fresh) return `<button class="icon-btn pomo-btn" id="pomo-btn" title="Temporizador de estudio" aria-label="Temporizador de estudio">${icon('timer')}</button>`;
    const p = POMO_PHASES[this.state.phase];
    return `<button class="pomo-btn running" id="pomo-btn" style="--pc:${p.color}" title="${p.title}" aria-label="${p.title}: quedan ${this.remainingText()}">
      ${icon(this.running ? p.icon : 'pause')}<span>${this.remainingText()}</span></button>`;
  },
  render() {
    const slot = document.getElementById('pomo-slot');
    if (slot) {
      const html = this.buttonHTML();
      if (slot.dataset.html !== html) { slot.dataset.html = html; slot.innerHTML = html; }
    }
    const panel = document.getElementById('pomo-panel');
    if (panel) this.renderPanel(panel);
    this.renderBanner();
  },
  openPanel(anchor) {
    const old = document.getElementById('pomo-panel');
    if (old) { old.remove(); return; }
    closePopover();
    const panel = document.createElement('div');
    panel.id = 'pomo-panel';
    panel.className = 'pomo-panel';
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-label', 'Temporizador de estudio');
    document.body.appendChild(panel);
    const r = anchor.getBoundingClientRect();
    panel.style.top = `${r.bottom + 8}px`;
    panel.style.left = `${Math.min(window.innerWidth - 350, Math.max(10, r.left + r.width / 2 - 170))}px`;
    this.renderPanel(panel);
    setTimeout(() => document.addEventListener('pointerdown', function close(e) {
      if (!panel.contains(e.target) && !e.target.closest('#pomo-btn')) { panel.remove(); document.removeEventListener('pointerdown', close); }
    }), 0);
  },
  renderPanel(panel) {
    const st = this.state, p = POMO_PHASES[st.phase], s = this.settings;
    const ring = 2 * Math.PI * 64, progress = Math.min(1, Math.max(0, this.progress()));
    const status = this.paused ? 'En pausa' : this.running ? 'quedan' : `${Math.round(this.duration(st.phase) / 60)} min`;
    const stepper = (key, label, min, max, step) => `<div class="pomo-row"><span>${label}: <b>${s[key]}${key === 'sessionsBeforeLongBreak' ? '' : ' min'}</b></span>
      <span class="stepper"><button data-step="${key}" data-d="${-step}" data-min="${min}" data-max="${max}" aria-label="Menos">${icon('minus')}</button><button data-step="${key}" data-d="${step}" data-min="${min}" data-max="${max}" aria-label="Más">${icon('plus')}</button></span></div>`;
    panel.innerHTML = `
      <div class="pomo-title" style="color:${p.color}">${this.fresh ? `${p.title} · listo para empezar` : p.title}</div>
      <div class="pomo-ring">
        <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" stroke="${p.color}" stroke-opacity=".18" stroke-width="10" fill="none"/>
          <circle cx="75" cy="75" r="64" stroke="${p.color}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${ring}" stroke-dashoffset="${ring * (1 - progress)}" transform="rotate(-90 75 75)"/></svg>
        <div><b>${this.remainingText()}</b><small>${status}</small></div>
      </div>
      <div class="pomo-dots">${Array.from({ length: Math.max(1, s.sessionsBeforeLongBreak) }, (_, i) => `<span class="${i < st.completed ? 'on' : ''}"></span>`).join('')}</div>
      <div class="pomo-actions">
        <button class="round" data-pomo="reset" title="Volver a empezar" aria-label="Volver a empezar">${icon('rotate')}</button>
        <button class="go" data-pomo="toggle" style="background:${p.color}">${icon(this.running ? 'pause' : 'play')} ${this.running ? 'Pausar' : this.paused ? 'Seguir' : 'Empezar'}</button>
        <button class="round" data-pomo="skip" title="Saltar esta fase" aria-label="Saltar esta fase">${icon('chevronRight')}</button>
      </div>
      ${this.fresh ? '' : `<button class="pomo-remove" data-pomo="remove">${icon('close')} Quitar temporizador</button>`}
      <hr>
      ${stepper('focusMinutes', 'Estudio', 5, 120, 5)}${stepper('shortBreakMinutes', 'Descanso', 1, 30, 1)}${stepper('longBreakMinutes', 'Descanso largo', 5, 60, 5)}
      ${stepper('sessionsBeforeLongBreak', 'Descanso largo cada (sesiones)', 2, 8, 1)}
      <label class="pomo-row"><span>Empezar la siguiente fase sola</span><input type="checkbox" data-opt="autoStartNext" ${s.autoStartNext ? 'checked' : ''}></label>
      <div class="pomo-row"><label><input type="checkbox" data-opt="alarm" ${s.alarm ? 'checked' : ''}> Alarma</label><button class="btn" data-pomo="test">Probar</button></div>`;
    panel.onclick = (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      const act = b.dataset.pomo;
      if (act === 'toggle') this.startOrPause();
      if (act === 'skip') this.skip();
      if (act === 'reset') this.reset();
      if (act === 'remove') { this.reset(); panel.remove(); }
      if (act === 'test') { Alarm.unlock(); Alarm.play(); }
      if (b.dataset.step) {
        const k = b.dataset.step;
        s[k] = Math.min(Number(b.dataset.max), Math.max(Number(b.dataset.min), s[k] + Number(b.dataset.d)));
        this.changed();
      }
    };
    panel.onchange = (e) => { const k = e.target.dataset.opt; if (k) { s[k] = e.target.checked; this.changed(); } };
  },
  /** «¡Hora del descanso!» arriba en el editor. */
  renderBanner() {
    const old = document.getElementById('pomo-banner');
    const a = this.announcement;
    if (!a || S.view !== 'editor') { old?.remove(); return; }
    if (old && old.dataset.at === String(a.at)) return;
    old?.remove();
    const p = POMO_PHASES[a.next];
    const banner = document.createElement('div');
    banner.id = 'pomo-banner';
    banner.className = 'pomo-banner';
    banner.dataset.at = a.at;
    banner.style.setProperty('--pc', p.color);
    banner.setAttribute('role', 'status');
    banner.innerHTML = `<span class="ico">${icon(p.icon)}</span><div><b>${a.next === 'focus' ? 'Vuelta al estudio' : '¡Hora del descanso!'}</b>
      <small>${p.title} de ${a.minutes} min${a.waiting ? ', cuando quieras.' : ' en marcha.'}</small></div>
      ${a.waiting ? '<button class="btn primary" data-b="start">Empezar</button>' : ''}<button class="icon-btn plain" data-b="close" aria-label="Cerrar aviso">${icon('close')}</button>`;
    banner.onclick = (e) => {
      const b = e.target.closest('[data-b]');
      if (!b) return;
      if (b.dataset.b === 'start') this.startOrPause();
      this.announcement = null;
      banner.remove();
    };
    document.body.appendChild(banner);
    if (!a.waiting) setTimeout(() => { if (this.announcement?.at === a.at) { this.announcement = null; banner.remove(); } }, 10000);
  },
  contextMenu(e) {
    e.preventDefault();
    popover({ x: e.clientX, y: e.clientY }, this.fresh ? `<button data-act="toggle">${icon('play')} Empezar a estudiar</button>`
      : `<button data-act="toggle">${icon(this.running ? 'pause' : 'play')} ${this.running ? 'Pausar' : 'Seguir'}</button>
      <button data-act="skip">${icon('chevronRight')} Saltar esta fase</button><hr><button data-act="remove">${icon('close')} Quitar temporizador</button>`, (act) => {
      if (act === 'toggle') this.startOrPause();
      if (act === 'skip') this.skip();
      if (act === 'remove') this.reset();
    });
  },
};

/** La alarma: tres notas suaves que suben (do-mi-sol agudos), dos veces, como en la app nativa. */
const Alarm = {
  ctx: null,
  /** El navegador solo deja sonar audio después de un clic: se prepara al pulsar Empezar. */
  unlock() {
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { /* sin audio */ }
  },
  play() {
    const ctx = this.ctx;
    if (!ctx) return;
    const t0 = ctx.currentTime + 0.05;
    [[1046.5, 0], [1318.5, 0.18], [1568, 0.36], [1046.5, 0.9], [1318.5, 1.08], [1568, 1.26]].forEach(([f, at]) => {
      for (const [mult, level] of [[1, 0.28], [2, 0.08]]) {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.frequency.value = f * mult;
        gain.gain.setValueAtTime(0, t0 + at);
        gain.gain.linearRampToValueAtTime(level, t0 + at + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 0.55);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t0 + at);
        osc.stop(t0 + at + 0.6);
      }
    });
  },
};

// =============================================================================
// Carpetas (como en Goodnotes): carpetas dentro de carpetas. Cada libreta está en una carpeta
// (nb.folder) o en el inicio (null). Las carpetas del primer nivel dan color y agrupan las
// pestañas. Sustituyen a los «espacios» de antes, que se convierten solos en carpetas.
// =============================================================================
const Folders = {
  list: [], // { id, name, parent, color, created, modified }

  byId(id) { return id ? this.list.find((f) => f.id === id) || null : null; },
  children(parent) { return this.list.filter((f) => (f.parent || null) === (parent || null)).sort((a, b) => a.name.localeCompare(b.name, 'es', { numeric: true })); },
  /** De la carpeta de primer nivel hasta `id`. */
  path(id) {
    const out = [];
    for (let f = this.byId(id), guard = 0; f && guard < 50; f = this.byId(f.parent), guard++) out.unshift(f);
    return out;
  },
  top(id) { return this.path(id)[0] || null; },
  topOf(nb) { return this.top(nb?.folder); },
  /** ¿Está `id` dentro de `ancestor` (o es ella)? */
  within(id, ancestor) { return !ancestor || this.path(id).some((f) => f.id === ancestor); },
  inSubtree(nb, ancestor) { return !ancestor || this.within(nb.folder, ancestor); },
  color(f) { return f?.color || spaceColor(f?.name || ''); },
  label(nb) { return this.path(nb.folder).map((f) => f.name).join(' › '); },
  /** Libretas de una carpeta y todas sus subcarpetas. */
  notebooksIn(id) { return S.notebooks.filter((nb) => this.within(nb.folder, id)); },
  /** Árbol para menús: [{ folder, depth }]. */
  tree(parent = null, depth = 0, out = []) {
    for (const f of this.children(parent)) { out.push({ folder: f, depth }); this.tree(f.id, depth + 1, out); }
    return out;
  },

  save() { Store.set('folders', this.list); },
  create(name, parent = null) {
    const f = { id: uid(), name: name.trim() || 'Carpeta sin título', parent: parent || null, color: null, created: Date.now(), modified: Date.now() };
    this.list.push(f);
    this.save();
    return f;
  },
  /** La carpeta de primer nivel con ese nombre (la crea si no existe). */
  topNamed(name) {
    return this.list.find((f) => !f.parent && f.name === name) || this.create(name, null);
  },
  rename(id, name) { const f = this.byId(id); if (f && name.trim()) { f.name = name.trim(); f.modified = Date.now(); this.save(); } },
  /** Mover una carpeta dentro de otra (nunca dentro de sí misma ni de sus subcarpetas). */
