// =============================================================================
// Modo dinámico: las libretas flotan sobre un fondo animado, unidas por sus enlaces
// =============================================================================
const Dyn = { running: false };
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function stopDynamic() {
  Dyn.running = false;
  if (Dyn.raf) cancelAnimationFrame(Dyn.raf);
  if (Dyn.onResize) removeEventListener('resize', Dyn.onResize);
}

function dynamicGraph() {
  const nodes = S.notebooks.filter((nb) => !S.space || nb.space === S.space);
  const ids = new Set(nodes.map((n) => n.id));
  const pageIndex = new Map(S.notebooks.map((nb) => [nb.id, new Map(nb.pages.map((p, i) => [p.id, i]))]));
  const details = S.notebooks.flatMap(notebookLinks).map((d) => ({ ...d, targetPage: d.target.page ? pageIndex.get(d.target.nb)?.get(d.target.page) : undefined }));
  const edges = new Map();
  for (const d of details) {
    if (d.source === d.target.nb || !ids.has(d.source) || !ids.has(d.target.nb)) continue;
    const key = d.source + '|' + d.target.nb;
    const e = edges.get(key) || { from: d.source, to: d.target.nb, count: 0, pages: new Set(), whole: false };
    e.count++;
    if (d.targetPage !== undefined) e.pages.add(d.targetPage + 1); else e.whole = true;
    edges.set(key, e);
  }
  for (const e of edges.values()) e.labels = [...e.pages].sort((a, b) => a - b).concat(e.whole ? [null] : []);
  return { nodes, edges: [...edges.values()], details };
}

async function startDynamic(root) {
  stopDynamic();
  if (!root) return;
  const g = dynamicGraph();
  Object.assign(Dyn, { running: true, root, g, selected: null, hovered: null, selectedAt: 0, cam: [0, 0], camTarget: [0, 0], zoom: 1, zoomTarget: 1, dragging: null });
  root.innerHTML = `<canvas></canvas><div class="nodes"></div>
    <button class="btn reset" hidden>Recolocar automáticamente</button>
    <div class="hint">Arrastra las libretas para colocarlas · pasa el ratón para verlas · clic para ver sus vínculos · doble clic para abrirlas</div>`;
  if (!g.nodes.length) { root.querySelector('.hint').textContent = 'No hay libretas en este espacio.'; }
  const canvas = $('canvas', root), nodesEl = $('.nodes', root);
  const layout = Graph.layout(g.nodes.map((n) => n.id), g.edges.map((e) => [e.from, e.to]));
  const spaceKey = S.space || '*';
  const manual = () => (S.dynpos[spaceKey] = S.dynpos[spaceKey] || {});
  const resetBtn = $('.reset', root);
  resetBtn.hidden = !Object.keys(manual()).length;
  resetBtn.addEventListener('click', () => { S.dynpos[spaceKey] = {}; Store.set('dynpos', S.dynpos); resetBtn.hidden = true; place(); });

  // Nodos (portadas)
  const phase = new Map(g.nodes.map((n, i) => [n.id, (i * 2.399) % (Math.PI * 2)]));
  for (const nb of g.nodes) {
    const el = document.createElement('div');
    el.className = 'dnode';
    el.dataset.id = nb.id;
    el.style.setProperty('--glow', nb.color);
    el.innerHTML = `${coverHTML(nb, { label: false, tag: 'div' })}<div class="lbl">${esc(nb.title)}</div>`;
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', `${nb.title}, ${degree(nb.id)} vínculos`);
    nodesEl.appendChild(el);
  }
  function degree(id) { return g.edges.filter((e) => e.from === id || e.to === id).reduce((s, e) => s + e.count, 0); }

  let base = {};
  function place() {
    const W = root.clientWidth, H = root.clientHeight;
    base = Graph.place(layout, W, H, 100, { w: 150, h: 150 });
    for (const [id, rel] of Object.entries(manual())) if (base[id]) base[id] = [rel[0] * W, rel[1] * H];
  }
  place();
  Dyn.onResize = () => { place(); sizeCanvas(); };
  addEventListener('resize', Dyn.onResize);
  function sizeCanvas() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = root.clientWidth * dpr; canvas.height = root.clientHeight * dpr;
    canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeCanvas();

  const screen = (id, t) => {
    if (Dyn.dragging?.id === id && Dyn.dragging.moved) return Dyn.dragging.at;
    const b = base[id] || [0, 0], W = root.clientWidth, H = root.clientHeight;
    const f = reduceMotion() ? [0, 0] : [Math.sin(t * 0.5 + phase.get(id)) * 7, Math.cos(t * 0.4 + phase.get(id) * 1.3) * 9];
    return [W / 2 + (b[0] - W / 2) * Dyn.zoom + Dyn.cam[0] + f[0], H / 2 + (b[1] - H / 2) * Dyn.zoom + Dyn.cam[1] + f[1]];
  };
  const neighbors = () => new Set(g.edges.flatMap((e) => (e.from === Dyn.selected ? [e.to] : e.to === Dyn.selected ? [e.from] : [])));

  // Interacción: arrastrar, pasar por encima, clic y doble clic
  nodesEl.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.dnode');
    if (!el) return;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* puntero sintético */ }
    const r = root.getBoundingClientRect();
    Dyn.dragging = { id: el.dataset.id, start: [e.clientX, e.clientY], at: [e.clientX - r.left, e.clientY - r.top], moved: false };
  });
  nodesEl.addEventListener('pointermove', (e) => {
    const d = Dyn.dragging;
    if (!d) return;
    const r = root.getBoundingClientRect();
    d.at = [e.clientX - r.left, e.clientY - r.top];
    if (Math.hypot(e.clientX - d.start[0], e.clientY - d.start[1]) > 5) { d.moved = true; hideHover(); }
  });
  nodesEl.addEventListener('pointerup', () => {
    const d = Dyn.dragging;
    Dyn.dragging = null;
    if (!d) return;
    if (d.moved) {
      const W = root.clientWidth, H = root.clientHeight;
      const b = [W / 2 + (d.at[0] - Dyn.cam[0] - W / 2) / Dyn.zoom, H / 2 + (d.at[1] - Dyn.cam[1] - H / 2) / Dyn.zoom];
      manual()[d.id] = [Math.min(Math.max(b[0], 50), W - 50) / W, Math.min(Math.max(b[1], 50), H - 50) / H];
      Store.set('dynpos', S.dynpos);
      resetBtn.hidden = false;
      place();
    } else {
      select(d.id);
    }
  });
  nodesEl.addEventListener('dblclick', (e) => { const el = e.target.closest('.dnode'); if (el) openNotebook(el.dataset.id); });
  nodesEl.addEventListener('keydown', (e) => { const el = e.target.closest('.dnode'); if (el && e.key === 'Enter') openNotebook(el.dataset.id); if (el && e.key === ' ') { e.preventDefault(); select(el.dataset.id); } });
  nodesEl.addEventListener('pointerover', (e) => { const el = e.target.closest('.dnode'); if (el && !Dyn.dragging && el.dataset.id !== Dyn.selected) showHover(el.dataset.id); });
  nodesEl.addEventListener('pointerout', (e) => { const el = e.target.closest('.dnode'); if (el && !el.contains(e.relatedTarget)) hideHover(); });
  canvas.addEventListener('click', () => select(null));

  let hoverEl = null;
  async function showHover(id) {
    hideHover();
    const nb = nbById(id);
    hoverEl = document.createElement('div');
    hoverEl.className = 'hover-card';
    hoverEl.style.setProperty('--glow', nb.color);
    hoverEl.dataset.id = id;
    hoverEl.innerHTML = `<img alt=""><div style="margin-top:6px;font-weight:700">${esc(nb.title)}</div><div style="opacity:.75">${nb.pages.length} ${nb.pages.length === 1 ? 'página' : 'páginas'} · ${degree(id)} ${degree(id) === 1 ? 'vínculo' : 'vínculos'}</div>`;
    root.appendChild(hoverEl);
    $('img', hoverEl).src = await pageThumb(nb.pages[0], 180);
  }
  function hideHover() { hoverEl?.remove(); hoverEl = null; }

  function select(id) {
    hideHover();
    Dyn.selected = id;
    Dyn.selectedAt = performance.now();
    $('.panel', root)?.remove();
    if (!id) { Dyn.camTarget = [0, 0]; Dyn.zoomTarget = 1; return; }
    const W = root.clientWidth, H = root.clientHeight, b = base[id];
    Dyn.zoomTarget = 1.15;
    const targetX = W > 760 ? (W - 400) / 2 : W / 2;
    Dyn.camTarget = [targetX - (W / 2 + (b[0] - W / 2) * 1.15), H / 2 - (H / 2 + (b[1] - H / 2) * 1.15)];
    renderPanel(id);
  }
  Dyn.select = select;

  async function renderPanel(id) {
    const nb = nbById(id);
    const out = g.details.filter((d) => d.source === id && d.target.nb !== id);
    const inc = g.details.filter((d) => d.target.nb === id && d.source !== id);
    const internal = g.details.filter((d) => d.source === id && d.target.nb === id);
    const comments = nb.pages.flatMap((p, i) => p.items.filter((it) => it.type === 'comment').map((it) => ({ it, i, page: p })));
    const row = (other, text, page, extra, openPage) => `<button class="lrow" data-go="${other?.id || ''}" data-page="${openPage || ''}">
      <span style="width:12px;height:12px;border-radius:50%;background:${other?.color || '#888'};box-shadow:0 0 6px ${other?.color || '#888'};flex:none"></span>
      <span style="flex:1;min-width:0"><b>${esc(other?.title || 'Libreta borrada')}</b><small>${[text && `«${esc(text)}»`, page !== undefined && `pág. ${page + 1}`, extra].filter(Boolean).join(' · ')}</small></span>
      <span aria-hidden="true">↗</span></button>`;
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.style.setProperty('--glow', nb.color);
    panel.innerHTML = `
      <div style="display:flex;align-items:flex-start;gap:8px"><div style="flex:1"><h3>${esc(nb.title)}</h3>
        <small style="color:#A9B0C6">${nb.space ? esc(nb.space) + ' · ' : ''}${nb.pages.length} ${nb.pages.length === 1 ? 'página' : 'páginas'} · ${formatDate(nb.modified)}</small></div>
        <button class="btn" data-close aria-label="Cerrar panel">✕</button></div>
      <img alt="" style="width:100%;border-radius:10px;background:#fff">
      <button class="btn primary" data-open-nb style="justify-content:center;background:${nb.color};color:#fff">${nb.lastPageId ? 'Abrir donde lo dejaste' : 'Abrir libreta'}</button>
      <h4>Vínculos</h4>
      ${!out.length && !inc.length && !internal.length ? '<small style="color:#A9B0C6">Esta libreta aún no tiene vínculos. Selecciona un texto y pulsa «Enlace», o usa la herramienta de enlace.</small>' : ''}
      ${out.length ? `<small style="color:#A9B0C6">Enlaza a</small>${out.map((d) => row(nbById(d.target.nb), d.text, d.targetPage, `desde pág. ${d.pageIndex + 1}`, d.target.page)).join('')}` : ''}
      ${inc.length ? `<small style="color:#A9B0C6">Enlazado desde</small>${inc.map((d) => row(nbById(d.source), d.text, d.pageIndex, d.targetPage !== undefined ? `a la pág. ${d.targetPage + 1}` : '', nbById(d.source)?.pages[d.pageIndex]?.id)).join('')}` : ''}
      ${internal.length ? `<small style="color:#A9B0C6">Dentro de esta libreta</small>${internal.map((d) => row(nb, d.text, d.targetPage, `desde pág. ${d.pageIndex + 1}`, d.target.page)).join('')}` : ''}
      <h4>Apartados</h4>
      <div class="strip">${nb.pages.map((p, i) => `<button data-page-open="${p.id}"><img alt="" data-thumb="${i}">${i + 1}</button>`).join('')}</div>
      ${comments.length ? `<small style="color:#A9B0C6">Comentarios</small>${comments.map((c) => `<button class="lrow" data-go="${nb.id}" data-page="${c.page.id}"><span style="width:10px;height:10px;border-radius:50%;background:${c.it.color}"></span><span style="flex:1">${esc(c.it.title)}</span><small>pág. ${c.i + 1}</small></button>`).join('')}` : ''}
      ${nb.outline.length ? `<small style="color:#A9B0C6">Esquema</small>${nb.outline.map((o) => `<button class="lrow" data-go="${nb.id}" data-page="${o.pageId}" style="padding-left:${10 + o.level * 14}px"><span style="flex:1">${esc(o.title)}</span></button>`).join('')}` : ''}`;
    root.appendChild(panel);
    panel.addEventListener('click', (e) => {
      if (e.target.closest('[data-close]')) return select(null);
      if (e.target.closest('[data-open-nb]')) return openNotebook(id);
      const po = e.target.closest('[data-page-open]');
      if (po) return openNotebook(id, { pageId: po.dataset.pageOpen });
      const go = e.target.closest('[data-go]');
      if (go && go.dataset.go) {
        if (e.target.textContent === '↗' || go.dataset.go === id) return openNotebook(go.dataset.go, { pageId: go.dataset.page || null });
        if (nbById(go.dataset.go) && g.nodes.some((n) => n.id === go.dataset.go)) return select(go.dataset.go);
        return openNotebook(go.dataset.go, { pageId: go.dataset.page || null });
      }
    });
    $('img', panel).src = await pageThumb(nb.pages[0], 340);
    for (const img of $$('img[data-thumb]', panel)) img.src = await pageThumb(nb.pages[Number(img.dataset.thumb)], 64);
  }

  // Bucle de dibujo
  const stars = Array.from({ length: 110 }, (_, i) => ({ x: (Math.sin(i * 12.9898) * 43758.5453) % 1, y: (Math.sin(i * 78.233) * 12345.6789) % 1, s: 0.6 + ((i * 0.73) % 1) * 1.4, sp: 0.8 + ((i * 0.37) % 1) * 2 }));
  const blobs = [['#3F59FF', 0.07, 0], ['#BF40F2', 0.05, 1.7], ['#1AD9D9', 0.06, 3.1], ['#FF5999', 0.045, 4.4]];
  function frame(now) {
    if (!Dyn.running || !document.body.contains(root)) return;
    const t = reduceMotion() ? 0 : now / 1000;
    Dyn.cam = Dyn.cam.map((c, i) => c + (Dyn.camTarget[i] - c) * 0.08);
    Dyn.zoom += (Dyn.zoomTarget - Dyn.zoom) * 0.08;
    const W = root.clientWidth, H = root.clientHeight, ctx = canvas.getContext('2d');
    // Fondo
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, '#080A19'); grad.addColorStop(1, '#170D33');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.filter = 'blur(70px)';
    ctx.globalCompositeOperation = 'screen';
    for (const [c, sp, ph] of blobs) {
      const x = W * (0.5 + 0.38 * Math.sin(t * sp + ph)), y = H * (0.5 + 0.34 * Math.cos(t * sp * 1.3 + ph * 0.7));
      const r = Math.min(W, H) * (0.32 + 0.06 * Math.sin(t * sp * 2 + ph));
      ctx.globalAlpha = 0.35; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    for (const s of stars) {
      const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.x * 10));
      ctx.globalAlpha = tw * 0.8; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(Math.abs(s.x) * W, Math.abs(s.y) * H, s.s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Enlaces
    const near = neighbors();
    g.edges.forEach((e, index) => {
      const a = screen(e.from, t), b = screen(e.to, t);
      const involved = Dyn.selected && (e.from === Dyn.selected || e.to === Dyn.selected);
      const faded = Dyn.selected && !involved;
      const color = nbById(e.from)?.color || '#fff';
      const width = (1 + Math.log2(e.count)) * (involved ? 2.2 : 1.2);
      ctx.lineCap = 'round';
      ctx.strokeStyle = color; ctx.globalAlpha = faded ? 0.04 : involved ? 0.35 : 0.15; ctx.lineWidth = width * 5;
      ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.globalAlpha = faded ? 0.08 : involved ? 0.95 : 0.45; ctx.lineWidth = width;
      ctx.setLineDash([10, 8]); ctx.lineDashOffset = -t * (involved ? 60 : 25);
      ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
      if (faded) return;
      const particles = involved ? Math.max(3, Math.min(e.labels.length, 4)) : 1, speed = involved ? 0.45 : 0.2;
      for (let k = 0; k < particles; k++) {
        const raw = t * speed + k / particles + index * 0.17, u = raw % 1, lap = Math.floor(raw);
        const label = e.labels[Math.abs(lap * particles + k) % e.labels.length];
        const p = [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
        if (label != null) {
          // Hojita con el número de la página que se «envía».
          const big = involved, wv = big ? 18 : 15, hv = big ? 23 : 19, fold = 5;
          ctx.globalAlpha = 0.35; ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(p[0] - wv / 2 - 5, p[1] - hv / 2 - 5, wv + 10, hv + 10, 6); ctx.fill();
          ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.strokeStyle = color; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(p[0] - wv / 2, p[1] - hv / 2); ctx.lineTo(p[0] + wv / 2 - fold, p[1] - hv / 2); ctx.lineTo(p[0] + wv / 2, p[1] - hv / 2 + fold);
          ctx.lineTo(p[0] + wv / 2, p[1] + hv / 2); ctx.lineTo(p[0] - wv / 2, p[1] + hv / 2); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#222'; ctx.font = `700 ${big ? 11 : 9}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(String(label), p[0], p[1] + 1);
        } else {
          const r = involved ? 4 : 2.5;
          ctx.globalAlpha = 0.25; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(p[0], p[1], r * 3, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, Math.PI * 2); ctx.fill();
        }
      }
    });
    // Ondas de la libreta seleccionada
    if (Dyn.selected && !reduceMotion()) {
      const c = screen(Dyn.selected, t), color = nbById(Dyn.selected)?.color || '#fff', el = (now - Dyn.selectedAt) / 1000;
      for (let k = 0; k < 3; k++) {
        const u = el - k * 0.18;
        if (u <= 0 || u >= 1.4) continue;
        const pr = u / 1.4, r = 40 + pr * 260;
        ctx.globalAlpha = 0.7 * (1 - pr); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(c[0], c[1], r, 0, Math.PI * 2); ctx.stroke();
      }
      const pulse = 70 + Math.sin(now / 1000 * 2.4) * 10;
      ctx.globalAlpha = 0.25; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(c[0], c[1], pulse, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // Posición de las portadas
    for (const el of nodesEl.children) {
      const id = el.dataset.id, p = screen(id, t);
      el.style.left = p[0] + 'px'; el.style.top = p[1] + 'px';
      el.classList.toggle('sel', id === Dyn.selected);
      el.classList.toggle('dim', !!Dyn.selected && id !== Dyn.selected && !near.has(id));
      if (hoverEl && hoverEl.dataset.id === id) { hoverEl.style.left = (p[0] - 100) + 'px'; hoverEl.style.top = Math.max(8, p[1] - 280) + 'px'; }
    }
    Dyn.raf = requestAnimationFrame(frame);
  }
  Dyn.raf = requestAnimationFrame(frame);
}

// =============================================================================
// Temporizador de estudio (pomodoro): igual que en la app nativa.
// No cuenta segundos: guarda la hora a la que acaba cada fase, así es exacto aunque se cierre la
// pestaña. La primera vez que se empieza pide permiso para avisar con una notificación.
// =============================================================================
const POMO_PHASES = {
  focus: { title: 'Estudio', color: '#FF3B30', icon: 'book' },
  shortBreak: { title: 'Descanso', color: '#34C759', icon: 'sun' },
  longBreak: { title: 'Descanso largo', color: '#30B0C7', icon: 'sun' },
};
const POMO_DEFAULTS = { focusMinutes: 25, shortBreakMinutes: 5, longBreakMinutes: 15, sessionsBeforeLongBreak: 4, autoStartNext: true, alarm: true };

const Pomo = {
  settings: Object.assign({}, POMO_DEFAULTS),
  // phase, completed (sesiones de estudio terminadas en la tanda), endAt (en marcha), paused (segundos que quedaban)
  state: { phase: 'focus', completed: 0, endAt: null, paused: null },
  announcement: null,
  ticker: null,
  visible: true,

  load() {
    try {
      const saved = JSON.parse(localStorage.getItem('libreta-pomodoro') || '{}');
      Object.assign(this.settings, saved.settings || {});
      Object.assign(this.state, saved.state || {});
      this.visible = saved.visible !== false;
    } catch (e) { /* sin datos guardados */ }
    this.tick();
    if (this.state.endAt) this.startTicker();
  },
  save() {
    try { localStorage.setItem('libreta-pomodoro', JSON.stringify({ settings: this.settings, state: this.state, visible: this.visible })); } catch (e) { /* sin guardar */ }
  },
  duration(phase) {
    const s = this.settings;
    return 60 * (phase === 'focus' ? s.focusMinutes : phase === 'shortBreak' ? s.shortBreakMinutes : s.longBreakMinutes);
  },
  get running() { return this.state.endAt != null; },
  get paused() { return this.state.paused != null; },
  get fresh() { return !this.running && !this.paused && this.state.phase === 'focus' && this.state.completed === 0; },
  remaining(now = Date.now()) {
    if (this.state.endAt) return Math.max(0, (this.state.endAt - now) / 1000);
    return this.state.paused ?? this.duration(this.state.phase);
  },
  progress(now = Date.now()) { const total = this.duration(this.state.phase); return total > 0 ? 1 - this.remaining(now) / total : 0; },
  remainingText() { const sec = Math.ceil(this.remaining()); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; },
  next() {
    const st = this.state;
    if (st.phase === 'focus') {
      const done = st.completed + 1;
      return { phase: done >= Math.max(1, this.settings.sessionsBeforeLongBreak) ? 'longBreak' : 'shortBreak', completed: done };
    }
    return { phase: 'focus', completed: st.phase === 'longBreak' ? 0 : st.completed };
  },
  moveToNext(startAt) {
    const n = this.next();
    this.state = { phase: n.phase, completed: n.completed, endAt: startAt != null ? startAt + this.duration(n.phase) * 1000 : null, paused: null };
  },
  startOrPause() {
    if (this.running) {
      this.state.paused = this.remaining();
      this.state.endAt = null;
    } else {
      this.state.endAt = Date.now() + (this.state.paused ?? this.duration(this.state.phase)) * 1000;
      this.state.paused = null;
      Alarm.unlock();
      if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
      this.startTicker();
    }
    this.announcement = null;
    this.changed();
  },
  skip() { this.moveToNext(this.running ? Date.now() : null); this.announcement = null; this.changed(); },
  reset() { this.state = { phase: 'focus', completed: 0, endAt: null, paused: null }; this.announcement = null; this.changed(); },
  startTicker() {
    if (this.ticker) return;
    this.ticker = setInterval(() => { this.tick(); if (!this.running) { clearInterval(this.ticker); this.ticker = null; } this.render(); }, 500);
  },
  /** Avanza el reloj: si una o varias fases han terminado, suena la alarma y se avisa. */
  tick() {
    const now = Date.now();
    let last = null, guard = 0;
    while (this.state.endAt && this.state.endAt <= now && guard++ < 50) {
      last = this.state.phase;
      const end = this.state.endAt;
      this.moveToNext(this.settings.autoStartNext ? end : null);
    }
    if (!last) return;
    if (this.settings.alarm) Alarm.play();
    const next = this.state.phase, minutes = Math.round(this.duration(next) / 60);
    this.announcement = { next, minutes, waiting: !this.running, at: now };
    const title = next === 'focus' ? 'Vuelta al estudio' : '¡Hora del descanso!';
    if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification(title, { body: `${POMO_PHASES[last].title} terminado. Ahora: ${POMO_PHASES[next].title.toLowerCase()} de ${minutes} min.`, icon: 'icon-192.png' }); } catch (e) { /* sin aviso */ }
    }
    this.changed();
  },
  changed() { this.save(); this.render(); },

  // ---------- Interfaz ----------
  /** El reloj de la barra: un icono parado; el tiempo y la fase en marcha. Siempre del mismo ancho. */
  buttonHTML() {
    if (!this.visible) return '';
    if (this.fresh) return `<button class="icon-btn pomo-btn" id="pomo-btn" title="Temporizador de estudio" aria-label="Temporizador de estudio">${icon('timer')}</button>`;
    const p = POMO_PHASES[this.state.phase];
    return `<button class="pomo-btn running" id="pomo-btn" style="--pc:${p.color}" title="${p.title}" aria-label="${p.title}: quedan ${this.remainingText()}">
      ${icon(this.running ? p.icon : 'pause')}<span>${this.remainingText()}</span></button>`;
  },
  render() {
    const slot = document.getElementById('pomo-slot');
    if (slot) {
      const html = this.buttonHTML();
      if (slot.dataset.html !== html) { slot.dataset.html = html; slot.innerHTML = html; }
    }
    const panel = document.getElementById('pomo-panel');
    if (panel) this.renderPanel(panel);
    this.renderBanner();
  },
  openPanel(anchor) {
    const old = document.getElementById('pomo-panel');
    if (old) { old.remove(); return; }
    closePopover();
    const panel = document.createElement('div');
    panel.id = 'pomo-panel';
    panel.className = 'pomo-panel';
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-label', 'Temporizador de estudio');
    document.body.appendChild(panel);
    const r = anchor.getBoundingClientRect();
    panel.style.top = `${r.bottom + 8}px`;
    panel.style.left = `${Math.min(window.innerWidth - 350, Math.max(10, r.left + r.width / 2 - 170))}px`;
    this.renderPanel(panel);
    setTimeout(() => document.addEventListener('pointerdown', function close(e) {
      if (!panel.contains(e.target) && !e.target.closest('#pomo-btn')) { panel.remove(); document.removeEventListener('pointerdown', close); }
    }), 0);
  },
  renderPanel(panel) {
    const st = this.state, p = POMO_PHASES[st.phase], s = this.settings;
    const ring = 2 * Math.PI * 64, progress = Math.min(1, Math.max(0, this.progress()));
    const status = this.paused ? 'En pausa' : this.running ? 'quedan' : `${Math.round(this.duration(st.phase) / 60)} min`;
    const stepper = (key, label, min, max, step) => `<div class="pomo-row"><span>${label}: <b>${s[key]}${key === 'sessionsBeforeLongBreak' ? '' : ' min'}</b></span>
      <span class="stepper"><button data-step="${key}" data-d="${-step}" data-min="${min}" data-max="${max}" aria-label="Menos">${icon('minus')}</button><button data-step="${key}" data-d="${step}" data-min="${min}" data-max="${max}" aria-label="Más">${icon('plus')}</button></span></div>`;
    panel.innerHTML = `
      <div class="pomo-title" style="color:${p.color}">${this.fresh ? `${p.title} · listo para empezar` : p.title}</div>
      <div class="pomo-ring">
        <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="64" stroke="${p.color}" stroke-opacity=".18" stroke-width="10" fill="none"/>
          <circle cx="75" cy="75" r="64" stroke="${p.color}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${ring}" stroke-dashoffset="${ring * (1 - progress)}" transform="rotate(-90 75 75)"/></svg>
        <div><b>${this.remainingText()}</b><small>${status}</small></div>
      </div>
      <div class="pomo-dots">${Array.from({ length: Math.max(1, s.sessionsBeforeLongBreak) }, (_, i) => `<span class="${i < st.completed ? 'on' : ''}"></span>`).join('')}</div>
      <div class="pomo-actions">
        <button class="round" data-pomo="reset" title="Volver a empezar" aria-label="Volver a empezar">${icon('rotate')}</button>
        <button class="go" data-pomo="toggle" style="background:${p.color}">${icon(this.running ? 'pause' : 'play')} ${this.running ? 'Pausar' : this.paused ? 'Seguir' : 'Empezar'}</button>
        <button class="round" data-pomo="skip" title="Saltar esta fase" aria-label="Saltar esta fase">${icon('chevronRight')}</button>
      </div>
      ${this.fresh ? '' : `<button class="pomo-remove" data-pomo="remove">${icon('close')} Quitar temporizador</button>`}
      <hr>
      ${stepper('focusMinutes', 'Estudio', 5, 120, 5)}${stepper('shortBreakMinutes', 'Descanso', 1, 30, 1)}${stepper('longBreakMinutes', 'Descanso largo', 5, 60, 5)}
      ${stepper('sessionsBeforeLongBreak', 'Descanso largo cada (sesiones)', 2, 8, 1)}
      <label class="pomo-row"><span>Empezar la siguiente fase sola</span><input type="checkbox" data-opt="autoStartNext" ${s.autoStartNext ? 'checked' : ''}></label>
      <div class="pomo-row"><label><input type="checkbox" data-opt="alarm" ${s.alarm ? 'checked' : ''}> Alarma</label><button class="btn" data-pomo="test">Probar</button></div>`;
    panel.onclick = (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      const act = b.dataset.pomo;
      if (act === 'toggle') this.startOrPause();
      if (act === 'skip') this.skip();
      if (act === 'reset') this.reset();
      if (act === 'remove') { this.reset(); panel.remove(); }
      if (act === 'test') { Alarm.unlock(); Alarm.play(); }
      if (b.dataset.step) {
        const k = b.dataset.step;
        s[k] = Math.min(Number(b.dataset.max), Math.max(Number(b.dataset.min), s[k] + Number(b.dataset.d)));
        this.changed();
      }
    };
    panel.onchange = (e) => { const k = e.target.dataset.opt; if (k) { s[k] = e.target.checked; this.changed(); } };
  },
  /** «¡Hora del descanso!» arriba en el editor. */
  renderBanner() {
    const old = document.getElementById('pomo-banner');
    const a = this.announcement;
    if (!a || S.view !== 'editor') { old?.remove(); return; }
    if (old && old.dataset.at === String(a.at)) return;
    old?.remove();
    const p = POMO_PHASES[a.next];
    const banner = document.createElement('div');
    banner.id = 'pomo-banner';
    banner.className = 'pomo-banner';
    banner.dataset.at = a.at;
    banner.style.setProperty('--pc', p.color);
    banner.setAttribute('role', 'status');
    banner.innerHTML = `<span class="ico">${icon(p.icon)}</span><div><b>${a.next === 'focus' ? 'Vuelta al estudio' : '¡Hora del descanso!'}</b>
      <small>${p.title} de ${a.minutes} min${a.waiting ? ', cuando quieras.' : ' en marcha.'}</small></div>
      ${a.waiting ? '<button class="btn primary" data-b="start">Empezar</button>' : ''}<button class="icon-btn plain" data-b="close" aria-label="Cerrar aviso">${icon('close')}</button>`;
    banner.onclick = (e) => {
      const b = e.target.closest('[data-b]');
      if (!b) return;
      if (b.dataset.b === 'start') this.startOrPause();
      this.announcement = null;
      banner.remove();
    };
    document.body.appendChild(banner);
    if (!a.waiting) setTimeout(() => { if (this.announcement?.at === a.at) { this.announcement = null; banner.remove(); } }, 10000);
  },
  contextMenu(e) {
    e.preventDefault();
    popover({ x: e.clientX, y: e.clientY }, this.fresh ? `<button data-act="toggle">${icon('play')} Empezar a estudiar</button>`
      : `<button data-act="toggle">${icon(this.running ? 'pause' : 'play')} ${this.running ? 'Pausar' : 'Seguir'}</button>
      <button data-act="skip">${icon('chevronRight')} Saltar esta fase</button><hr><button data-act="remove">${icon('close')} Quitar temporizador</button>`, (act) => {
      if (act === 'toggle') this.startOrPause();
      if (act === 'skip') this.skip();
      if (act === 'remove') this.reset();
    });
  },
};

/** La alarma: tres notas suaves que suben (do-mi-sol agudos), dos veces, como en la app nativa. */
const Alarm = {
  ctx: null,
  /** El navegador solo deja sonar audio después de un clic: se prepara al pulsar Empezar. */
  unlock() {
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { /* sin audio */ }
  },
  play() {
    const ctx = this.ctx;
    if (!ctx) return;
    const t0 = ctx.currentTime + 0.05;
    [[1046.5, 0], [1318.5, 0.18], [1568, 0.36], [1046.5, 0.9], [1318.5, 1.08], [1568, 1.26]].forEach(([f, at]) => {
      for (const [mult, level] of [[1, 0.28], [2, 0.08]]) {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.frequency.value = f * mult;
        gain.gain.setValueAtTime(0, t0 + at);
        gain.gain.linearRampToValueAtTime(level, t0 + at + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 0.55);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t0 + at);
        osc.stop(t0 + at + 0.6);
      }
    });
  },
};

// =============================================================================
// Recortar imágenes y elegir su tamaño (como en la app nativa). El recorte es un rectángulo
// normalizado (0…1) sobre la imagen, así no depende del tamaño con que se muestre.
// =============================================================================
const Crop = {
  full: { x: 0, y: 0, w: 1, h: 1 },
  minimum: 0.05,
  aspects: [['free', 'Libre'], ['original', 'Original'], ['1', '1:1'], ['1.3333', '4:3'], ['0.75', '3:4'], ['1.7778', '16:9']],

  ratio(aspect, size) {
    if (aspect === 'free') return null;
    if (aspect === 'original') return size.w / Math.max(size.h, 1);
    return Number(aspect);
  },
  /** Proporción en coordenadas normalizadas para una proporción en píxeles. */
  normalized(ratio, size) { return ratio * size.h / Math.max(size.w, 1); },
  largest(ratio, size) {
    if (!ratio) return { ...this.full };
    const r = this.normalized(ratio, size);
    const w = r >= 1 ? 1 : r, h = r >= 1 ? 1 / r : 1;
    return { x: (1 - w) / 2, y: (1 - h) / 2, w, h };
  },
  move(rect, dx, dy) {
    return { ...rect, x: Math.min(Math.max(0, rect.x + dx), 1 - rect.w), y: Math.min(Math.max(0, rect.y + dy), 1 - rect.h) };
  },
  /** Arrastrar un tirador ('tl','t','tr','r','br','b','bl','l'). Con proporción fija, el otro lado se ajusta. */
  resize(rect, handle, dx, dy, ratio, size) {
    const L = handle.includes('l'), R = handle.includes('r'), T = handle.includes('t'), B = handle.includes('b');
    let minX = rect.x, maxX = rect.x + rect.w, minY = rect.y, maxY = rect.y + rect.h;
    if (L) minX = Math.min(Math.max(0, minX + dx), maxX - this.minimum);
    if (R) maxX = Math.max(Math.min(1, maxX + dx), minX + this.minimum);
    if (T) minY = Math.min(Math.max(0, minY + dy), maxY - this.minimum);
    if (B) maxY = Math.max(Math.min(1, maxY + dy), minY + this.minimum);
    let out = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    if (!ratio) return out;
    const r = this.normalized(ratio, size);
    const corner = (L || R) && (T || B);
    const widthLeads = corner ? Math.abs(dx) >= Math.abs(dy) * r : (L || R);
    let w = widthLeads ? out.w : out.h * r, h = w / r;
    const ax = L ? rect.x + rect.w : R ? rect.x : rect.x + rect.w / 2;
    const ay = T ? rect.y + rect.h : B ? rect.y : rect.y + rect.h / 2;
    const maxW = L ? ax : R ? 1 - ax : 2 * Math.min(ax, 1 - ax);
    const maxH = T ? ay : B ? 1 - ay : 2 * Math.min(ay, 1 - ay);
    const fit = Math.min(1, maxW / Math.max(w, 1e-4), maxH / Math.max(h, 1e-4));
    w *= fit; h *= fit;
    out = { x: L ? ax - w : R ? ax : ax - w / 2, y: T ? ay - h : B ? ay : ay - h / 2, w, h };
    return out;
  },
  /** Tras girar la imagen 90° a la izquierda, el recorte sigue sobre la misma zona. */
  rotatedLeft(rect) { return { x: rect.y, y: 1 - rect.x - rect.w, w: rect.h, h: rect.w }; },
};

/** Gira una imagen (dataURL) 90° a la izquierda. */
async function rotateImageLeft(src) {
  const img = await loadImage(src);
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalHeight; canvas.height = img.naturalWidth;
  const ctx = canvas.getContext('2d');
  ctx.translate(0, canvas.height);
  ctx.rotate(-Math.PI / 2);
  ctx.drawImage(img, 0, 0);
  return canvas.toDataURL(src.startsWith('data:image/png') ? 'image/png' : 'image/jpeg', 0.9);
}
/** Recorta una imagen (dataURL) por un rectángulo normalizado. */
async function cropImageData(src, rect) {
  const img = await loadImage(src);
  const W = img.naturalWidth, H = img.naturalHeight;
  const sx = Math.round(rect.x * W), sy = Math.round(rect.y * H), sw = Math.max(1, Math.round(rect.w * W)), sh = Math.max(1, Math.round(rect.h * H));
  const canvas = document.createElement('canvas');
  canvas.width = sw; canvas.height = sh;
  canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  return { src: canvas.toDataURL(src.startsWith('data:image/png') ? 'image/png' : 'image/jpeg', 0.9), w: sw, h: sh };
}

/**
 * Ventana de recortar (antes de colocar una imagen, o para recortar una ya puesta).
 * Devuelve { src, w, h, widthFraction } o null si se cancela.
 */
function cropImageDialog(src, { replacing = false, inline = false, widthFraction = 0.5, remaining = 0 } = {}) {
  return new Promise((resolve) => {
    let working = src, size = { w: 1, h: 1 }, rect = { ...Crop.full }, aspect = 'free', width = widthFraction, done = false;
    const title = (replacing ? 'Recortar imagen' : 'Insertar imagen') + (remaining ? ` (quedan ${remaining} más)` : '');
    const scrim = dialog(`<h2>${title}</h2>
      <div class="crop-stage"><div class="crop-box"><img alt="Imagen para recortar"><div class="crop-shade"></div><div class="crop-rect"><i></i><i></i><i></i><i></i></div>
        ${['tl', 't', 'tr', 'r', 'br', 'b', 'bl', 'l'].map((h) => `<span class="crop-h ${h}" data-h="${h}"></span>`).join('')}</div></div>
      <div class="crop-controls">
        <div class="seg">${Crop.aspects.map(([k, n]) => `<button data-act="aspect" data-v="${k}" aria-pressed="${k === 'free'}">${n}</button>`).join('')}</div>
        <button class="btn tinted" data-act="rotate">${icon('rotate')} Girar</button>
        <button class="btn" data-act="reset">Restablecer</button>
      </div>
      ${inline ? '' : `<label class="crop-width">${icon('photo')}<input type="range" min="0.1" max="1" step="0.01" value="${width}" aria-label="Ancho en la página">${icon('photo')}<span></span></label>`}
      <p class="crop-info"></p>
      <div class="actions"><button class="btn" data-act="cancel">${replacing ? 'Cancelar' : 'No insertar'}</button><button class="btn primary" data-act="ok">${replacing ? 'Recortar' : 'Insertar'}</button></div>`,
    async (act, b, close) => {
      if (act === 'cancel') { done = true; close(); resolve(null); }
      if (act === 'ok') {
        done = true;
        const out = rect.x === 0 && rect.y === 0 && rect.w === 1 && rect.h === 1 && working === src
          ? { src: working, w: size.w, h: size.h } : await cropImageData(working, rect);
        close();
        resolve({ ...out, widthFraction: inline ? null : width });
      }
      if (act === 'aspect') {
        aspect = b.dataset.v;
        b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
        rect = Crop.largest(Crop.ratio(aspect, size), size);
        draw();
      }
      if (act === 'rotate') {
        working = await rotateImageLeft(working);
        await setImage();
        rect = aspect === 'free' ? Crop.rotatedLeft(rect) : Crop.largest(Crop.ratio(aspect, size), size);
        draw();
      }
      if (act === 'reset') {
        aspect = 'free';
        scrim.querySelectorAll('[data-act="aspect"]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.v === 'free'));
        rect = { ...Crop.full };
        draw();
      }
    }, true);
    scrim.querySelector('.dialog').classList.add('crop-dialog');
    const box = scrim.querySelector('.crop-box'), img = scrim.querySelector('img'), frame = scrim.querySelector('.crop-rect'), shade = scrim.querySelector('.crop-shade');
    const info = scrim.querySelector('.crop-info'), slider = scrim.querySelector('.crop-width input'), label = scrim.querySelector('.crop-width span');
    async function setImage() {
      const image = await loadImage(working);
      size = { w: image.naturalWidth, h: image.naturalHeight };
      img.src = working;
      const stage = scrim.querySelector('.crop-stage');
      const scale = Math.min((stage.clientWidth - 36) / size.w, (stage.clientHeight - 36) / size.h, 1.5);
      box.style.width = `${size.w * scale}px`; box.style.height = `${size.h * scale}px`;
    }
    function draw() {
      const W = box.clientWidth, H = box.clientHeight;
      const r = { x: rect.x * W, y: rect.y * H, w: rect.w * W, h: rect.h * H };
      Object.assign(frame.style, { left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px` });
      shade.style.clipPath = `polygon(evenodd, 0 0, 100% 0, 100% 100%, 0 100%, 0 0, ${r.x}px ${r.y}px, ${r.x}px ${r.y + r.h}px, ${r.x + r.w}px ${r.y + r.h}px, ${r.x + r.w}px ${r.y}px, ${r.x}px ${r.y}px)`;
      for (const h of scrim.querySelectorAll('.crop-h')) {
        const k = h.dataset.h;
        h.style.left = `${k.includes('l') ? r.x : k.includes('r') ? r.x + r.w : r.x + r.w / 2}px`;
        h.style.top = `${k.includes('t') ? r.y : k.includes('b') ? r.y + r.h : r.y + r.h / 2}px`;
      }
      info.textContent = `Recorte: ${Math.round(rect.w * size.w)} × ${Math.round(rect.h * size.h)} píxeles. Arrastra las esquinas o los bordes; arrastra dentro para mover el recorte.`;
      if (label) label.textContent = `Ancho en la página: ${Math.round(width * 100)} %`;
    }
    const drag = (onMove) => (e) => {
      e.preventDefault();
      const start = { x: e.clientX, y: e.clientY, rect: { ...rect } };
      const move = (ev) => { onMove(start, (ev.clientX - start.x) / box.clientWidth, (ev.clientY - start.y) / box.clientHeight); draw(); };
      const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
      addEventListener('pointermove', move);
      addEventListener('pointerup', up);
    };
    frame.addEventListener('pointerdown', drag((s, dx, dy) => { rect = Crop.move(s.rect, dx, dy); }));
    for (const h of scrim.querySelectorAll('.crop-h')) {
      h.addEventListener('pointerdown', drag((s, dx, dy) => { rect = Crop.resize(s.rect, h.dataset.h, dx, dy, Crop.ratio(aspect, size), size); }));
    }
    slider?.addEventListener('input', () => { width = Number(slider.value); draw(); });
    setImage().then(draw);
    // Cerrar con Esc o tocando fuera también cuenta como cancelar.
    new MutationObserver((_, observer) => { if (!document.body.contains(scrim)) { observer.disconnect(); if (!done) resolve(null); } }).observe(document.body, { childList: true });
  });
}

// =============================================================================
// Reordenar arrastrando con el ratón, en vivo (como la app nativa): lo que arrastras sigue
// al puntero y el resto se aparta para enseñar dónde quedará. Sirve para páginas y pestañas.
// =============================================================================
const Reorder = {
  /** Posición en la que quedaría lo arrastrado: cuántas casillas (sin la suya) quedan antes del puntero. */
  targetIndex(point, slots, from, axis = 'grid') {
    let n = 0;
    slots.forEach((s, i) => {
      if (i === from) return;
      const before = axis === 'x' ? point.x > s.left + s.width / 2 : point.y > s.bottom || (point.y >= s.top && point.x > s.left + s.width / 2);
      if (before) n++;
    });
    return n;
  },
  /** El orden resultante de mover el elemento `from` a `to`. */
  preview(list, from, to) {
    const out = list.slice();
    const [moved] = out.splice(from, 1);
    out.splice(to, 0, moved);
    return out;
  },
};

/**
 * Hace reordenables los hijos `selector` de `container`.
 * onDrop(from, to, el, pointerEvent) al soltar en otro sitio; onOutside(el, pointerEvent) al soltar fuera
 * (devuelve true si lo ha gestionado); onTarget(el, elementoDebajo) igual, antes que nada.
 * `group(el)`: solo se reordena entre los que tienen el mismo grupo. `ignore` = selector de botones dentro que no inician arrastre.
 */
function liveReorder(container, selector, { onDrop, onOutside, onTarget, group, ignore = 'button', scroller = null, axis = 'grid' } = {}) {
  container.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || (ignore && e.target.closest(ignore))) return;
    const el = e.target.closest(selector);
    if (!el || !container.contains(el)) return;
    const items = [...container.querySelectorAll(selector)].filter((x) => x.parentElement === el.parentElement && (!group || group(x) === group(el)));
    const from = items.indexOf(el);
    const scrollEl = scroller || container;
    const start = { x: e.clientX, y: e.clientY, scroll: scrollEl.scrollTop };
    let dragging = false, to = from, last = e, autoscroll = 0;
    let slots = [];
    const point = (ev) => ({ x: ev.clientX, y: ev.clientY + (scrollEl.scrollTop - start.scroll) });
    const layout = () => {
      const p = point(last);
      to = Reorder.targetIndex(p, slots, from, axis);
      el.style.transform = `translate(${last.clientX - start.x}px, ${axis === 'x' ? 0 : p.y - start.y}px)`;
      const order = Reorder.preview(items.map((_, i) => i), from, to);
      order.forEach((itemIndex, position) => {
        if (itemIndex === from) return;
        const a = slots[itemIndex], b = slots[position];
        items[itemIndex].style.transform = `translate(${b.left - a.left}px, ${b.top - a.top}px)`;
      });
    };
    const begin = () => {
      dragging = true;
      // Casillas en coordenadas de la ventana al empezar (la diferencia de scroll se suma al puntero).
      slots = items.map((x) => { const r = x.getBoundingClientRect(); return { left: r.left, top: r.top, width: r.width, height: r.height, bottom: r.bottom }; });
      items.forEach((x) => { if (x !== el) x.classList.add('reorder-shift'); });
      el.classList.add('reordering');
      document.body.classList.add('is-reordering');
    };
    const tick = () => {
      if (!dragging) return;
      const r = scrollEl.getBoundingClientRect(), edge = 40;
      const v = last.clientY < r.top + edge ? -(r.top + edge - last.clientY) : last.clientY > r.bottom - edge ? last.clientY - (r.bottom - edge) : 0;
      if (v && scrollEl.scrollHeight > scrollEl.clientHeight) { scrollEl.scrollTop += v * 0.4; layout(); }
      autoscroll = requestAnimationFrame(tick);
    };
    const move = (ev) => {
      last = ev;
      if (!dragging) {
        if (Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 5) return;
        begin();
        autoscroll = requestAnimationFrame(tick);
      }
      ev.preventDefault();
      layout();
    };
    const finish = (ev, cancelled) => {
      removeEventListener('pointermove', move);
      removeEventListener('pointerup', up);
      removeEventListener('pointercancel', cancel);
      removeEventListener('keydown', esc, true);
      cancelAnimationFrame(autoscroll);
      if (!dragging) return;
      // El clic que sigue a soltar no debe abrir lo arrastrado.
      const swallow = (c) => { c.stopPropagation(); c.preventDefault(); };
      addEventListener('click', swallow, { capture: true, once: true });
      setTimeout(() => removeEventListener('click', swallow, true), 0);
      el.style.pointerEvents = 'none';
      const under = ev && document.elementFromPoint(ev.clientX, ev.clientY);
      el.style.pointerEvents = '';
      const r = container.getBoundingClientRect();
      const inside = ev && ev.clientX >= r.left - 20 && ev.clientX <= r.right + 20 && ev.clientY >= r.top - 20 && ev.clientY <= r.bottom + 20;
      items.forEach((x) => { x.classList.remove('reorder-shift', 'reordering'); x.style.transform = ''; });
      document.body.classList.remove('is-reordering');
      if (cancelled) return;
      if (onTarget && onTarget(el, under, ev)) return;
      if (!inside && onOutside && onOutside(el, ev, under)) return;
      if (to !== from) onDrop(from, to, el, ev);
    };
    const up = (ev) => finish(ev, false);
    const cancel = () => finish(null, true);
    const esc = (ev) => { if (ev.key === 'Escape' && dragging) { ev.stopPropagation(); finish(null, true); } };
    addEventListener('pointermove', move);
    addEventListener('pointerup', up);
    addEventListener('pointercancel', cancel);
    addEventListener('keydown', esc, true);
  });
}

// ---------- Operaciones con páginas (las usan la barra lateral y la ventana «Páginas») ----------
function movePage(nb, from, to) {
  to = Math.max(0, Math.min(nb.pages.length - 1, to));
  if (from === to) return;
  const current = nb.pages[currentPageIndex]?.id;
  const [moved] = nb.pages.splice(from, 1);
  nb.pages.splice(to, 0, moved);
  touch(); buildPages(); renderSidebar();
  if (current) currentPageIndex = Math.max(0, nb.pages.findIndex((p) => p.id === current));
  updatePageIndicator();
  renderPagesWindow();
}
function duplicatePage(nb, i) {
  const copy = clone(nb.pages[i]);
  copy.id = uid(); copy.items.forEach((it) => { it.id = uid(); }); copy.strokes.forEach((s) => { s.id = uid(); }); copy.bookmarked = false;
  nb.pages.splice(i + 1, 0, copy);
  touch(); buildPages(); renderSidebar(); renderPagesWindow();
}
function deletePage(nb, i) {
  const page = nb.pages[i];
  confirmDialog(`¿Eliminar la página ${i + 1}?`, 'No se puede deshacer.', 'Eliminar página', () => {
    nb.pages.splice(i, 1); nb.outline = nb.outline.filter((o) => o.pageId !== page.id); S.undo[nb.id] = [];
    touch(); buildPages(); renderSidebar(); renderPagesWindow();
  });
}
function pageContextMenu(e, nb, i, { full = false } = {}) {
  e.preventDefault();
  const page = nb.pages[i], last = nb.pages.length - 1;
  popover({ x: e.clientX, y: e.clientY }, `<button data-act="bm">${page.bookmarked ? 'Quitar de marcadores' : 'Guardar en marcadores'}</button>
    <button data-act="outline">Añadir al esquema…</button><hr><button data-act="dup">${icon('copy')}Duplicar</button>
    <button data-act="first" ${i === 0 ? 'disabled' : ''}>${icon('arrowUp')}Mover al principio</button>
    ${full ? `<button data-act="prev" ${i === 0 ? 'disabled' : ''}>Mover antes</button><button data-act="next" ${i === last ? 'disabled' : ''}>Mover después</button>` : ''}
    <button data-act="last" ${i === last ? 'disabled' : ''}>${icon('arrowDown')}Mover al final</button><hr>
    <button data-act="del" class="danger" ${nb.pages.length < 2 ? 'disabled' : ''}>${icon('trash')}Eliminar…</button>`, (act) => {
    if (act === 'bm') { toggleBookmark(page); renderPagesWindow(); }
    if (act === 'outline') promptDialog('Añadir al esquema', `Página ${i + 1}`, (title) => addOutline(nb, page, title), 'Título del apartado');
    if (act === 'dup') duplicatePage(nb, i);
    if (act === 'first') movePage(nb, i, 0);
    if (act === 'prev') movePage(nb, i, i - 1);
    if (act === 'next') movePage(nb, i, i + 1);
    if (act === 'last') movePage(nb, i, last);

}

// Editor: pestañas, barra lateral, páginas, herramientas y elementos

const views = new Map();   // pageId -> vistas DOM de la página
let currentPageIndex = 0;
let resumePageId = null;   // página con la cinta «aquí lo dejaste»

// Como en la app nativa: P bolígrafo, H subrayador, E goma, L lazo, T texto, N post-it, C comentario, K enlace, V seleccionar.
const TOOLS = [
  ['pen', 'Bolígrafo (P)', 'p'], ['highlighter', 'Subrayador (H)', 'h'], ['eraser', 'Goma (E)', 'e'], ['lasso', 'Lazo (L)', 'l'],
  ['text', 'Texto (T)', 't'], ['sticky', 'Post-it (N)', 'n'], ['comment', 'Comentario (C)', 'c'], ['link', 'Enlace (K)', 'k'], ['select', 'Seleccionar (V)', 'v'],
];
const INK_TOOLS = ['pen', 'highlighter', 'eraser', 'lasso'];
const RICH_TYPES = ['text', 'sticky', 'comment'];

// ---------- Abrir, cerrar y pestañas ----------
function openNotebook(id, opts = {}) {
  const nb = nbById(id);
  if (!nb) return;
  stopDynamic();
  if (S.active && S.active !== id) leaveNotebook(activeNb());
  if (!S.tabs.includes(id)) {
    // Junto a las pestañas de su mismo espacio.
    const last = S.tabs.map(nbById).map((n, i) => (n && n.space === nb.space ? i : -1)).filter((i) => i >= 0).pop();
    if (last === undefined) S.tabs.push(id); else S.tabs.splice(last + 1, 0, id);
  }
  S.active = id;
  S.collapsed = S.collapsed.filter((s) => s !== (nb.space || ''));
  S.selected = S.editing = S.lasso = null;
  if (nb.example) { delete nb.example; Store.put(nb); }
  saveTabs();
  S.view = 'editor';
  const target = opts.pageId || nb.lastPageId;
  resumePageId = !opts.pageId && nb.lastPageId && nb.pages.findIndex((p) => p.id === nb.lastPageId) > 0 ? nb.lastPageId : null;
  renderEditor();
  requestAnimationFrame(() => {
    fitZoom();
    scrollToPage(target, false);
    if (resumePageId) showResume(nb.pages.findIndex((p) => p.id === resumePageId) + 1);
    if (opts.pageId && opts.itemId) flashItem(opts.pageId, opts.itemId, opts.query);
    else if (opts.pageId && opts.flashPage) flashRect(opts.pageId, null);
  });
}
/** Al salir de una libreta: recordar la página y actualizar la portada si es una vista previa. */
function leaveNotebook(nb) {
  if (!nb) return;
  stopEditing();
  updateCurrentPage();
  nb.lastPageId = nb.pages[currentPageIndex]?.id || nb.lastPageId;
  if (nb.cover?.type === 'page') {
    const page = nb.pages.find((p) => p.id === nb.cover.pageId) || nb.pages[0];
    pageThumb(page, 300).then((img) => { nb.cover.image = img; Store.put(nb); });
  }
  touch(nb);
}
function backToLibrary() {
  leaveNotebook(activeNb());
  flushAll();
  views.clear();
  renderLibrary();
}
function closeTab(id) {
  const i = S.tabs.indexOf(id);
  if (i < 0) return;
  if (id === S.active) leaveNotebook(activeNb());
  S.tabs.splice(i, 1);
  if (id === S.active) {
    S.active = S.tabs[Math.min(i, S.tabs.length - 1)] || null;
    saveTabs();
    if (!S.active) return backToLibrary();
    return openNotebook(S.active);
  }
  saveTabs();
  renderTabs();
}
function tabGroups() {
  const groups = [];
  for (const id of S.tabs) {
    const nb = nbById(id);
    if (!nb) continue;
    const key = nb.space || '';
    let g = groups.find((x) => x.key === key);
    if (!g) groups.push(g = { key, space: nb.space, ids: [] });
    g.ids.push(id);
  }
  return groups;
}
function renderTabs() {
  const el = $('#tabs');
  if (!el) return;
  const groups = tabGroups();
  const chips = groups.some((g) => g.space);
  el.innerHTML = groups.map((g) => {
    const color = spaceColor(g.space);
    const collapsed = S.collapsed.includes(g.key);
    const chip = chips ? `<button class="chip" data-chip="${esc(g.key)}" style="--c:${color}" title="${collapsed ? 'Mostrar' : 'Plegar'} ${esc(g.space || 'Sin espacio')}">
        ${icon('folder')}${esc(g.space || 'Sin espacio')}${collapsed ? `<span class="count">${g.ids.length}</span>` : ''}${icon(collapsed ? 'chevronRight' : 'chevronDown')}</button>` : '';
    return chip + (collapsed ? '' : g.ids.map((id) => {
      const nb = nbById(id), active = id === S.active;
      return `<div class="tab ${active ? 'active' : ''}" data-tab="${id}" data-group="${esc(g.key)}" style="--c:${nb.color};${chips ? `--g:${color}` : ''}" role="tab" aria-selected="${active}" title="${esc(nb.title)}">
        <span class="hover-bg"></span>${active ? '<span class="foot l"></span><span class="foot r"></span>' : ''}
        <span class="book">${icon('book')}</span><span class="t">${esc(nb.title)}</span>
        <button class="x" data-close="${id}" aria-label="Cerrar ${esc(nb.title)}">${icon('close')}</button>
        ${chips ? '<span class="gline"></span>' : ''}</div>`;
    }).join(''));
  }).join('') + `<span class="clock" data-clock></span><button class="icon-btn plus" id="tab-plus" aria-label="Abrir otra libreta" title="Abrir otra libreta">${icon('plus')}</button>`;
  updateClocks();
  el.onclick = (e) => {
    const close = e.target.closest('[data-close]');
    if (close) return closeTab(close.dataset.close);
    const chip = e.target.closest('[data-chip]');
    if (chip) { const k = chip.dataset.chip; S.collapsed = S.collapsed.includes(k) ? S.collapsed.filter((x) => x !== k) : [...S.collapsed, k]; return renderTabs(); }
    const tab = e.target.closest('[data-tab]');
    if (tab && tab.dataset.tab !== S.active) return openNotebook(tab.dataset.tab);
    if (e.target.closest('#tab-plus')) return openOtherMenu(e.target.closest('#tab-plus'));
  };
  // Arrastrar pestañas (en vivo, dentro de su espacio); soltar en la etiqueta de otro espacio la lleva allí, al final.
  if (!el.dataset.reorder) {
    el.dataset.reorder = '1';
    liveReorder(el, '.tab', {
      axis: 'x', ignore: '.x', group: (t) => t.dataset.group,
      onDrop: (from, to, t) => reorderTab(t.dataset.tab, to),
      onTarget: (t, under) => {
        const chip = under?.closest?.('[data-chip]');
        if (!chip || chip.dataset.chip === t.dataset.group) return false;
        moveTabToSpace(t.dataset.tab, chip.dataset.chip || null);
        return true;
      },
    });
  }
}
/** Mueve una pestaña a la posición `index` dentro de las de su espacio. */
function reorderTab(id, index) {
  const nb = nbById(id), key = nb.space || '';
  const positions = S.tabs.map((t, i) => ((nbById(t)?.space || '') === key ? i : -1)).filter((i) => i >= 0);
  const members = positions.map((i) => S.tabs[i]);
  const order = Reorder.preview(members, members.indexOf(id), index);
  positions.forEach((p, k) => { S.tabs[p] = order[k]; });
  saveTabs(); renderTabs();
}
/** Lleva una pestaña al final de otro espacio (y la libreta a ese espacio). */
function moveTabToSpace(id, space) {
  const nb = nbById(id);
  S.tabs = S.tabs.filter((x) => x !== id);
  nb.space = space;
  const last = S.tabs.map(nbById).map((n, i) => ((n?.space || null) === space ? i : -1)).filter((i) => i >= 0).pop();
  S.tabs.splice(last === undefined ? S.tabs.length : last + 1, 0, id);
  if (space) addSpace(space);
  S.collapsed = S.collapsed.filter((k) => k !== (space || ''));
  touch(nb); Store.put(nb); saveTabs(); renderTabs();
}
function openOtherMenu(anchor) {
  const closed = S.notebooks.filter((nb) => !S.tabs.includes(nb.id));
  const bySpace = [...new Set(closed.map((n) => n.space || ''))];
  popover(anchor, closed.length ? bySpace.map((sp) => `<div class="label">${esc(sp || 'Sin espacio')}</div>${closed.filter((n) => (n.space || '') === sp).map((n) => `<button data-act="${n.id}">${esc(n.title)}</button>`).join('')}`).join('')
    : '<div class="label">Todas las libretas están abiertas</div>', (id) => openNotebook(id));
}

/** Botón de herramienta: el bolígrafo y el subrayador llevan su color en el icono y en una barrita. */
function toolButton(tool, title) {
  const color = tool === 'pen' ? S.penColor : tool === 'highlighter' ? S.hlColor : null;
  // El icono va del color de la tinta salvo que no se vea sobre el fondo de la barra.
  const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  const visible = color && (dark ? luminance(color) > 0.25 : luminance(color) < 0.85);
  return `<button class="tool ${color ? 'colored' : ''}" data-tool="${tool}" aria-label="${title}" title="${title}" aria-pressed="${S.tool === tool}"
    style="${color ? `--c:${color};` : ''}${visible ? `color:${color};` : ''}">${icon(tool)}${color ? '<span class="ink-bar"></span>' : ''}</button>`;
}
/** Vuelve a pintar los botones de herramienta (al cambiar de herramienta o de color). */
function refreshToolButtons() {
  const group = $('.group[role="toolbar"]');
  if (!group) return;
  for (const [tool, title] of TOOLS) {
    const old = $(`[data-tool="${tool}"]`, group);
    if (!old) continue;
    const tpl = document.createElement('template');
    tpl.innerHTML = toolButton(tool, title).trim();
    const fresh = tpl.content.firstChild;
    fresh.addEventListener('click', () => setTool(tool));
    old.replaceWith(fresh);
  }
}
function updatePageIndicator() {
  const nb = activeNb(), count = $('#page-count');
  if (!nb || !count) return;
  count.textContent = `${currentPageIndex + 1} / ${nb.pages.length}`;
  $('#prev-page').disabled = currentPageIndex === 0;
  $('#next-page').disabled = currentPageIndex >= nb.pages.length - 1;
}

function buildPages() {
  const nb = activeNb();
  const container = $('#pages');
  container.innerHTML = '';
  views.clear();
  nb.pages.forEach((page, index) => {
    const wrap = document.createElement('div');
    wrap.className = 'page';
    wrap.dataset.id = page.id;
    wrap.innerHTML = `<div class="page-inner" style="width:${page.w}px;height:${page.h}px">
        <canvas class="paper"></canvas>${page.bg ? `<img class="bg" src="${page.bg}" alt="">` : ''}
        <div class="layer items"></div><canvas class="ink"></canvas><canvas class="live" style="pointer-events:none"></canvas><div class="layer over"></div>
      </div><div class="page-number">${index + 1} / ${nb.pages.length}</div>`;
    container.appendChild(wrap);
    const v = { wrap, inner: $('.page-inner', wrap), paper: $('.paper', wrap), ink: $('.ink', wrap), live: $('.live', wrap), items: $('.layer.items', wrap), over: $('.layer.over', wrap) };
    views.set(page.id, v);
    attachInk(page, v);
    attachItemsLayer(page, v);
  });
  const add = document.createElement('button');
  add.className = 'add-page';
  add.textContent = '+ Añadir página';
  add.addEventListener('click', () => newPageDialog());
  container.appendChild(add);
  layoutPages();
}
function layoutPages() {
  const nb = activeNb();
  if (!nb) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  for (const page of nb.pages) {
    const v = views.get(page.id);
    if (!v) continue;
    v.wrap.style.width = page.w * S.zoom + 'px';
    v.wrap.style.height = page.h * S.zoom + 'px';
    v.inner.style.transform = `scale(${S.zoom})`;
    const scale = Math.min(S.zoom * dpr, 3);
    for (const c of [v.paper, v.ink, v.live]) {
      c.width = Math.round(page.w * scale); c.height = Math.round(page.h * scale);
      c.style.width = page.w + 'px'; c.style.height = page.h + 'px'; c._scale = scale;
    }
    renderPaper(page); renderInk(page); renderItems(page);
  }
  const label = $('#zoom-fit');
  if (label) label.textContent = Math.round(S.zoom * 100) + '%';
}
function ctxFor(canvas) { const ctx = canvas.getContext('2d'); ctx.setTransform(canvas._scale, 0, 0, canvas._scale, 0, 0); return ctx; }
function renderPaper(page) { const v = views.get(page.id); if (v) drawPaper(ctxFor(v.paper), page); }
function renderInk(page) {
  const v = views.get(page.id);
  if (!v) return;
  const ctx = ctxFor(v.ink);
  ctx.clearRect(0, 0, page.w, page.h);
  const sel = S.lasso && S.lasso.pageId === page.id ? new Set(S.lasso.ids) : null;
  for (const s of page.strokes) drawStroke(ctx, s, page.paper);

/** Rangos del DOM con cada aparición de `query` (sin distinguir mayúsculas ni tildes). */
function textRanges(root, query) {
  const nodes = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let text = '';
  while (walker.nextNode()) { nodes.push({ node: walker.currentNode, start: text.length }); text += walker.currentNode.data; }
  const at = (offset) => { const n = [...nodes].reverse().find((x) => x.start <= offset); return n ? [n.node, offset - n.start] : null; };
  return findMatches(text, query, 20).map((m) => {
    const a = at(m.start), b = at(m.end - 1);
    if (!a || !b) return null;
    const range = document.createRange();
    range.setStart(a[0], a[1]); range.setEnd(b[0], b[1] + 1);
    return range;
  }).filter(Boolean);
}

/** Arrastrar mueve el elemento. Escribiendo en un texto, se arrastra desde su borde. */
function onItemPointerDown(e, page, item, el) {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  const onResize = e.target.classList.contains('resize');
  const inRich = e.target.closest('.rich') && e.target.closest('.rich').isContentEditable;
  if (inRich && !onResize) return; // clic dentro del texto: colocar el cursor
  e.preventDefault();
  e.stopPropagation();
  clearLasso();
  if (S.editing && S.editing.itemId !== item.id) stopEditing();
  const wasSelected = S.selected?.itemId === item.id;
  select({ pageId: page.id, itemId: item.id }, false);
  const before = snapshotPage(page);
  const start = { x: e.clientX, y: e.clientY, ix: item.x, iy: item.y, w: item.w, h: item.h };
  let moved = false;
  const move = (ev) => {
    const dx = (ev.clientX - start.x) / S.zoom, dy = (ev.clientY - start.y) / S.zoom;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    if (!moved) return;
    if (onResize) {
      item.w = Math.max(40, start.w + dx);
      if (item.type === 'image') item.h = item.w * (start.h / start.w);
      else if (item.h) item.h = Math.max(40, start.h + dy);
      el.style.width = item.w + 'px';
      if (item.h && item.type !== 'text') el.style.height = item.h + 'px';
    } else {
      item.x = Math.min(Math.max(-item.w + 30 || -10, start.ix + dx), page.w - 30);
      item.y = Math.min(Math.max(-10, start.iy + dy), page.h - 30);
      el.style.left = item.x + 'px'; el.style.top = item.y + 'px';
      if (item.type === 'comment') views.get(page.id).over.querySelector(`[data-panel="${item.id}"]`)?.remove();
    }
  };
  const up = () => {
    removeEventListener('pointermove', move);
    removeEventListener('pointerup', up);
    if (moved) { commit(page, before); if (item.type === 'comment' && item.expanded) views.get(page.id).over.appendChild(commentPanel(page, item)); return; }
    // Clic sin mover
    if (item.type === 'comment') return toggleComment({ page, item });
    if (item.type === 'link' && (item.target ? !['select'].includes(S.tool) || wasSelected : false)) return showLinkPreview(item.target, { item, page });
    if (item.type === 'link' && !item.target) return linkPicker((target) => editItem({ page, item }, (it) => { it.target = target; }));
    if (RICH_TYPES.includes(item.type) && (S.tool === 'text' || S.tool === 'sticky' || wasSelected)) {
      if (S.tool === 'select') setTool(item.type === 'sticky' ? 'sticky' : 'text');
      const rich = richFor(page.id, item.id);
      rich?.focus();
    }
  };
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
}

    currentPageIndex = activeNb().pages.indexOf(page);
    clearLasso();
    if (S.editing) { document.activeElement?.blur?.(); stopEditing(); S.selected = null; select(null); return; }
    if (S.selected) { select(null); if (S.tool === 'select') return; }

      addRichItem(page, { type: 'comment', x: x - 17, y: y - 17, title: `Comentario ${n}`, color: S.commentColor, expanded: true }, 16);
    }

  addRichItem(page, { type: 'text', x: Math.max(0, Math.min(x - 8, page.w - 200)), y: Math.max(0, y - base.size * 0.9), w: Math.min(380, page.w - x + 8) }, null, base);

function addRichItem(page, props, size = null, base = null) {
  const item = Object.assign({ id: uid(), html: '', base: base || Object.assign({}, S.textDefault, { bg: '', border: false, align: 'left', color: luminance(S.textDefault.color) > 0.8 ? '#1C1C1E' : S.textDefault.color }) }, props);

}
async function placeImageFile(file, at, remaining) {
  let img;
  try { img = await readImageFile(file); } catch (e) { return toast('No se ha podido leer esa imagen.'); }
  // ¿Dentro del texto que se estaba escribiendo?
  const inline = !at && savedRange && S.editing && findItem(S.editing);
  const range = inline ? savedRange.cloneRange() : null;
  const edited = await cropImageDialog(img.src, { inline: !!inline, remaining });
  if (!edited) return;
  if (inline) {
    savedRange = range;
    if (restoreRange()) {
      const found = findItem(S.editing);
      if (found) {
        const before = snapshotPage(found.page);
        document.execCommand('insertImage', false, edited.src);
        syncRich(found);
        commit(found.page, before);
        return;

    }

  const cy = at ? at.y : Math.min(page.h - h / 2, Math.max(h / 2, (desk.scrollTop + desk.clientHeight / 2 - v.wrap.offsetTop) / S.zoom));
  const item = { id: uid(), type: 'image', x: Math.min(page.w - fw, Math.max(0, cx - fw / 2)), y: Math.min(page.h - h, Math.max(0, cy - h / 2)), w: fw, h, src: edited.src, alt: file.name || 'Imagen' };

  page.items.push(item);

  editItem(fresh, (it) => { it.src = edited.src; it.h = it.w * edited.h / edited.w; });

function linkPicker(onPick) {
