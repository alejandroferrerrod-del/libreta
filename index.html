<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E1E2E1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<meta name="description" content="Tus apuntes, a mano y a tu manera.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Caveat:wght@500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400;1,8..60,700&display=swap">

<body>
<style>
/* Igual que la app nativa (iPad y Mac): colores medidos en sus capturas, fuente del sistema, iconos
   de línea, pestañas como las de Chrome y barras blancas (o gris oscuro en modo oscuro). */
:root {
  --strip: #E1E2E1;          /* franja de pestañas */
  --bar: #FFFFFF;            /* barra de herramientas, de opciones y pestaña activa */
  --desk: #EAEBEB;           /* mesa detrás de las páginas */
  --sidebar: #F2F2F2;
  --surface: #FFFFFF;
  --surface-2: #F0F0F0;      /* campos, buscador */
  --fill: rgba(118, 118, 128, .12);   /* grupo de herramientas, segmentos */
  --fill-strong: #DDDDDD;   /* herramienta elegida */
  --seg-thumb: #FFFFFF;
  --ink: #000000;
  --ink-2: rgba(60, 60, 67, .78);
  --muted: rgba(60, 60, 67, .6);
  --line: #D8D8DC;
  --hairline: rgba(0, 0, 0, .12);
  --accent: #007AFF;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(0, 122, 255, .14);
  --danger: #FF3B30;
  --mark: #FFE66B;
  --sep: rgba(0, 0, 0, .22);
  --shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 6px 20px rgba(0, 0, 0, .10);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-body: var(--font);
  --font-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --strip: #161615; --bar: #292828; --desk: #1E1E1E; --sidebar: #252525; --surface: #2C2C2E; --surface-2: #3A3A3C;
    --fill: rgba(118, 118, 128, .24); --fill-strong: #595756; --seg-thumb: #636366; --ink: #FFFFFF; --ink-2: rgba(235, 235, 245, .8);
    --muted: rgba(235, 235, 245, .6); --line: #48484A; --hairline: rgba(255, 255, 255, .1); --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .22);
    --danger: #FF453A; --mark: #8A7420; --sep: rgba(255, 255, 255, .22); --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --strip: #161615; --bar: #292828; --desk: #1E1E1E; --sidebar: #252525; --surface: #2C2C2E; --surface-2: #3A3A3C;
  --fill: rgba(118, 118, 128, .24); --fill-strong: #595756; --seg-thumb: #636366; --ink: #FFFFFF; --ink-2: rgba(235, 235, 245, .8);
  --muted: rgba(235, 235, 245, .6); --line: #48484A; --hairline: rgba(255, 255, 255, .1); --accent: #0A84FF; --accent-soft: rgba(10, 132, 255, .22);
  --danger: #FF453A; --mark: #8A7420; --sep: rgba(255, 255, 255, .22); --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bar); color: var(--ink); font: 15px/1.4 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; font-weight: 600; }
#app { height: 100%; display: flex; flex-direction: column; }
.hidden-stage { position: fixed; left: -20000px; top: 0; pointer-events: none; }
svg { display: block; }

/* ---------- Barras y botones ---------- */
.bar { background: var(--bar); display: flex; align-items: center; gap: 6px; padding: 6px 10px; min-height: 48px; flex: none; }
.bar.scroll { overflow-x: auto; scrollbar-width: none; }
.spacer { flex: 1; min-width: 8px; }
.btn { border: 0; background: var(--fill); border-radius: 8px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 14px; }
.btn:hover:not(:disabled) { filter: brightness(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.on { background: var(--accent); color: var(--accent-ink); }
.btn.tinted { color: var(--accent); }
.btn svg { width: 16px; height: 16px; }
/* Botón de icono (como los de la barra nativa: 36×36 y azules). */
.icon-btn { width: 36px; height: 36px; border: 0; background: transparent; border-radius: 9px; display: inline-grid; place-items: center; flex: none; color: var(--accent); padding: 0; }
.icon-btn:hover:not(:disabled) { background: var(--fill); }
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn.plain { color: var(--ink); }
.group { display: flex; gap: 2px; padding: 4px; background: var(--fill); border-radius: 12px; flex: none; }
/* Herramientas: icono del color de la tinta y una barrita debajo; la elegida, con fondo gris. */
.tool { width: 36px; height: 36px; border: 0; background: transparent; border-radius: 9px; display: inline-grid; place-items: center; color: var(--ink); position: relative; padding: 0; flex: none; }
.tool svg { width: 20px; height: 20px; }
.tool.colored svg { transform: translateY(-2px); }
.tool[aria-pressed="true"] { background: var(--fill-strong); }
.tool[aria-pressed="true"] svg { stroke-width: 2.1; }
.tool:hover:not([aria-pressed="true"]) { background: var(--fill); }
.tool .ink-bar { position: absolute; left: 9px; right: 9px; bottom: 4px; height: 4px; border-radius: 2px; background: var(--c); box-shadow: inset 0 0 0 .5px var(--sep); }
.sep { width: 1px; height: 24px; background: var(--line); flex: none; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 0; border-radius: 9px; padding: 7px 10px; width: min(380px, 100%); }
.search input { border: 0; background: transparent; outline: none; width: 100%; text-align: center; font-size: 16px; }
.search input::placeholder { color: var(--muted); }
.search svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search .ghost { width: 20px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 600; color: #fff; background: var(--c, #6B7280); border: 0; white-space: nowrap; }
.chip svg { width: 13px; height: 13px; }
.chip .count { background: rgba(255,255,255,.3); border-radius: 99px; padding: 0 5px; font-size: 10px; }

/* ---------- Biblioteca ---------- */
.lib-header { display: flex; align-items: center; gap: 10px; padding: 24px 14px 4px; background: var(--bar); flex: none; position: relative; }
.lib-header .center { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); width: min(380px, calc(100% - 420px)); }
.lib-header .center .search { width: 100%; }
.round-btn { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--fill); display: grid; place-items: center; color: var(--ink); padding: 0; }
.round-btn svg { width: 22px; height: 22px; }
.pill-group { display: flex; align-items: center; background: var(--fill); border-radius: 22px; height: 44px; padding: 0 4px; }
.pill-group button { width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); border-radius: 22px; padding: 0; }
.pill-group svg { width: 22px; height: 22px; }
.prominent { border: 0; border-radius: 22px; height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; background: var(--accent); color: #fff; }
.prominent.purple { background: #BF5AF2; }
.prominent svg { width: 18px; height: 18px; }
.large-title { font: 700 34px/1.15 var(--font-display); letter-spacing: -.01em; margin: 0; padding: 4px 20px 14px; background: var(--bar); flex: none; }
.library { flex: 1; overflow: auto; padding: 14px 28px 60px; background: var(--bar); }
.library .lede { color: var(--muted); margin: 0 0 20px; max-width: 64ch; font-size: 14px; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, 158px); gap: 26px 28px; }
.card { display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; }
/* Portada: degradado del color (más claro arriba), lomo oscuro y el título en blanco arriba. */
.cover { aspect-ratio: 158 / 210; width: 100%; border: 0; border-radius: 6px; padding: 0; position: relative; overflow: hidden; display: block; text-align: left;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 72%, white), color-mix(in srgb, var(--c) 93%, white)); transition: transform .15s ease, box-shadow .15s ease; }
.cover:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.cover.color::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 12px; background: rgba(0,0,0,.18); }
.cover span { position: absolute; left: 26px; right: 14px; top: 14px; color: #fff; font: 600 17px/1.25 var(--font); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover.page { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--hairline); }
.cover.page img { object-fit: contain; }
.card .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 6px; }
.card .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.card .meta svg { width: 14px; height: 14px; flex: none; }
.card .more { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(0,0,0,.35); color: #fff; display: grid; place-items: center; opacity: 0; transition: opacity .15s; padding: 0; }
.card .more svg { width: 18px; height: 18px; }
.card:hover .more, .card .more:focus-visible, .card .more[aria-expanded="true"] { opacity: 1; }
.badge { font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; background: var(--accent-soft); color: var(--accent); padding: 1px 6px; border-radius: 4px; font-weight: 600; }
.empty { color: var(--muted); padding: 60px 0; text-align: center; }
.results { display: flex; flex-direction: column; gap: 22px; max-width: 760px; }
.results h2 { font: 600 15px var(--font); margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
.results .mini { width: 30px; aspect-ratio: 3 / 4; border-radius: 3px; flex: none; position: relative; overflow: hidden; }
.result { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; border: 0; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
.result:hover { background: var(--fill-strong); }
.result .where { font-size: 12px; color: var(--muted); }
.notice { background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 10px 14px; margin: 0 0 22px; font-size: 13.5px; max-width: 70ch; }

/* La fecha y la hora, arriba a la derecha (en la app nativa van en la barra de título). */
.lib-clock { position: absolute; top: 4px; right: 16px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- Menús, diálogos, avisos (como los del sistema) ---------- */
.popover { position: fixed; z-index: 70; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
  border: 1px solid var(--hairline); border-radius: 12px; box-shadow: 0 10px 34px rgba(0,0,0,.22); padding: 5px; min-width: 220px; max-height: 70vh; overflow: auto; display: flex; flex-direction: column; animation: pop .12s ease-out; }
@keyframes pop { from { opacity: 0; transform: scale(.97); } }
.popover button { border: 0; background: transparent; text-align: left; padding: 6px 10px; border-radius: 7px; display: flex; gap: 10px; align-items: center; font-size: 14px; }
.popover button svg { width: 17px; height: 17px; flex: none; }
.popover button:hover:not(:disabled) { background: var(--accent); color: #fff; }
.popover hr { border: 0; border-top: 1px solid var(--hairline); margin: 5px 6px; }
.popover .label { font-size: 11.5px; color: var(--muted); padding: 6px 10px 2px; font-weight: 600; }
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 60; display: grid; place-items: center; padding: 16px; animation: fade .15s ease-out; }
@keyframes fade { from { opacity: 0; } }
.dialog { background: var(--surface); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 22px; display: flex; flex-direction: column; gap: 16px; animation: rise .2s cubic-bezier(.2,.8,.3,1); }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.dialog.wide { width: min(820px, 100%); }
.dialog h2 { font: 600 18px var(--font); margin: 0; text-align: center; }
.dialog p { margin: 0; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 13px; }
.field input[type="text"], .field select { border: 0; background: var(--surface-2); border-radius: 8px; padding: 9px 11px; font-weight: 400; font-size: 15px; }
.choices { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 0; padding: 0; flex: none; box-shadow: inset 0 0 0 .5px var(--sep); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bar), 0 0 0 4px var(--accent); }
.tpl { border: 0; background: var(--surface-2); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; }
.tpl[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.tpl canvas { border-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 14px; }
.pick-grid button { border: 2px solid transparent; background: transparent; border-radius: 8px; padding: 4px; display: flex; flex-direction: column; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.pick-grid button:hover { border-color: var(--accent); }
.pick-grid img { width: 100%; box-shadow: 0 1px 4px rgba(0,0,0,.18); border-radius: 3px; }
.list-pick { display: flex; flex-direction: column; gap: 4px; max-height: 50vh; overflow: auto; }
.list-pick button { display: flex; gap: 10px; align-items: center; border: 0; background: transparent; text-align: left; padding: 8px; border-radius: 8px; }
.list-pick button:hover { background: var(--fill); }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
/* Control segmentado (como el de Apple). */
.seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; gap: 0; flex: none; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; font-size: 13.5px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.seg button svg { width: 18px; height: 18px; }
.seg button[aria-pressed="true"] { background: var(--seg-thumb); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  color: var(--ink); padding: 10px 18px; border-radius: 999px; z-index: 90; box-shadow: 0 6px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); border: 1px solid var(--hairline); font-size: 14px; animation: rise .2s ease-out; }

/* ---------- Pestañas (como las de Chrome) ---------- */
.tabs { background: var(--strip); display: flex; align-items: flex-end; height: 40px; padding: 0 10px; flex: none; gap: 0; overflow: hidden; }
.tabs .chip { align-self: center; margin: 0 6px; }
.tabs .chip.drop { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab { position: relative; height: 34px; flex: 0 1 220px; min-width: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; font-size: 13px; color: var(--ink-2); border: 0; background: transparent; cursor: default; user-select: none; }
.tab .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .book { width: 13px; height: 13px; color: var(--c); flex: none; }
.tab .x { border: 0; background: transparent; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); padding: 0; flex: none; }
.tab .x svg { width: 12px; height: 12px; stroke-width: 2.5; }
.tab .x:hover { background: var(--fill); }
/* Separador entre pestañas inactivas. */
.tab:not(.active) + .tab:not(.active)::before { content: ""; position: absolute; left: 0; top: 9px; height: 18px; width: 1px; background: var(--sep); }
.tab:not(.active):hover { color: var(--ink); }
.tab:not(.active):hover .hover-bg { display: block; }
.tab .hover-bg { display: none; position: absolute; inset: 4px 3px; border-radius: 8px; background: var(--fill); z-index: -1; }
.tab.active { background: var(--bar); color: var(--ink); font-weight: 500; border-radius: 9px 9px 0 0; z-index: 1; }
/* Las curvitas de abajo que unen la pestaña con la barra. */
.tab.active .foot { position: absolute; bottom: 0; width: 8px; height: 8px; }
.tab.active .foot.l { left: -8px; background: radial-gradient(circle at 0 0, transparent 7.5px, var(--bar) 8px); }
.tab.active .foot.r { right: -8px; background: radial-gradient(circle at 100% 0, transparent 7.5px, var(--bar) 8px); }
.tab .gline { position: absolute; left: 8px; right: 8px; bottom: 0; height: 2.5px; border-radius: 2px; background: var(--g); }
.tab.dragging { opacity: .3; }
.tab.floating { position: fixed; z-index: 80; pointer-events: none; background: var(--bar); border-radius: 9px 9px 0 0; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.tabs .plus { align-self: center; }
.tabs .clock { align-self: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; margin: 0 10px 0 auto; padding-left: 12px; }

/* ---------- Editor ---------- */
.title-input { border: 0; background: transparent; font: 600 17px var(--font); padding: 5px 6px; border-radius: 6px; width: 200px; min-width: 100px; color: var(--ink); text-overflow: ellipsis; }
.title-input:hover, .title-input:focus { background: var(--fill); outline: none; }
.options { background: var(--bar); border-bottom: 1px solid var(--hairline); display: flex; align-items: center; gap: 10px; padding: 6px 14px; min-height: 50px; overflow-x: auto; white-space: nowrap; flex: none; scrollbar-width: none; }
.options .hint { color: var(--muted); font-size: 14px; }
.options select { border: 0; background: transparent; color: var(--accent); font-size: 15px; padding: 5px 4px; }
.menu-btn { border: 0; background: transparent; color: var(--accent); font-size: 15px; display: inline-flex; align-items: center; gap: 4px; padding: 5px 6px; border-radius: 7px; }
.menu-btn svg { width: 16px; height: 16px; }
.menu-btn:hover { background: var(--fill); }
.width-dots { display: inline-flex; align-items: center; gap: 4px; }
.width-dots button { width: 28px; height: 28px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.width-dots button span { border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 .75px var(--sep); display: block; }
.width-dots button[aria-pressed="true"] { background: var(--accent-soft); }
.custom-color { width: 42px; height: 26px; border-radius: 13px; border: 0; padding: 0; box-shadow: inset 0 0 0 .5px var(--sep); position: relative; overflow: hidden; }
.custom-color input { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); border: 0; padding: 0; cursor: pointer; opacity: 0; }
.range { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.range input[type="range"] { width: 140px; accent-color: var(--accent); }
.pill-toggle { border: 0; background: var(--fill); border-radius: 999px; padding: 6px 14px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; }
.pill-toggle svg { width: 17px; height: 17px; }
.pill-toggle[aria-pressed="true"] { background: var(--accent); color: #fff; }
.workspace { flex: 1; display: flex; min-height: 0; border-top: 1px solid var(--hairline); }
.sidebar { width: 240px; flex: none; background: var(--sidebar); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; min-height: 0; }
.sidebar .seg { margin: 12px auto; padding: 3px; border-radius: 12px; }
.sidebar .seg button { padding: 6px 14px; border-radius: 9px; }

function luminance(hex) {
  if (!hex || hex[0] !== '#') return 0.5;
  const n = parseInt(hex.slice(1, 7), 16);
  return (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
}

  if (!name) return '#6B7280';

const RICH_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'SPAN', 'DIV', 'P', 'BR', 'A', 'IMG', 'FONT', 'MARK', 'UL', 'OL', 'LI']);
const RICH_STYLES = ['color', 'background-color', 'font-size', 'font-family', 'font-weight', 'font-style', 'text-decoration', 'text-decoration-line'];
/** Deja solo etiquetas y estilos de formato; enlaces internos e imágenes incrustadas. */
function sanitizeHTML(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html || '';
  const walk = (node) => {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === Node.TEXT_NODE) continue;
      if (child.nodeType !== Node.ELEMENT_NODE || !RICH_TAGS.has(child.tagName)) {
        if (child.nodeType === Node.ELEMENT_NODE && !['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT'].includes(child.tagName)) {
          walk(child);
          child.replaceWith(...child.childNodes);
        } else child.remove();
        continue;
      }
      const keep = {};
      if (child.tagName === 'A' && child.dataset.link) keep['data-link'] = child.dataset.link;
      if (child.tagName === 'IMG' && /^data:image\//.test(child.getAttribute('src') || '')) keep.src = child.getAttribute('src');
      if (child.tagName === 'FONT' && child.getAttribute('color')) child.style.color = child.getAttribute('color');
      const style = RICH_STYLES.map((p) => [p, child.style.getPropertyValue(p)]).filter(([, v]) => v);
      for (const attr of [...child.attributes]) child.removeAttribute(attr.name);
      for (const [k, v] of Object.entries(keep)) child.setAttribute(k, v);
      if (child.tagName === 'A' && !keep['data-link']) { walk(child); child.replaceWith(...child.childNodes); continue; }
      if (child.tagName === 'IMG' && !keep.src) { child.remove(); continue; }
      if (style.length) child.setAttribute('style', style.map(([p, v]) => `${p}:${v}`).join(';'));
      walk(child);
    }
  };
  walk(tpl.content);
  return tpl.innerHTML;
}

function htmlText(html) {

  div.innerHTML = (html || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/(div|p|li)>/gi, '\n');
  return div.textContent.replace(/\n{3,}/g, '\n\n').trim();

// =============================================================================
const Store = {

  working: true,
  async open() {

          const db = req.result;
          if (!db.objectStoreNames.contains('notebooks')) db.createObjectStore('notebooks', { keyPath: 'id' });

  async all() {

      } catch (e) { resolve([]); }

  el.addEventListener('click', (e) => { const b = e.target.closest('button[data-act]'); if (b && !b.disabled) { closePopover(); onAct(b.dataset.act, b); } });
  el.querySelector('button')?.focus({ preventScroll: true });
}
document.addEventListener('pointerdown', (e) => {
  if (openPopover && !openPopover.el.contains(e.target) && !(openPopover.anchor.contains && openPopover.anchor.contains(e.target))) closePopover();
}, true);

function dialog(html, onAct, wide = false) {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="dialog${wide ? ' wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.addEventListener('click', (e) => {
    if (e.target === scrim) return close();
    const b = e.target.closest('[data-act]');
    if (b && !b.disabled) onAct(b.dataset.act, b, close, scrim);
  });
  scrim.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  setTimeout(() => (scrim.querySelector('input[type="text"]') || scrim.querySelector('button'))?.focus(), 30);
  return scrim;
}
function confirmDialog(title, text, action, onYes) {
  dialog(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="actions"><button class="btn" data-act="no">Cancelar</button><button class="btn primary" data-act="yes" style="background:var(--danger)">${esc(action)}</button></div>`,
    (act, _b, close) => { close(); if (act === 'yes') onYes(); });
}
function promptDialog(title, value, onOk, label = 'Nombre') {
  const scrim = dialog(`<h2>${esc(title)}</h2><label class="field" for="prompt-input">${esc(label)}<input type="text" id="prompt-input" value="${esc(value)}"></label>
    <div class="actions"><button class="btn" data-act="no">Cancelar</button><button class="btn primary" data-act="ok">Guardar</button></div>`,
  (act, _b, close, sc) => { const v = $('#prompt-input', sc).value.trim(); close(); if (act === 'ok' && v) onOk(v); });
  $('#prompt-input', scrim).addEventListener('keydown', (e) => { if (e.key === 'Enter') scrim.querySelector('[data-act="ok"]').click(); });
}
function pickFile(accept, onFile, multiple = false) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = accept; input.multiple = multiple;
  input.addEventListener('change', () => { for (const f of input.files) onFile(f); });
  input.click();
}
async function saveFile(filename, data) {
  // En la app instalada (o en cualquier navegador): una descarga normal.
  if (!S.downloads) {
    try {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = Object.assign(document.createElement('a'), { href: url, download: filename });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      return true;
    } catch (e) {
      toast('No se ha podido descargar el archivo.');
      return false;
    }
  }
  try { await S.downloads.save({ filename, data }); return true; } catch (e) {
    if (e?.code !== 'declined') toast('No se ha podido descargar el archivo.');
    return false;
  }
}
const imageCache = new Map();
function loadImage(src) {
  if (!src) return Promise.resolve(null);
  if (imageCache.has(src)) return imageCache.get(src);
  const p = new Promise((resolve) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = () => resolve(null); img.src = src; });
  imageCache.set(src, p);
  return p;
}
/** Reduce las fotos grandes (para que quepan muchas en el navegador). */
function readImageFile(file, max = 1600) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = async () => {
      const img = await loadImage(reader.result);
      if (!img) return reject(new Error('imagen'));
      const s = Math.min(1, max / Math.max(img.width, img.height));
      if (s === 1 && file.size < 600000) return resolve({ src: reader.result, w: img.width, h: img.height });
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve({ src: file.type === 'image/png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.86), w: c.width, h: c.height });
    };
    reader.readAsDataURL(file);
  });
}

// =============================================================================
// Dibujo: papel, tinta, miniaturas y exportación (PDF y PNG)
// =============================================================================

function drawPaper(ctx, page) {
  const paper = PAPERS[page.paper] || PAPERS.white;
  const W = page.w, H = page.h;
  ctx.fillStyle = paper.fill;
  ctx.fillRect(0, 0, W, H);
  if (page.bg) return; // página de PDF: el fondo es la imagen
  ctx.strokeStyle = paper.line;
  ctx.fillStyle = paper.line;
  ctx.lineWidth = 1;
  const hline = (y, x0 = 0, x1 = W) => { ctx.moveTo(x0, y); ctx.lineTo(x1, y); };
  const margin = (x) => { ctx.stroke(); ctx.beginPath(); ctx.strokeStyle = 'rgba(235, 115, 115, .6)'; ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); ctx.strokeStyle = paper.line; ctx.beginPath(); };
  ctx.beginPath();
  switch (page.template) {
    case 'ruled': for (let y = 110; y < H - 20; y += 32) hline(y); margin(90); break;
    case 'narrow': for (let y = 96; y < H - 20; y += 24) hline(y); margin(90); break;
    case 'grid':
      for (let x = 24; x < W; x += 24) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
      for (let y = 24; y < H; y += 24) hline(y);
      break;
    case 'dots':
      ctx.stroke(); ctx.beginPath();
      for (let x = 24; x < W; x += 24) for (let y = 24; y < H; y += 24) { ctx.moveTo(x + 1.4, y); ctx.arc(x, y, 1.4, 0, Math.PI * 2); }
      ctx.fill();
      break;
    case 'cornell': {
      const summary = H - 230;
      for (let y = 110; y < summary - 20; y += 32) hline(y);
      ctx.stroke(); ctx.beginPath(); ctx.lineWidth = 2;
      hline(90); ctx.moveTo(220, 90); ctx.lineTo(220, summary); hline(summary);
      break;
    }
    case 'music': {
      let y = 90;
      while (y + 36 < H - 50) { for (let i = 0; i < 5; i++) hline(y + i * 9, 50, W - 50); y += 36 + 70; }
      break;
    }
    default: break;
  }
  ctx.stroke();
}

function strokePath(ctx, p) {
  ctx.beginPath();
  ctx.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length - 1; i++) ctx.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);
  ctx.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
}
function drawStroke(ctx, s, paper, faded = false) {
  const p = s.points;
  if (!p || !p.length) return;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = ctx.fillStyle = displayColor(s.color, paper);
  if (faded) ctx.globalAlpha = 0.2;
  if (s.tool === 'highlighter') {
    ctx.globalAlpha *= 0.38;
    ctx.lineWidth = s.width;
    strokePath(ctx, p);
    ctx.stroke();
  } else if (p.length === 1) {
    ctx.beginPath(); ctx.arc(p[0][0], p[0][1], s.width * 0.6, 0, Math.PI * 2); ctx.fill();
  } else if (s.kind === 'pencil') {
    ctx.globalAlpha *= 0.78;
    ctx.lineWidth = Math.max(0.8, s.width * 0.75);
    strokePath(ctx, p);
    ctx.stroke();
    ctx.globalAlpha *= 0.35;
    ctx.lineWidth = Math.max(0.6, s.width * 0.35);
    ctx.translate(0.6, 0.4);
    strokePath(ctx, p);
    ctx.stroke();
  } else {
    for (let i = 1; i < p.length; i++) {
      const a = p[i - 1], b = p[i];
      let w;
      if (s.kind === 'fountain') {
        // Pluma: más gruesa en un sentido que en otro, como una plumilla inclinada.
        const angle = Math.atan2(b[1] - a[1], b[0] - a[0]);
        w = s.width * (0.35 + 1.15 * Math.abs(Math.sin(angle - Math.PI / 4)));
      } else {
        const pressure = ((a[2] ?? 0.5) + (b[2] ?? 0.5)) / 2;
        w = s.width * (0.45 + pressure * 1.1);
      }
      ctx.lineWidth = w;
      ctx.beginPath();
      if (i === 1) ctx.moveTo(a[0], a[1]); else ctx.moveTo((p[i - 2][0] + a[0]) / 2, (p[i - 2][1] + a[1]) / 2);
      ctx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      if (i === p.length - 1) ctx.lineTo(b[0], b[1]);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function fontCSS(base, scale = 1) {
  return `${base.italic ? 'italic ' : ''}${base.bold ? '700 ' : '400 '}${base.size * scale}px ${FONTS[base.font]?.css || FONTS.sans.css}`;
}
function wrapText(ctx, text, x, y, maxW, lineH, maxY = Infinity) {
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && line) { if (y > maxY) return; ctx.fillText(line, x, y); y += lineH; line = word; } else line = test;
    }
    if (y > maxY) return;
    ctx.fillText(line, x, y); y += lineH;
  }
}

/** Dibujo aproximado de una página (texto sin formato por tramos) para miniaturas y portadas. */
async function drawPageQuick(ctx, page) {
  drawPaper(ctx, page);
  if (page.bg) { const img = await loadImage(page.bg); if (img) ctx.drawImage(img, 0, 0, page.w, page.h); }
  for (const it of page.items) {
    if (it.type === 'image') {
      const img = await loadImage(it.src);
      if (img) ctx.drawImage(img, it.x, it.y, it.w, it.h);
    } else if (it.type === 'text' || it.type === 'sticky') {
      if (it.type === 'sticky') { ctx.fillStyle = it.color; ctx.fillRect(it.x, it.y, it.w, it.h); }
      else if (it.base.bg) { ctx.fillStyle = it.base.bg; ctx.fillRect(it.x, it.y, it.w, it.h || it.base.size * 2); }
      ctx.font = fontCSS(it.base);
      ctx.fillStyle = displayColor(it.base.color, it.type === 'sticky' ? 'white' : page.paper);
      ctx.textBaseline = 'top';
      const pad = it.type === 'sticky' ? 14 : 8;
      wrapText(ctx, htmlText(it.html), it.x + pad, it.y + pad, it.w - pad * 2, it.base.size * 1.35, it.type === 'sticky' ? it.y + it.h - it.base.size : Infinity);
    }
  }
  for (const s of page.strokes) drawStroke(ctx, s, page.paper);
  for (const it of page.items) {
    if (it.type !== 'comment') continue;
    ctx.fillStyle = it.color;
    ctx.beginPath(); ctx.arc(it.x + 17, it.y + 17, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText((it.title || '•').trim().charAt(0).toUpperCase(), it.x + 17, it.y + 18);
    ctx.textAlign = 'start';
  }
}

const thumbCache = new Map();
/** Miniatura (dataURL) de una página, con caché mientras no cambie. */
async function pageThumb(page, width = 180) {
  const key = `${page.id}:${page._v || 0}:${width}`;
  if (thumbCache.has(key)) return thumbCache.get(key);
  const scale = width / page.w;
  const c = document.createElement('canvas');
  c.width = Math.round(page.w * scale * 2); c.height = Math.round(page.h * scale * 2);
  const ctx = c.getContext('2d');
  ctx.scale(scale * 2, scale * 2);
  await drawPageQuick(ctx, page);
  const url = c.toDataURL('image/jpeg', 0.82);
  thumbCache.set(key, url);
  return url;
}

// ---------- Exportación fiel (con el formato del texto), mediante html2canvas ----------

/** Página completa como lienzo, con el texto enriquecido tal cual se ve. */
async function renderPageCanvas(page, scale = 2) {
  const stage = document.createElement('div');
  stage.className = 'hidden-stage';
  const el = buildStaticPage(page);
  stage.appendChild(el);
  document.body.appendChild(stage);
  await Promise.all($$('img', el).map((img) => (img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; }))));
  try {
    if (window.html2canvas) {
      return await window.html2canvas(el, { scale, backgroundColor: null, logging: false, useCORS: true, width: page.w, height: page.h });
    }
    // Sin html2canvas: el dibujo aproximado.
    const c = document.createElement('canvas');
    c.width = page.w * scale; c.height = page.h * scale;
    const ctx = c.getContext('2d'); ctx.scale(scale, scale);
    await drawPageQuick(ctx, page);
    return c;
  } finally { stage.remove(); }
}
/** Página en DOM sin interacción (para exportar). */
function buildStaticPage(page) {
  const el = document.createElement('div');
  Object.assign(el.style, { position: 'relative', width: page.w + 'px', height: page.h + 'px', overflow: 'hidden', background: PAPERS[page.paper]?.fill || '#fff' });
  const paper = document.createElement('canvas');
  paper.width = page.w * 2; paper.height = page.h * 2;
  Object.assign(paper.style, { position: 'absolute', left: 0, top: 0, width: page.w + 'px', height: page.h + 'px' });
  const pctx = paper.getContext('2d'); pctx.scale(2, 2); drawPaper(pctx, page);
  el.appendChild(paper);
  if (page.bg) { const bg = document.createElement('img'); bg.src = page.bg; Object.assign(bg.style, { position: 'absolute', left: 0, top: 0, width: page.w + 'px', height: page.h + 'px' }); el.appendChild(bg); }
  for (const it of page.items) {
    if (it.type === 'link' || it.type === 'comment') continue;
    el.appendChild(staticItem(it, page));
  }
  const ink = document.createElement('canvas');
  ink.width = page.w * 2; ink.height = page.h * 2;
  Object.assign(ink.style, { position: 'absolute', left: 0, top: 0, width: page.w + 'px', height: page.h + 'px' });
  const ictx = ink.getContext('2d'); ictx.scale(2, 2);
  for (const s of page.strokes) drawStroke(ictx, s, page.paper);
  el.appendChild(ink);
  for (const it of page.items) {
    if (it.type !== 'comment') continue;
    const pin = document.createElement('div');
    pin.className = 'pin';
    pin.style.cssText = `left:${it.x}px;top:${it.y}px;--c:${it.color}`;
    pin.innerHTML = `${esc((it.title || '•').trim().charAt(0).toUpperCase())}<span class="name">${esc(it.title)}</span>`;
    el.appendChild(pin);
  }
  return el;
}
function staticItem(it, page) {
  const div = document.createElement('div');
  div.style.cssText = `position:absolute;left:${it.x}px;top:${it.y}px;width:${it.w}px;${it.h && it.type !== 'text' ? `height:${it.h}px;` : ''}`;
  if (it.type === 'image') {
    const img = document.createElement('img');
    img.src = it.src;
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block';
    div.appendChild(img);
    return div;
  }
  const rich = document.createElement('div');
  rich.className = 'rich';
  rich.innerHTML = it.html || '';
  applyBase(rich, it.base, it.type === 'sticky' ? 'white' : page.paper);
  if (it.type === 'sticky') { div.style.background = it.color; div.style.padding = '16px 14px'; div.style.overflow = 'hidden'; div.style.boxShadow = '0 3px 8px rgba(0,0,0,.22)'; }
  else {
    div.style.padding = '6px 8px';
    if (it.base.bg) div.style.background = it.base.bg;
    if (it.base.border) div.style.border = `1.5px solid ${it.base.color}`;
  }
  div.appendChild(rich);
  return div;
}
/** Estilo base de un texto (lo que no lleva formato propio por tramos). */
function applyBase(el, base, paper) {
  Object.assign(el.style, {
    fontFamily: FONTS[base.font]?.css || FONTS.sans.css, fontSize: base.size + 'px', color: displayColor(base.color, paper),
    fontWeight: base.bold ? '700' : '400', fontStyle: base.italic ? 'italic' : 'normal',
    textDecoration: [base.underline && 'underline', base.strike && 'line-through'].filter(Boolean).join(' ') || 'none',
    textAlign: base.align || 'left',
  });
}

async function exportPDF(nb, pages = nb.pages) {
  if (!window.jspdf) { toast('No se ha podido cargar el generador de PDF. Revisa la conexión y recarga.'); return; }
  toast(`Preparando el PDF (${pages.length} ${pages.length === 1 ? 'página' : 'páginas'})…`);
  const { jsPDF } = window.jspdf;
  const first = pages[0];
  const pdf = new jsPDF({ unit: 'pt', format: [first.w, first.h], orientation: first.w > first.h ? 'landscape' : 'portrait', compress: true });
  for (let i = 0; i < pages.length; i++) {
    const page = pages[i];
    if (i) pdf.addPage([page.w, page.h], page.w > page.h ? 'landscape' : 'portrait');
    const canvas = await renderPageCanvas(page, 2);
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, page.w, page.h);
  }
  pdf.setProperties({ title: nb.title, creator: 'Libreta' });
  const name = (nb.title || 'libreta').replace(/[\\/:*?"<>|]/g, '-');
  if (await saveFile(`${name}${pages.length === 1 && nb.pages.length > 1 ? ' - página ' + (nb.pages.indexOf(pages[0]) + 1) : ''}.pdf`, pdf.output('blob'))) toast('PDF descargado');
}
async function exportPNG(nb, page) {
  const canvas = await renderPageCanvas(page, 2);
  const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
  const name = (nb.title || 'libreta').replace(/[\\/:*?"<>|]/g, '-');
  if (await saveFile(`${name} - página ${nb.pages.indexOf(page) + 1}.png`, blob)) toast('Imagen descargada');
}

function paperPreview(canvas, template, paper, landscape = false, width = 54) {
  const page = { w: landscape ? LANDSCAPE.w : PORTRAIT.w, h: landscape ? LANDSCAPE.h : PORTRAIT.h, template, paper };
  const h = width * page.h / page.w;
  canvas.width = width * 2; canvas.height = h * 2;
  canvas.style.width = width + 'px'; canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(width * 2 / page.w, width * 2 / page.w);
  drawPaper(ctx, page);
}

/** Portada de una libreta (color, vista previa de página o foto). */
function coverHTML(nb, { label = true, tag = 'button', extra = '' } = {}) {
  const c = nb.cover || { type: 'color' };
  const inner = c.type === 'color' || !c.image
    ? (label ? `<span>${esc(nb.title)}</span>` : '')
    : `<img src="${c.image}" alt="">`;
  const cls = c.type === 'photo' && c.image ? 'photo' : c.type === 'page' && c.image ? 'page' : 'color';
  return `<${tag} class="cover ${cls}" style="--c:${nb.color}" ${extra}>${inner}</${tag}>`;
}

// ---------- Búsqueda en todas las libretas ----------
function foldMap(text) {
  let folded = '';
  const map = [];
  for (let i = 0; i < text.length; i++) for (const ch of fold(text[i])) { folded += ch; map.push(i); }
  return { folded, map };
}
/** Coincidencias (sin distinguir mayúsculas ni tildes) con su posición en el texto original. */
function findMatches(text, query, limit = 5) {
  const q = fold(query.trim());
  if (!q || !text) return [];
  const { folded, map } = foldMap(text);
  const out = [];
  let from = 0;
  while (out.length < limit) {
    const i = folded.indexOf(q, from);
    if (i < 0) break;
    out.push({ start: map[i], end: map[i + q.length - 1] + 1 });
    from = i + q.length;
  }
  return out;
}
function snippetHTML(text, m) {
  const a = Math.max(0, m.start - 40), b = Math.min(text.length, m.end + 40);
  const clean = (s) => esc(s.replace(/\s+/g, ' '));
  return `${a > 0 ? '…' : ''}${clean(text.slice(a, m.start))}<mark>${clean(text.slice(m.start, m.end))}</mark>${clean(text.slice(m.end, b))}${b < text.length ? '…' : ''}`;
}
function highlightAll(text, query) {
  const ms = findMatches(text, query, 50);
  let out = '', last = 0;
  for (const m of ms) { out += esc(text.slice(last, m.start)) + '<mark>' + esc(text.slice(m.start, m.end)) + '</mark>'; last = m.end; }
  return out + esc(text.slice(last));
}
const SOURCE_NAMES = { text: 'Cuadro de texto', sticky: 'Post-it', comment: 'Comentario', pdf: 'PDF' };
/** Coincidencias de una libreta: [{ pageIndex, pageId, itemId, source, snippet }]. */
function searchNotebook(nb, query, limit = 30) {
  const hits = [];
  nb.pages.forEach((page, pageIndex) => {
    for (const item of page.items) {
      if (!['text', 'sticky', 'comment'].includes(item.type)) continue;
      const text = itemText(item);
      for (const m of findMatches(text, query)) hits.push({ pageIndex, pageId: page.id, itemId: item.id, source: item.type, snippet: snippetHTML(text, m) });
    }
    if (page.pdfText) for (const m of findMatches(page.pdfText, query)) hits.push({ pageIndex, pageId: page.id, itemId: null, source: 'pdf', snippet: snippetHTML(page.pdfText, m) });
  });
  return hits.slice(0, limit);
}

// ---------- Vista ----------
function renderLibrary() {
  S.view = 'library';
  stopDynamic();
  const q = S.query.trim();
  const inSpace = S.notebooks.filter((nb) => !S.space || nb.space === S.space).sort((a, b) => b.modified - a.modified);
  const dark = S.dynamic && !q;
  $('#app').innerHTML = `<div class="${dark ? 'dark-zone' : ''}" style="display:contents">
    <header class="lib-header">
      <button class="round-btn" id="space-btn" aria-haspopup="menu" title="${esc(S.space || 'Todas las libretas')}" aria-label="Espacio: ${esc(S.space || 'Todas las libretas')}">${icon('pages')}</button>
      <div class="center"><label class="search" for="search">${icon('search')}<input id="search" type="search" placeholder="Buscar por título o contenido" value="${esc(S.query)}" autocomplete="off"><span class="ghost"></span></label></div>
      <div class="spacer"></div>

// ---------- Importar PDF ----------
async function importPDF(file) {
  if (!window.pdfjsLib) { toast('No se ha podido cargar el lector de PDF. Revisa la conexión y recarga.'); return; }
  try {
    toast('Importando el PDF…');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const data = new Uint8Array(await file.arrayBuffer());
    const pdf = await pdfjsLib.getDocument({ data, isEvalSupported: false }).promise;
    const nb = newNotebook(file.name.replace(/\.pdf$/i, ''), COVERS[Math.floor(Math.random() * COVERS.length)], 'blank', 'white');
    nb.space = S.space;
    nb.pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const p = await pdf.getPage(i);
      const vp1 = p.getViewport({ scale: 1 });
      const landscape = vp1.width > vp1.height;
      const w = landscape ? LANDSCAPE.w : PORTRAIT.w;
      const h = Math.round(w * vp1.height / vp1.width);
      const vp = p.getViewport({ scale: (w * 1.6) / vp1.width });
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      await p.render({ canvasContext: ctx, viewport: vp }).promise;
      const text = (await p.getTextContent()).items.map((t) => t.str + (t.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+/g, ' ').trim();
      nb.pages.push({ id: uid(), w, h, template: 'blank', paper: 'white', bg: canvas.toDataURL('image/jpeg', 0.85), pdfText: text, strokes: [], items: [] });
      if (i % 5 === 0) toast(`Importando el PDF… ${i} de ${pdf.numPages}`);
    }
    S.notebooks.push(nb); Store.put(nb);
    toast(`PDF importado: ${nb.pages.length} páginas`);
    openNotebook(nb.id);
  } catch (e) {
    console.error(e);
    toast('No se ha podido abrir ese PDF.');
  }
}
