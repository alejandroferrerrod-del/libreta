  canMove(id, into) { return id !== into && !this.within(into, id); },
  move(id, into) {
    const f = this.byId(id);
    if (!f || !this.canMove(id, into)) return false;
    f.parent = into || null; f.modified = Date.now(); this.save();
    return true;
  },
  /** Eliminar una carpeta: su contenido (libretas y subcarpetas) pasa a la carpeta de arriba. */
  remove(id) {
    const f = this.byId(id);
    if (!f) return;
    for (const c of this.list) if (c.parent === id) c.parent = f.parent || null;
    for (const nb of S.notebooks) if (nb.folder === id) { nb.folder = f.parent || null; Store.put(nb); }
    this.list = this.list.filter((x) => x.id !== id);
    this.save();
  },

  /** Los espacios de antes (nb.space) pasan a carpetas de primer nivel. Se puede llamar varias veces. */
  migrate(notebooks, spaces = []) {
    for (const name of spaces) if (name) this.topNamed(name);
    for (const nb of notebooks) {
      if (nb.space && !nb.folder) nb.folder = this.topNamed(nb.space).id;
      if ('space' in nb) { delete nb.space; nb._migrated = true; }
    }
  },
};

/** Ventana «Mover a…»: elige la carpeta de destino (o el inicio). `items` = [{ kind: 'nb'|'folder', id }]. */
function moveDialog(items, onDone = refresh) {
  const movingFolders = items.filter((i) => i.kind === 'folder').map((i) => i.id);
  const allowed = (target) => movingFolders.every((id) => Folders.canMove(id, target));
  const count = items.length === 1 ? `«${esc(items[0].kind === 'nb' ? nbById(items[0].id)?.title : Folders.byId(items[0].id)?.name)}»` : `${items.length} elementos`;
  let target = S.folder || null;
  const scrim = dialog(`<h2>Mover ${count}</h2>
    <div class="move-tree" id="move-tree" role="listbox" aria-label="Carpeta de destino"></div>
    <div class="actions"><button class="btn" data-act="newf">${icon('folder')} Nueva carpeta aquí…</button><span class="spacer"></span>
      <button class="btn" data-act="cancel">Cancelar</button><button class="btn primary" data-act="move">Mover aquí</button></div>`, (act, b, close) => {
    if (act === 'cancel') return close();
    if (act === 'pick') { target = b.dataset.id || null; return draw(); }
    if (act === 'newf') return promptDialog('Nueva carpeta', '', (name) => { target = Folders.create(name, target).id; draw(); }, 'Nombre de la carpeta');
    if (act === 'move') {
      if (!allowed(target)) return toast('No se puede meter una carpeta dentro de sí misma.');
      for (const it of items) {
        if (it.kind === 'nb') { const nb = nbById(it.id); if (nb) { nb.folder = target; touch(nb); Store.put(nb); } }
        else Folders.move(it.id, target);
      }
      close();
      toast(`Movido a ${target ? `«${Folders.byId(target).name}»` : 'Libretas'}`);
      onDone();
    }
  });
  scrim.querySelector('.dialog').classList.add('move-dialog');
  function draw() {
    const row = (id, name, depth, color) => {
      const ok = allowed(id), on = (target || null) === (id || null);
      return `<button class="move-row" data-act="pick" data-id="${id || ''}" role="option" aria-selected="${on}" ${ok ? '' : 'disabled'} style="--d:${depth}">
        <span class="mf" style="--c:${color}">${icon(id ? 'folder' : 'book')}</span><span ${id ? 'translate="no"' : ''}>${esc(name)}</span></button>`;
    };
    $('#move-tree', scrim).innerHTML = row(null, 'Libretas (inicio)', 0, 'var(--accent)')
      + Folders.tree().map(({ folder, depth }) => row(folder.id, folder.name, depth + 1, Folders.color(Folders.top(folder.id)))).join('');
    scrim.querySelector('[data-act="move"]').disabled = !allowed(target);
  }
  draw();
}

// =============================================================================
// Recortar imágenes y elegir su tamaño (como en la app nativa). El recorte es un rectángulo
// normalizado (0…1) sobre la imagen, así no depende del tamaño con que se muestre.
// =============================================================================
const Crop = {
  full: { x: 0, y: 0, w: 1, h: 1 },
  minimum: 0.05,
  aspects: [['free', 'Libre'], ['original', 'Original'], ['1', '1:1'], ['1.3333', '4:3'], ['0.75', '3:4'], ['1.7778', '16:9']],

  ratio(aspect, size) {
    if (aspect === 'free') return null;
    if (aspect === 'original') return size.w / Math.max(size.h, 1);
    return Number(aspect);
  },
  /** Proporción en coordenadas normalizadas para una proporción en píxeles. */
  normalized(ratio, size) { return ratio * size.h / Math.max(size.w, 1); },
  largest(ratio, size) {
    if (!ratio) return { ...this.full };
    const r = this.normalized(ratio, size);
    const w = r >= 1 ? 1 : r, h = r >= 1 ? 1 / r : 1;
    return { x: (1 - w) / 2, y: (1 - h) / 2, w, h };
  },
  move(rect, dx, dy) {
    return { ...rect, x: Math.min(Math.max(0, rect.x + dx), 1 - rect.w), y: Math.min(Math.max(0, rect.y + dy), 1 - rect.h) };
  },
  /** Arrastrar un tirador ('tl','t','tr','r','br','b','bl','l'). Con proporción fija, el otro lado se ajusta. */
  resize(rect, handle, dx, dy, ratio, size) {
    const L = handle.includes('l'), R = handle.includes('r'), T = handle.includes('t'), B = handle.includes('b');
    let minX = rect.x, maxX = rect.x + rect.w, minY = rect.y, maxY = rect.y + rect.h;
    if (L) minX = Math.min(Math.max(0, minX + dx), maxX - this.minimum);
    if (R) maxX = Math.max(Math.min(1, maxX + dx), minX + this.minimum);
    if (T) minY = Math.min(Math.max(0, minY + dy), maxY - this.minimum);
    if (B) maxY = Math.max(Math.min(1, maxY + dy), minY + this.minimum);
    let out = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
    if (!ratio) return out;
    const r = this.normalized(ratio, size);
    const corner = (L || R) && (T || B);
    const widthLeads = corner ? Math.abs(dx) >= Math.abs(dy) * r : (L || R);
    let w = widthLeads ? out.w : out.h * r, h = w / r;
    const ax = L ? rect.x + rect.w : R ? rect.x : rect.x + rect.w / 2;
    const ay = T ? rect.y + rect.h : B ? rect.y : rect.y + rect.h / 2;
    const maxW = L ? ax : R ? 1 - ax : 2 * Math.min(ax, 1 - ax);
    const maxH = T ? ay : B ? 1 - ay : 2 * Math.min(ay, 1 - ay);
    const fit = Math.min(1, maxW / Math.max(w, 1e-4), maxH / Math.max(h, 1e-4));
    w *= fit; h *= fit;
    out = { x: L ? ax - w : R ? ax : ax - w / 2, y: T ? ay - h : B ? ay : ay - h / 2, w, h };
    return out;
  },
  /** Tras girar la imagen 90° a la izquierda, el recorte sigue sobre la misma zona. */
  rotatedLeft(rect) { return { x: rect.y, y: 1 - rect.x - rect.w, w: rect.h, h: rect.w }; },
};

/** Gira una imagen (dataURL) 90° a la izquierda. */
async function rotateImageLeft(src) {
  const img = await loadImage(src);
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalHeight; canvas.height = img.naturalWidth;
  const ctx = canvas.getContext('2d');
  ctx.translate(0, canvas.height);
  ctx.rotate(-Math.PI / 2);
  ctx.drawImage(img, 0, 0);
  return canvas.toDataURL(src.startsWith('data:image/png') ? 'image/png' : 'image/jpeg', 0.9);
}
/** Recorta una imagen (dataURL) por un rectángulo normalizado. */
async function cropImageData(src, rect) {
  const img = await loadImage(src);
  const W = img.naturalWidth, H = img.naturalHeight;
  const sx = Math.round(rect.x * W), sy = Math.round(rect.y * H), sw = Math.max(1, Math.round(rect.w * W)), sh = Math.max(1, Math.round(rect.h * H));
  const canvas = document.createElement('canvas');
  canvas.width = sw; canvas.height = sh;
  canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  return { src: canvas.toDataURL(src.startsWith('data:image/png') ? 'image/png' : 'image/jpeg', 0.9), w: sw, h: sh };
}

/**
 * Ventana de recortar (antes de colocar una imagen, o para recortar una ya puesta).
 * Devuelve { src, w, h, widthFraction } o null si se cancela.
 */
function cropImageDialog(src, { replacing = false, inline = false, widthFraction = 0.5, remaining = 0 } = {}) {
  return new Promise((resolve) => {
    let working = src, size = { w: 1, h: 1 }, rect = { ...Crop.full }, aspect = 'free', width = widthFraction, done = false;
    const title = (replacing ? 'Recortar imagen' : 'Insertar imagen') + (remaining ? ` (quedan ${remaining} más)` : '');
    const scrim = dialog(`<h2>${title}</h2>
      <div class="crop-stage"><div class="crop-box"><img alt="Imagen para recortar"><div class="crop-shade"></div><div class="crop-rect"><i></i><i></i><i></i><i></i></div>
        ${['tl', 't', 'tr', 'r', 'br', 'b', 'bl', 'l'].map((h) => `<span class="crop-h ${h}" data-h="${h}"></span>`).join('')}</div></div>
      <div class="crop-controls">
        <div class="seg">${Crop.aspects.map(([k, n]) => `<button data-act="aspect" data-v="${k}" aria-pressed="${k === 'free'}">${n}</button>`).join('')}</div>
        <button class="btn tinted" data-act="rotate">${icon('rotate')} Girar</button>
        <button class="btn" data-act="reset">Restablecer</button>
      </div>
      ${inline ? '' : `<label class="crop-width">${icon('photo')}<input type="range" min="0.1" max="1" step="0.01" value="${width}" aria-label="Ancho en la página">${icon('photo')}<span></span></label>`}
      <p class="crop-info"></p>
      <div class="actions"><button class="btn" data-act="cancel">${replacing ? 'Cancelar' : 'No insertar'}</button><button class="btn primary" data-act="ok">${replacing ? 'Recortar' : 'Insertar'}</button></div>`,
    async (act, b, close) => {
      if (act === 'cancel') { done = true; close(); resolve(null); }
      if (act === 'ok') {
        done = true;
        const out = rect.x === 0 && rect.y === 0 && rect.w === 1 && rect.h === 1 && working === src
          ? { src: working, w: size.w, h: size.h } : await cropImageData(working, rect);
        close();
        resolve({ ...out, widthFraction: inline ? null : width });
      }
      if (act === 'aspect') {
        aspect = b.dataset.v;
        b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
        rect = Crop.largest(Crop.ratio(aspect, size), size);
        draw();
      }
      if (act === 'rotate') {
        working = await rotateImageLeft(working);
        await setImage();
        rect = aspect === 'free' ? Crop.rotatedLeft(rect) : Crop.largest(Crop.ratio(aspect, size), size);
        draw();
      }
      if (act === 'reset') {
        aspect = 'free';
        scrim.querySelectorAll('[data-act="aspect"]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.v === 'free'));
        rect = { ...Crop.full };
        draw();
      }
    }, true);
    scrim.querySelector('.dialog').classList.add('crop-dialog');
    const box = scrim.querySelector('.crop-box'), img = scrim.querySelector('img'), frame = scrim.querySelector('.crop-rect'), shade = scrim.querySelector('.crop-shade');
    const info = scrim.querySelector('.crop-info'), slider = scrim.querySelector('.crop-width input'), label = scrim.querySelector('.crop-width span');
    async function setImage() {
      const image = await loadImage(working);
      size = { w: image.naturalWidth, h: image.naturalHeight };
      img.src = working;
      const stage = scrim.querySelector('.crop-stage');
      const scale = Math.min((stage.clientWidth - 36) / size.w, (stage.clientHeight - 36) / size.h, 1.5);
      box.style.width = `${size.w * scale}px`; box.style.height = `${size.h * scale}px`;
    }
    function draw() {
      const W = box.clientWidth, H = box.clientHeight;
      const r = { x: rect.x * W, y: rect.y * H, w: rect.w * W, h: rect.h * H };
      Object.assign(frame.style, { left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px` });
      shade.style.clipPath = `polygon(evenodd, 0 0, 100% 0, 100% 100%, 0 100%, 0 0, ${r.x}px ${r.y}px, ${r.x}px ${r.y + r.h}px, ${r.x + r.w}px ${r.y + r.h}px, ${r.x + r.w}px ${r.y}px, ${r.x}px ${r.y}px)`;
      for (const h of scrim.querySelectorAll('.crop-h')) {
        const k = h.dataset.h;
        h.style.left = `${k.includes('l') ? r.x : k.includes('r') ? r.x + r.w : r.x + r.w / 2}px`;
        h.style.top = `${k.includes('t') ? r.y : k.includes('b') ? r.y + r.h : r.y + r.h / 2}px`;
      }
      info.textContent = `Recorte: ${Math.round(rect.w * size.w)} × ${Math.round(rect.h * size.h)} píxeles. Arrastra las esquinas o los bordes; arrastra dentro para mover el recorte.`;
      if (label) label.textContent = `Ancho en la página: ${Math.round(width * 100)} %`;
    }
    const drag = (onMove) => (e) => {
      e.preventDefault();
      const start = { x: e.clientX, y: e.clientY, rect: { ...rect } };
      const move = (ev) => { onMove(start, (ev.clientX - start.x) / box.clientWidth, (ev.clientY - start.y) / box.clientHeight); draw(); };
      const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
      addEventListener('pointermove', move);
      addEventListener('pointerup', up);
    };
    frame.addEventListener('pointerdown', drag((s, dx, dy) => { rect = Crop.move(s.rect, dx, dy); }));
    for (const h of scrim.querySelectorAll('.crop-h')) {
      h.addEventListener('pointerdown', drag((s, dx, dy) => { rect = Crop.resize(s.rect, h.dataset.h, dx, dy, Crop.ratio(aspect, size), size); }));
    }
    slider?.addEventListener('input', () => { width = Number(slider.value); draw(); });
    setImage().then(draw);
    // Cerrar con Esc o tocando fuera también cuenta como cancelar.
    new MutationObserver((_, observer) => { if (!document.body.contains(scrim)) { observer.disconnect(); if (!done) resolve(null); } }).observe(document.body, { childList: true });
  });
}

// =============================================================================
// Reordenar arrastrando con el ratón, en vivo (como la app nativa): lo que arrastras sigue
// al puntero y el resto se aparta para enseñar dónde quedará. Sirve para páginas y pestañas.
// =============================================================================
const Reorder = {
  /** Posición en la que quedaría lo arrastrado: cuántas casillas (sin la suya) quedan antes del puntero. */
  targetIndex(point, slots, from, axis = 'grid') {
    let n = 0;
    slots.forEach((s, i) => {
      if (i === from) return;
      const before = axis === 'x' ? point.x > s.left + s.width / 2 : point.y > s.bottom || (point.y >= s.top && point.x > s.left + s.width / 2);
      if (before) n++;
    });
    return n;
  },
  /** El orden resultante de mover el elemento `from` a `to`. */
  preview(list, from, to) {
    const out = list.slice();
    const [moved] = out.splice(from, 1);
    out.splice(to, 0, moved);
    return out;
  },
};

/**
 * Hace reordenables los hijos `selector` de `container`.
 * onDrop(from, to, el, pointerEvent) al soltar en otro sitio; onOutside(el, pointerEvent) al soltar fuera
 * (devuelve true si lo ha gestionado); onTarget(el, elementoDebajo) igual, antes que nada.
 * `group(el)`: solo se reordena entre los que tienen el mismo grupo. `ignore` = selector de botones dentro que no inician arrastre.
 */
function liveReorder(container, selector, { onDrop, onOutside, onTarget, group, ignore = 'button', scroller = null, axis = 'grid' } = {}) {
  container.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || (ignore && e.target.closest(ignore))) return;
    const el = e.target.closest(selector);
    if (!el || !container.contains(el)) return;
    const items = [...container.querySelectorAll(selector)].filter((x) => x.parentElement === el.parentElement && (!group || group(x) === group(el)));
    const from = items.indexOf(el);
    const scrollEl = scroller || container;
    const start = { x: e.clientX, y: e.clientY, scroll: scrollEl.scrollTop };
    let dragging = false, to = from, last = e, autoscroll = 0;
    let slots = [];
    const point = (ev) => ({ x: ev.clientX, y: ev.clientY + (scrollEl.scrollTop - start.scroll) });
    const layout = () => {
      const p = point(last);
      to = Reorder.targetIndex(p, slots, from, axis);
      el.style.transform = `translate(${last.clientX - start.x}px, ${axis === 'x' ? 0 : p.y - start.y}px)`;
      const order = Reorder.preview(items.map((_, i) => i), from, to);
      if (axis === 'x') {
        const gap = slots.length > 1 ? slots[1].left - slots[0].left - slots[0].width : 0;
        let x = slots[0].left;
        order.forEach((itemIndex) => {
          if (itemIndex !== from) items[itemIndex].style.transform = `translateX(${x - slots[itemIndex].left}px)`;
          x += slots[itemIndex].width + gap;
        });
        return;
      }
      order.forEach((itemIndex, position) => {
        if (itemIndex === from) return;
        const a = slots[itemIndex], b = slots[position];
        items[itemIndex].style.transform = `translate(${b.left - a.left}px, ${b.top - a.top}px)`;
      });
    };
    const begin = () => {
      dragging = true;
      // Casillas en coordenadas de la ventana al empezar (la diferencia de scroll se suma al puntero).
      slots = items.map((x) => { const r = x.getBoundingClientRect(); return { left: r.left, top: r.top, width: r.width, height: r.height, bottom: r.bottom }; });
      items.forEach((x) => { if (x !== el) x.classList.add('reorder-shift'); });
      el.classList.add('reordering');
      document.body.classList.add('is-reordering');
    };
    const tick = () => {
      if (!dragging) return;
      const r = scrollEl.getBoundingClientRect(), edge = 40;
      const v = last.clientY < r.top + edge ? -(r.top + edge - last.clientY) : last.clientY > r.bottom - edge ? last.clientY - (r.bottom - edge) : 0;
      if (v && scrollEl.scrollHeight > scrollEl.clientHeight) { scrollEl.scrollTop += v * 0.4; layout(); }
      autoscroll = requestAnimationFrame(tick);
    };
    const move = (ev) => {
      last = ev;
      if (!dragging) {
        if (Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 5) return;
        begin();
        autoscroll = requestAnimationFrame(tick);
      }
      ev.preventDefault();
      layout();
    };
    const finish = (ev, cancelled) => {
      removeEventListener('pointermove', move);
      removeEventListener('pointerup', up);
      removeEventListener('pointercancel', cancel);
      removeEventListener('keydown', esc, true);
      cancelAnimationFrame(autoscroll);
      if (!dragging) return;
      // El clic que sigue a soltar no debe abrir lo arrastrado.
      const swallow = (c) => { c.stopPropagation(); c.preventDefault(); };
      addEventListener('click', swallow, { capture: true, once: true });
      setTimeout(() => removeEventListener('click', swallow, true), 0);
      el.style.pointerEvents = 'none';
      const under = ev && document.elementFromPoint(ev.clientX, ev.clientY);
      el.style.pointerEvents = '';
      const r = container.getBoundingClientRect();
      const inside = ev && ev.clientX >= r.left - 20 && ev.clientX <= r.right + 20 && ev.clientY >= r.top - 20 && ev.clientY <= r.bottom + 20;
      items.forEach((x) => { x.classList.remove('reorder-shift', 'reordering'); x.style.transform = ''; });
      document.body.classList.remove('is-reordering');
      if (cancelled) return;
      if (onTarget && onTarget(el, under, ev)) return;
      if (!inside && onOutside && onOutside(el, ev, under)) return;
      if (to !== from) onDrop(from, to, el, ev);
    };
    const up = (ev) => finish(ev, false);
    const cancel = () => finish(null, true);
    const esc = (ev) => { if (ev.key === 'Escape' && dragging) { ev.stopPropagation(); finish(null, true); } };
    addEventListener('pointermove', move);
    addEventListener('pointerup', up);
    addEventListener('pointercancel', cancel);
    addEventListener('keydown', esc, true);
  });
}

// ---------- Operaciones con páginas (las usan la barra lateral y la ventana «Páginas») ----------
function movePage(nb, from, to) {
  to = Math.max(0, Math.min(nb.pages.length - 1, to));
  if (from === to) return;
  const current = nb.pages[currentPageIndex]?.id;
  const [moved] = nb.pages.splice(from, 1);
  nb.pages.splice(to, 0, moved);
  touch(); buildPages(); renderSidebar();
  if (current) currentPageIndex = Math.max(0, nb.pages.findIndex((p) => p.id === current));
  updatePageIndicator();
  renderPagesWindow();
}
function duplicatePage(nb, i) {
  const copy = clone(nb.pages[i]);
  copy.id = uid(); copy.items.forEach((it) => { it.id = uid(); }); copy.strokes.forEach((s) => { s.id = uid(); }); copy.bookmarked = false;
  nb.pages.splice(i + 1, 0, copy);
  touch(); buildPages(); renderSidebar(); renderPagesWindow();
}
function deletePage(nb, i) {
  const page = nb.pages[i];
  confirmDialog(`¿Eliminar la página ${i + 1}?`, 'No se puede deshacer.', 'Eliminar página', () => {
    nb.pages.splice(i, 1); nb.outline = nb.outline.filter((o) => o.pageId !== page.id); S.undo[nb.id] = [];
    touch(); buildPages(); renderSidebar(); renderPagesWindow();
  });
}
function pageContextMenu(e, nb, i, { full = false } = {}) {
  e.preventDefault();
  const page = nb.pages[i], last = nb.pages.length - 1;
  popover({ x: e.clientX, y: e.clientY }, `<button data-act="bm">${page.bookmarked ? 'Quitar de marcadores' : 'Guardar en marcadores'}</button>
    <button data-act="outline">Añadir al esquema…</button><hr><button data-act="dup">${icon('copy')}Duplicar</button>
    <button data-act="first" ${i === 0 ? 'disabled' : ''}>${icon('arrowUp')}Mover al principio</button>
    ${full ? `<button data-act="prev" ${i === 0 ? 'disabled' : ''}>Mover antes</button><button data-act="next" ${i === last ? 'disabled' : ''}>Mover después</button>` : ''}
    <button data-act="last" ${i === last ? 'disabled' : ''}>${icon('arrowDown')}Mover al final</button><hr>
    <button data-act="del" class="danger" ${nb.pages.length < 2 ? 'disabled' : ''}>${icon('trash')}Eliminar…</button>`, (act) => {
    if (act === 'bm') { toggleBookmark(page); renderPagesWindow(); }
    if (act === 'outline') promptDialog('Añadir al esquema', `Página ${i + 1}`, (title) => addOutline(nb, page, title), 'Título del apartado');
    if (act === 'dup') duplicatePage(nb, i);
    if (act === 'first') movePage(nb, i, 0);
    if (act === 'prev') movePage(nb, i, i - 1);
    if (act === 'next') movePage(nb, i, i + 1);
    if (act === 'last') movePage(nb, i, last);
    if (act === 'del') deletePage(nb, i);
  });
}

// ---------- Ventana «Páginas» (botón de la cuadrícula, arriba a la derecha) ----------
function openPagesWindow() {
  const nb = activeNb();
  if (!nb) return;
  updateCurrentPage();
  const scrim = dialog(`<div class="pw-head"><button class="btn tinted" data-act="add">${icon('plus')} Añadir página</button><h2>Páginas</h2><button class="btn primary" data-act="done">Listo</button></div>
    <p class="pw-hint">Arrastra una página para cambiarla de sitio. Clic para ir a ella; clic derecho para más opciones.</p>
    <div class="pw-grid" id="pw-grid"></div>`, (act, b, close) => {
    if (act === 'done') close();
    if (act === 'add') { close(); newPageDialog(); }
  }, true);
  scrim.querySelector('.dialog').classList.add('pages-window');
  const grid = scrim.querySelector('#pw-grid');
  grid.addEventListener('click', (e) => {
    const bm = e.target.closest('[data-bm]');
    if (bm) { toggleBookmark(nb.pages.find((p) => p.id === bm.dataset.bm)); return renderPagesWindow(); }
    const t = e.target.closest('[data-go]');
    if (t) { scrim.remove(); scrollToPage(t.dataset.go); }
  });
  grid.addEventListener('contextmenu', (e) => { const t = e.target.closest('[data-index]'); if (t) pageContextMenu(e, nb, Number(t.dataset.index), { full: true }); });
  liveReorder(grid, '.pw-page', { onDrop: (from, to) => movePage(nb, from, to), scroller: scrim.querySelector('.dialog') });
  renderPagesWindow();
}
function renderPagesWindow() {
  const grid = $('#pw-grid'), nb = activeNb();
  if (!grid || !nb) return;
  grid.innerHTML = nb.pages.map((p, i) => `<div class="pw-page ${i === currentPageIndex ? 'current' : ''}" data-index="${i}" data-go="${p.id}" role="button" aria-label="Página ${i + 1}">
    <div class="pw-thumb">${thumbImg(p)}
    <button class="bm" data-bm="${p.id}" aria-pressed="${!!p.bookmarked}" aria-label="${p.bookmarked ? 'Quitar de marcadores' : 'Guardar en marcadores'}">${icon(p.bookmarked ? 'bookmarkFill' : 'bookmark')}</button></div>
    <span class="num">${i + 1}</span></div>`).join('');
  loadThumbs(grid, nb);
}

// =============================================================================
// Grabaciones y notas de voz (como en la app nativa). El audio se guarda en IndexedDB, aparte de
// la libreta, por el id de la grabación: una libreta duplicada o una nota copiada a otra libreta
// comparten el mismo audio, que solo se borra cuando ya no lo usa ninguna.
// =============================================================================
const VOICE_SIZE = { w: 220, h: 48 };

const Voice = {
  rec: null, // grabando: { nbId, start, recorder, stream, chunks, timer }
  player: null, // reproduciendo: { recId, audio, url }
  raf: 0,

  recordings(nb) { return (nb.recordings = nb.recordings || []); },
  find(nb, id) { return this.recordings(nb).find((r) => r.id === id); },
  title(r) {
    if (r?.title && r.title.trim()) return r.title;
    return tr('Nota de voz') + ' · ' + new Date(r.start).toLocaleString(LOCALE(), { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  },
  format(s) { s = Math.max(0, Math.round(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; },
  placedCount(nb, id) { return nb.pages.reduce((n, p) => n + p.items.filter((i) => i.type === 'voice' && i.rec === id).length, 0); },

  // ---------- Grabar ----------
  async toggleRecording() {
    if (this.rec) return this.stop();
    const nb = activeNb();
    if (!nb) return;
    if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') return toast('Este navegador no deja grabar audio.');
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) {
      return dialog(`<h2>Sin acceso al micrófono</h2><p>Para grabar, deja que esta página use el micrófono: pulsa el icono del candado o de la cámara en la barra de direcciones y permite «Micrófono».</p><div class="actions"><button class="btn primary" data-act="ok">Aceptar</button></div>`, (a, b, close) => close());
    }
    const mime = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/webm'].find((m) => MediaRecorder.isTypeSupported?.(m)) || '';
    const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    const rec = { nbId: nb.id, start: Date.now(), recorder, stream, chunks: [] };
    recorder.ondataavailable = (e) => { if (e.data.size) rec.chunks.push(e.data); };
    recorder.onstop = () => this.saved(rec);
    recorder.start(1000);
    this.rec = rec;
    rec.timer = setInterval(() => this.renderButton(), 500);
    this.renderButton();
  },
  stop() {
    const rec = this.rec;
    if (!rec) return;
    this.rec = null;
    clearInterval(rec.timer);
    rec.duration = (Date.now() - rec.start) / 1000;
    try { rec.recorder.stop(); } catch (e) { this.saved(rec); }
    rec.stream.getTracks().forEach((t) => t.stop());
    this.renderButton();
  },
  async saved(rec) {
    const nb = nbById(rec.nbId);
    if (!nb || !rec.chunks.length) return;
    const blob = new Blob(rec.chunks, { type: rec.recorder.mimeType || 'audio/webm' });
    const r = { id: uid(), start: rec.start, duration: rec.duration || (Date.now() - rec.start) / 1000, title: null };
    await Store.putAudio(r.id, blob);
    this.recordings(nb).push(r);
    touch(nb); Store.put(nb);
    this.renderButton();
    toast(`Grabación guardada (${this.format(r.duration)}). Está en el menú del micrófono › Grabaciones.`);
  },

  // ---------- Botón del micrófono ----------
  buttonHTML() {
    const elapsed = this.rec ? this.format((Date.now() - this.rec.start) / 1000) : '';
    return `<div class="mic-pill ${this.rec ? 'recording' : ''}">
      <button class="icon-btn mic-main" data-mic="toggle" aria-label="${this.rec ? 'Detener grabación' : 'Grabar audio'}" title="${this.rec ? 'Detener grabación' : 'Grabar audio'} ${Shortcuts.bindings('record')[0] ? ` (${Shortcuts.display(Shortcuts.bindings('record')[0])})` : ''}">
        ${this.rec ? `<span class="rec-dot"></span><span class="rec-time">${elapsed}</span>` : icon('mic')}</button>
      <button class="icon-btn mic-more" data-mic="menu" aria-label="Grabaciones y notas de voz" aria-haspopup="menu" title="Grabaciones y notas de voz">${icon('chevronDown')}</button></div>`;
  },
  renderButton() {
    const slot = $('#mic-slot');
    if (slot) slot.innerHTML = this.buttonHTML();
  },
  menu(anchor) {
    const nb = activeNb();
    if (!nb) return;
    const list = this.recordings(nb), last = list[list.length - 1];
    popover(anchor, `<button data-act="toggle">${icon(this.rec ? 'stop' : 'mic')}${this.rec ? 'Detener grabación' : 'Grabar audio'}</button>
      <button data-act="list" ${list.length ? '' : 'disabled'}>${icon('waveform')}Grabaciones (${list.length})</button>
      ${last ? `<button data-act="last">${icon('waveformPlus')}Poner la última grabación en la página</button>` : ''}<hr>
      <button data-act="show" role="menuitemcheckbox" aria-checked="${S.showVoiceNotes}">${S.showVoiceNotes ? icon('check') : '<span class="menu-spacer"></span>'}Mostrar notas de voz en la página</button>`, (act) => {
      if (act === 'toggle') this.toggleRecording();
      if (act === 'list') this.listDialog();
      if (act === 'last') this.place(nb, last.id);
      if (act === 'show') this.setShown(!S.showVoiceNotes);
    });
  },
  setShown(on) {
    S.showVoiceNotes = on;
    savePrefs();
    document.getElementById('app')?.classList.toggle('hide-voice', !on);
    if (!on && S.selected) { const f = findItem(S.selected); if (f?.item.type === 'voice') { S.selected = null; renderOptions(); } }
    toast(on ? 'Notas de voz visibles' : 'Notas de voz ocultas');
  },

  // ---------- Notas de voz en la página ----------
  place(nb, recId, at) {
    updateCurrentPage();
    const page = at?.page || nb.pages[currentPageIndex] || nb.pages[0];
    const v = views.get(page.id), desk = $('#desk');
    const cx = at ? at.x : page.w / 2;
    const cy = at ? at.y : v && desk ? (desk.scrollTop + desk.clientHeight / 2 - v.wrap.offsetTop) / S.zoom : page.h / 2;
    const item = { id: uid(), type: 'voice', rec: recId, w: VOICE_SIZE.w, h: VOICE_SIZE.h,
      x: Math.min(Math.max(0, cx - VOICE_SIZE.w / 2), page.w - VOICE_SIZE.w), y: Math.min(Math.max(0, cy - VOICE_SIZE.h / 2), page.h - VOICE_SIZE.h) };
    const before = snapshotPage(page);
    page.items.push(item);
    commit(page, before);
    if (!S.showVoiceNotes) this.setShown(true);
    if (INK_TOOLS.includes(S.tool)) setTool('select');
    renderItems(page);
    select({ pageId: page.id, itemId: item.id });
    return item;
  },
  noteHTML(nb, item) {
    const r = nb && this.find(nb, item.rec);
    const playing = this.player?.recId === item.rec && !this.player.audio.paused;
    const progress = this.player?.recId === item.rec && r ? this.player.audio.currentTime / Math.max(r.duration, 0.1) : 0;
    const time = !r ? '' : progress > 0 || playing ? `${this.format(r.duration * progress)} / ${this.format(r.duration)}` : this.format(r.duration);
    return `<span class="vplay">${icon(playing ? 'pause' : 'play')}</span><span class="vtitle" ${r?.title ? 'translate="no"' : ''}>${esc(r ? this.title(r) : 'Grabación borrada')}</span>
      <span class="vtime">${time}</span><span class="vprog" style="width:${Math.min(Math.max(progress, 0), 1) * 100}%;${progress > 0 ? '' : 'display:none'}"></span>`;
  },
  refreshNotes(recId) {
    const nb = activeNb();
    for (const el of $$(`.item.voice[data-rec="${recId}"]`)) {
      const page = nb?.pages.find((p) => p.items.some((i) => i.id === el.dataset.id));
      const item = page?.items.find((i) => i.id === el.dataset.id);
      if (!item) continue;
      const handle = el.querySelector('.resize');
      el.innerHTML = this.noteHTML(nb, item);
      if (handle) el.appendChild(handle);
    }
  },

  // ---------- Reproducir ----------
  async togglePlay(nb, recId) {
    if (this.player?.recId === recId) {
      const a = this.player.audio;
      if (a.paused) { if (a.ended) a.currentTime = 0; await a.play().catch(() => {}); } else a.pause();
      return this.update();
    }
    this.stopPlayback();
    const blob = await Store.getAudio(recId);
    if (!blob) return toast('No se encuentra el audio de esta grabación.');
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    this.player = { recId, audio, url, nbId: nb.id };
    audio.onplay = audio.onpause = audio.onended = () => this.update();
    try { await audio.play(); } catch (e) { toast('No se ha podido reproducir.'); }
    this.update();
  },
  stopPlayback() {
    const p = this.player;
    if (!p) return;
    this.player = null;
    p.audio.pause();
    URL.revokeObjectURL(p.url);
    cancelAnimationFrame(this.raf);
    this.refreshNotes(p.recId);
    $('#playback-bar')?.remove();
  },
  update() {
    const p = this.player;
    if (!p) return;
    const nb = nbById(p.nbId), r = nb && this.find(nb, p.recId);
    this.refreshNotes(p.recId);
    this.renderBar(r);
    cancelAnimationFrame(this.raf);
    if (!p.audio.paused) this.raf = requestAnimationFrame(() => this.update());
  },
  renderBar(r) {
    const p = this.player, host = $('.desk-wrap');
    if (!host) return;
    if (!p || !r || S.view !== 'editor') return $('#playback-bar')?.remove();
    let bar = $('#playback-bar');
    const total = Number.isFinite(p.audio.duration) ? p.audio.duration : r.duration;
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'playback-bar';
      bar.className = 'playback-bar';
      bar.innerHTML = `<button class="icon-btn" data-pb="play"></button><span class="pb-cur"></span>
        <input type="range" min="0" step="0.01" aria-label="Posición"><span class="pb-total"></span>
        <button class="icon-btn" data-pb="close" aria-label="Cerrar">${icon('close')}</button>`;
      host.appendChild(bar);
      bar.addEventListener('click', (e) => {
        const b = e.target.closest('[data-pb]');
        if (b?.dataset.pb === 'play') this.togglePlay(nbById(this.player.nbId), this.player.recId);
        if (b?.dataset.pb === 'close') this.stopPlayback();
      });
      bar.querySelector('input').addEventListener('input', (e) => { if (this.player) { this.player.audio.currentTime = Number(e.target.value); this.update(); } });
    }
    bar.title = this.title(r);
    const playing = !p.audio.paused;
    const pb = bar.querySelector('[data-pb="play"]');
    if (pb.dataset.state !== String(playing)) { pb.dataset.state = playing; pb.innerHTML = icon(playing ? 'pause' : 'play'); pb.setAttribute('aria-label', playing ? 'Pausa' : 'Reproducir'); }
    const range = bar.querySelector('input');
    range.max = total; if (document.activeElement !== range) range.value = p.audio.currentTime;
    bar.querySelector('.pb-cur').textContent = this.format(p.audio.currentTime);
    bar.querySelector('.pb-total').textContent = this.format(total);
  },

  // ---------- Ventana «Grabaciones» ----------
  listDialog() {
    const nb = activeNb();
    if (!nb) return;
    const scrim = dialog(`<div class="pw-head"><span></span><h2>Grabaciones</h2><button class="btn primary" data-act="done">Listo</button></div>
      <div class="rec-list" id="rec-list"></div>
      <p class="rec-foot">«Añadir a la página» la pone como nota de voz donde estés; arrástrala adonde quieras. Con clic derecho (o ⋯) puedes renombrarla o copiarla a otra libreta.</p>`,
    (act, b, close) => { if (act === 'done') close(); }, false);
    scrim.querySelector('.dialog').classList.add('recordings-window');
    const list = scrim.querySelector('#rec-list');
    const render = () => {
      const recs = this.recordings(nb);
      list.innerHTML = recs.length ? recs.map((r) => {
        const n = this.placedCount(nb, r.id), playing = this.player?.recId === r.id && !this.player.audio.paused;
        return `<div class="rec-row" data-rec="${r.id}">
          <button class="rec-play" data-r="play" aria-label="${playing ? 'Pausa' : 'Reproducir'}">${icon(playing ? 'pause' : 'play')}</button>
          <div class="rec-text"><b ${r.title ? 'translate="no"' : ''}>${esc(this.title(r))}</b><span>${this.format(r.duration)}${n ? ` · en la libreta ${n === 1 ? '1 vez' : `${n} veces`}` : ''}</span></div>
          <button class="btn tinted" data-r="place">${icon('waveformPlus')} Añadir a la página</button>
          <button class="icon-btn" data-r="more" aria-label="Más opciones">${icon('more')}</button></div>`;
      }).join('') : `<div class="empty-state">${icon('waveform')}<b>Sin grabaciones</b><span>Pulsa el micrófono para grabar mientras tomas apuntes.</span></div>`;
    };
    const more = (anchor, r) => {
      const others = S.notebooks.filter((n) => n.id !== nb.id);
      popover(anchor, `<button data-act="place">${icon('waveformPlus')}Añadir a la página</button><button data-act="rename">${icon('rename')}Renombrar…</button>
        <button data-act="copy" ${others.length ? '' : 'disabled'}>${icon('copy')}Copiar a otra libreta…</button><hr>
        <button data-act="del" class="danger">${icon('trash')}Eliminar</button>`, (act) => {
        if (act === 'place') { scrim.remove(); this.place(nb, r.id); }
        if (act === 'rename') promptDialog('Nombre de la nota de voz', r.title || '', (t) => { r.title = t.trim() || null; touch(nb); Store.put(nb); render(); this.refreshNotes(r.id); });
        if (act === 'copy') popover(anchor, `<div class="label">Copiar a…</div>${others.map((o) => `<button data-act="${o.id}">${esc(o.title)}</button>`).join('')}`, (id) => {
          const target = nbById(id);
          this.copyTo(nb, r, target);
          toast(`Copiada a «${target.title}», en su primera página.`);
          render();
        });
        if (act === 'del') confirmDialog('¿Eliminar la grabación?', 'Se borra el audio y sus notas de voz en las páginas. No se puede deshacer.', 'Eliminar', () => { this.remove(nb, r.id); render(); });
      });
    };
    list.addEventListener('click', (e) => {
      const b = e.target.closest('[data-r]'), row = e.target.closest('[data-rec]');
      if (!b || !row) return;
      const r = this.find(nb, row.dataset.rec);
      if (b.dataset.r === 'play') this.togglePlay(nb, r.id).then(render);
      if (b.dataset.r === 'place') { scrim.remove(); this.place(nb, r.id); }
      if (b.dataset.r === 'more') more(b, r);
    });
    list.addEventListener('contextmenu', (e) => {
      const row = e.target.closest('[data-rec]');
      if (!row) return;
      e.preventDefault();
      more({ x: e.clientX, y: e.clientY }, this.find(nb, row.dataset.rec));
    });
    render();
  },
  /** Añade a `target` la grabación (si no la tenía) y la pone como nota de voz en su primera página. */
  copyTo(from, r, target) {
    this.receive(target, r);
    const page = target.pages[0];
    page.items.push({ id: uid(), type: 'voice', rec: r.id, w: VOICE_SIZE.w, h: VOICE_SIZE.h, x: 40, y: 40 });
    touch(target); Store.put(target);
    if (S.active === target.id) renderItems(page);
  },
  receive(target, r) {
    if (!this.find(target, r.id)) { this.recordings(target).push(clone(r)); touch(target); Store.put(target); }
  },
  remove(nb, id) {
    if (this.player?.recId === id) this.stopPlayback();
    nb.recordings = this.recordings(nb).filter((r) => r.id !== id);
    for (const page of nb.pages) {
      if (!page.items.some((i) => i.type === 'voice' && i.rec === id)) continue;
      page.items = page.items.filter((i) => !(i.type === 'voice' && i.rec === id));
      if (views.has(page.id)) renderItems(page);
    }
    if (S.selected && !findItem(S.selected)) { S.selected = null; renderOptions(); }
    touch(nb); Store.put(nb);
    this.forgetIfUnused(id);
  },
  /** Borra el audio si ya no lo usa ninguna libreta. */
  forgetIfUnused(id) {
    if (!S.notebooks.some((n) => (n.recordings || []).some((r) => r.id === id))) Store.removeAudio(id);
  },
};

// =============================================================================
// Texto de los PDF: seleccionarlo con la herramienta de seleccionar (arrastrando, o doble clic
// para una palabra) y subrayarlo, rayarlo, tacharlo o copiarlo (como en la app nativa).
// Al importar se guarda dónde está cada trozo de texto (page.pdfRuns: {s, x, y, w, h} en
// coordenadas de la página); la posición de cada letra se calcula al usarlo.
// =============================================================================

/** Trozos de texto de una página de PDF (pdf.js), en coordenadas de la página de Folia. */
async function pdfTextRuns(pdfPage, viewport) {
  const content = await pdfPage.getTextContent();
  const runs = [];
  for (const it of content.items) {
    if (!it.str || !it.str.trim()) continue;
    const tx = pdfjsLib.Util.transform(viewport.transform, it.transform);
    const fh = Math.hypot(tx[2], tx[3]);
    if (!fh || Math.abs(tx[1]) > fh * 0.02) continue; // texto girado: no se puede seleccionar
    const w = it.width * viewport.scale;
    if (!(w > 0)) continue;
    const r1 = (n) => Math.round(n * 10) / 10;
    const family = content.styles?.[it.fontName]?.fontFamily || '';
    const f = /mono/i.test(family) ? 'm' : /sans/i.test(family) ? 's' : /serif/i.test(family) ? 'r' : 's';
    runs.push({ s: it.str, x: r1(tx[4]), y: r1(tx[5] - fh * 0.8), w: r1(w), h: r1(fh * 1.02), f });
  }
  return runs;
}

const PdfText = {
  cache: new WeakMap(),
  sel: null, // { page, a, b } posiciones de cursor (entre letras)

  /** Letras de la página en orden de lectura, con su caja. */
  chars(page) {
    if (!page.pdfRuns?.length) return null;
    let c = this.cache.get(page);
    if (c && c.runs === page.pdfRuns) return c.chars;
    const ctx = document.createElement('canvas').getContext('2d');
    const fonts = { s: '100px Helvetica, Arial, sans-serif', r: '100px "Times New Roman", Times, serif', m: '100px Menlo, Consolas, monospace' };
    const chars = [];
    page.pdfRuns.forEach((run, ri) => {
      ctx.font = fonts[run.f] || fonts.s;
      const letters = [...run.s];
      const widths = letters.map((ch) => ctx.measureText(ch).width || 50);
      const total = widths.reduce((a, b) => a + b, 0) || 1;
      let x = run.x;
      letters.forEach((ch, i) => {
        const w = (widths[i] / total) * run.w;
        chars.push({ ch, run: ri, x0: x, x1: x + w, y: run.y, h: run.h });
        x += w;
      });
    });
    this.cache.set(page, { runs: page.pdfRuns, chars });
    return chars;
  },
  hasText(page, pt, margin = 6) {
    const chars = this.chars(page);
    return !!chars && chars.some((c) => pt.x >= c.x0 - margin && pt.x <= c.x1 + margin && pt.y >= c.y - margin && pt.y <= c.y + c.h + margin);
  },
  /** Posición de cursor más cercana a un punto (0…número de letras). */
  caretAt(page, pt) {
    const chars = this.chars(page);
    let best = 0, bestD = Infinity;
    chars.forEach((c, i) => {
      const dx = pt.x < c.x0 ? c.x0 - pt.x : pt.x > c.x1 ? pt.x - c.x1 : 0;
      const dy = pt.y < c.y ? c.y - pt.y : pt.y > c.y + c.h ? pt.y - (c.y + c.h) : 0;
      const d = dy * 4 + dx;
      if (d < bestD) { bestD = d; best = i; }
    });
    const c = chars[best];
    return pt.x > (c.x0 + c.x1) / 2 ? best + 1 : best;
  },
  wordAt(page, pt) {
    const chars = this.chars(page);
    let i = Math.min(this.caretAt(page, pt), chars.length - 1);
    const c = chars[i];
    if (pt.x < c.x0 && i > 0 && chars[i - 1].run === c.run) i--; // el cursor cayó justo detrás
    const isWord = (k) => chars[k] && chars[k].run === chars[i].run && /[\p{L}\p{N}_'’-]/u.test(chars[k].ch);
    if (!isWord(i)) return { a: i, b: i + 1 };
    let a = i, b = i + 1;
    while (isWord(a - 1)) a--;
    while (isWord(b)) b++;
    return { a, b };
  },
  /** Rectángulos por renglón de lo seleccionado. */
  lineRects(page, a, b) {
    const chars = this.chars(page).slice(Math.min(a, b), Math.max(a, b));
    const rects = [];
    for (const c of chars) {
      if (!c.ch.trim() && !rects.length) continue;
      const last = rects[rects.length - 1];
      const sameLine = last && Math.abs(last.y + last.h / 2 - (c.y + c.h / 2)) < Math.min(last.h, c.h) * 0.5 && c.x0 >= last.x1 - 2 && c.x0 - last.x1 < c.h * 1.5;
      if (sameLine) {
        last.x1 = Math.max(last.x1, c.x1);
        const top = Math.min(last.y, c.y), bottom = Math.max(last.y + last.h, c.y + c.h);
        last.y = top; last.h = bottom - top;
      } else rects.push({ x0: c.x0, x1: c.x1, y: c.y, h: c.h });
    }
    // Sin espacios colgando al final de cada renglón.
    return rects.filter((r) => r.x1 - r.x0 > 0.5);
  },
  text(page, a, b) {
    const chars = this.chars(page).slice(Math.min(a, b), Math.max(a, b));
    let out = '';
    chars.forEach((c, i) => {
      const prev = chars[i - 1];
      if (prev && prev.run !== c.run) {
        const newLine = Math.abs(prev.y - c.y) > Math.min(prev.h, c.h) * 0.5;
        if (newLine) out = out.replace(/-$/, '') + (out.endsWith('-') ? '' : '\n');
        else if (c.x0 - prev.x1 > c.h * 0.15 && !out.endsWith(' ') && c.ch !== ' ') out += ' ';
      }
      out += c.ch;
    });
    return out.replace(/[ \t]+\n/g, '\n').trim();
  },

  // ---------- Ratón ----------
  /** Empieza a seleccionar si el clic cae sobre texto del PDF. Devuelve true si lo gestiona. */
  begin(e, page, v) {
    if (!page.pdfRuns?.length || (e.button !== 0 && e.pointerType === 'mouse')) return false;
    const r = v.items.getBoundingClientRect();
    const at = (ev) => ({ x: (ev.clientX - r.left) / S.zoom, y: (ev.clientY - r.top) / S.zoom });
    const p0 = at(e);
    if (!this.hasText(page, p0)) { this.clear(); return false; }
    e.preventDefault();
    const now = performance.now(), last = this.lastDown;
    const double = last && now - last.t < 450 && Math.hypot(e.clientX - last.x, e.clientY - last.y) < 6;
    this.lastDown = double ? null : { t: now, x: e.clientX, y: e.clientY };
    const word = double ? this.wordAt(page, p0) : null;
    const anchor = word ? word.a : this.caretAt(page, p0);
    this.show(page, anchor, word ? word.b : anchor, false);
    const move = (ev) => {
      const p = at(ev);
      if (word) {
        const w = this.wordAt(page, p);
        this.show(page, Math.min(word.a, w.a), Math.max(word.b, w.b), false);
      } else this.show(page, anchor, this.caretAt(page, p), false);
    };
    const up = () => {
      removeEventListener('pointermove', move);
      removeEventListener('pointerup', up);
      if (this.sel && this.sel.a !== this.sel.b) this.show(page, this.sel.a, this.sel.b, true);
      else this.clear();
    };
    addEventListener('pointermove', move);
    addEventListener('pointerup', up);
    return true;
  },

  // ---------- Selección y panel ----------
  show(page, a, b, panel) {
    this.sel = { page, a: Math.min(a, b), b: Math.max(a, b) };
    const v = views.get(page.id);
    if (!v) return;
    $$('.pdf-sel').forEach((x) => { if (x.parentElement !== v.over) x.remove(); });
    let layer = v.over.querySelector('.pdf-sel');
    if (!layer) { layer = document.createElement('div'); layer.className = 'pdf-sel'; v.over.appendChild(layer); }
    layer.innerHTML = this.lineRects(page, a, b).map((q) => `<i style="left:${q.x0}px;top:${q.y}px;width:${q.x1 - q.x0}px;height:${q.h}px"></i>`).join('');
    if (panel) this.panel(); else $('#pdf-panel')?.remove();
  },
  clear() {
    this.sel = null;
    $$('.pdf-sel').forEach((x) => x.remove());
    $('#pdf-panel')?.remove();
  },
  panel() {
    $('#pdf-panel')?.remove();
    const first = $('.pdf-sel i');
    if (!first) return;
    const el = document.createElement('div');
    el.id = 'pdf-panel';
    el.className = 'pdf-panel';
    el.setAttribute('role', 'toolbar');
    el.setAttribute('aria-label', 'Texto del PDF');
    el.innerHTML = `<span class="pp-icon" aria-hidden="true">${icon('highlighter')}</span>
      ${HL_COLORS.map((c) => `<button class="swatch" data-pp="hl" data-c="${c}" style="background:${c}" aria-label="Subrayar" title="Subrayar"></button>`).join('')}
      <span class="sep"></span>
      <button class="icon-btn" data-pp="underline" aria-label="Subrayar con línea" title="Subrayar con línea">${icon('underline')}</button>
      <button class="icon-btn" data-pp="strike" aria-label="Tachar" title="Tachar">${icon('strike')}</button>
      <button class="icon-btn" data-pp="copy" aria-label="Copiar texto" title="Copiar texto">${icon('copy')}</button>`;
    document.body.appendChild(el);
    el.addEventListener('pointerdown', (e) => e.stopPropagation());
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-pp]');
      if (!b) return;
      if (b.dataset.pp === 'copy') this.copy();
      else this.apply(b.dataset.pp, b.dataset.c);
    });
    this.place();
  },
  place() {
    const el = $('#pdf-panel'), rects = $$('.pdf-sel i');
    if (!el || !rects.length) return;
    const top = rects[0].getBoundingClientRect(), bottom = rects[rects.length - 1].getBoundingClientRect();
    const xs = rects.map((r) => r.getBoundingClientRect());
    const cx = (Math.min(...xs.map((r) => r.left)) + Math.max(...xs.map((r) => r.right))) / 2;
    const w = el.offsetWidth, h = el.offsetHeight;
    let y = top.top - h - 10;
    if (y < 120) y = bottom.bottom + 10;
    el.style.left = `${Math.min(Math.max(8, cx - w / 2), innerWidth - w - 8)}px`;
    el.style.top = `${Math.min(y, innerHeight - h - 8)}px`;
  },
  /** Trazos que marcan la selección (como los haría el subrayador o el bolígrafo). */
  strokesFor(page, a, b, style, color) {
    return this.lineRects(page, a, b).map((q) => {
      const h = q.h;
      if (style === 'hl') {
        const width = Math.round(h * 0.95 * 10) / 10, inset = width / 4;
        const pts = Shapes.densify([[q.x0 + inset, q.y + h / 2], [Math.max(q.x0 + inset, q.x1 - inset), q.y + h / 2]]);
        return { id: uid(), tool: 'highlighter', kind: 'pen', color, width, points: pts.map(([x, y]) => [Math.round(x * 10) / 10, Math.round(y * 10) / 10, 0.5]) };
      }
      const y = q.y + (style === 'underline' ? h * 0.9 : h * 0.55);
      const width = Math.max(1.5, h * 0.08);
      const pts = Shapes.densify([[q.x0 - 1, y], [q.x1 + 1, y]]);
      return { id: uid(), tool: 'pen', kind: 'pen', color, width, points: pts.map(([x, yy]) => [Math.round(x * 10) / 10, Math.round(yy * 10) / 10, 0.5]) };
    });
  },
  apply(style, color) {
    const s = this.sel;
    if (!s) return;
    const page = s.page, before = snapshotPage(page);
    page.strokes.push(...this.strokesFor(page, s.a, s.b, style, color || S.penColor));
    commit(page, before);
    renderInk(page);
    this.clear();
  },
  copy() {
    const s = this.sel;
    if (!s) return;
    const text = this.text(s.page, s.a, s.b);
    navigator.clipboard?.writeText?.(text).catch(() => {});
    this.lastCopied = text;
    toast('Texto copiado');
    this.clear();
  },
};

// =============================================================================
// Editor: pestañas, barra lateral, páginas, herramientas y elementos
// =============================================================================
const views = new Map();   // pageId -> vistas DOM de la página
let currentPageIndex = 0;
let resumePageId = null;   // página con la cinta «aquí lo dejaste»

// Como en la app nativa: P bolígrafo, H subrayador, E goma, L lazo, T texto, N post-it, C comentario, K enlace, V seleccionar.
const TOOLS = [
  ['pen', 'Bolígrafo (P)', 'p'], ['highlighter', 'Subrayador (H)', 'h'], ['eraser', 'Goma (E)', 'e'], ['lasso', 'Lazo (L)', 'l'],
  ['text', 'Texto (T)', 't'], ['sticky', 'Post-it (N)', 'n'], ['comment', 'Comentario (C)', 'c'], ['link', 'Enlace (K)', 'k'], ['select', 'Seleccionar (V)', 'v'],
];
const INK_TOOLS = ['pen', 'highlighter', 'eraser', 'lasso'];
const RICH_TYPES = ['text', 'sticky', 'comment'];

// ---------- Abrir, cerrar y pestañas ----------
function openNotebook(id, opts = {}) {
  const nb = nbById(id);
  if (!nb) return;
  stopDynamic();

    const color = g.color;

    if (!S.reading || !e.target.closest('.page') || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const hit = e.target.closest('.item.voice, .item.link, .pin, a[data-link]');
    e.stopPropagation();
    const mouse = e.pointerType === 'mouse';
    if (mouse && !e.target.closest('a[data-link]')) e.preventDefault();
    const start = { x: e.clientX, y: e.clientY, top: desk.scrollTop, left: desk.scrollLeft };
    let moved = false;
    const move = (ev) => {
      if (Math.hypot(ev.clientX - start.x, ev.clientY - start.y) > 4) moved = true;
      if (!mouse || !moved) return;

      const page = nb.pages.find((p) => p.items.some((i) => i.id === id)), item = page?.items.find((i) => i.id === id);
      if (!item) return;
      if (item.type === 'voice') Voice.togglePlay(nb, item.rec);
      if (item.type === 'link' && item.target) showLinkPreview(item.target, { item, page });

/** Arrastrar mueve el elemento. Escribiendo en un texto, se arrastra desde su borde. */
function onItemPointerDown(e, page, item, el) {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  const onResize = e.target.classList.contains('resize');
  const inRich = e.target.closest('.rich') && e.target.closest('.rich').isContentEditable;
  if (inRich && !onResize) return; // clic dentro del texto: colocar el cursor
  e.preventDefault();
  e.stopPropagation();
  clearLasso();
  if (S.editing && S.editing.itemId !== item.id) stopEditing();
  const wasSelected = S.selected?.itemId === item.id;
  select({ pageId: page.id, itemId: item.id }, false);
  const before = snapshotPage(page);
  const start = { x: e.clientX, y: e.clientY, ix: item.x, iy: item.y, w: item.w, h: item.h };
  let moved = false;
  const move = (ev) => {
    const dx = (ev.clientX - start.x) / S.zoom, dy = (ev.clientY - start.y) / S.zoom;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    if (!moved) return;
    if (onResize) {
      item.w = Math.max(40, start.w + dx);
      if (item.type === 'image') item.h = item.w * (start.h / start.w);
      else if (item.h) item.h = Math.max(40, start.h + dy);
      el.style.width = item.w + 'px';
      if (item.h && item.type !== 'text') el.style.height = item.h + 'px';
    } else {
      item.x = Math.min(Math.max(-item.w + 30 || -10, start.ix + dx), page.w - 30);
      item.y = Math.min(Math.max(-10, start.iy + dy), page.h - 30);

    if (item.type === 'comment') return toggleComment({ page, item });
    if (item.type === 'voice') return Voice.togglePlay(activeNb(), item.rec);
    if (item.type === 'link' && (item.target ? !['select'].includes(S.tool) || wasSelected : false)) return showLinkPreview(item.target, { item, page });
    if (item.type === 'link' && !item.target) return linkPicker((target) => editItem({ page, item }, (it) => { it.target = target; }));
    if (RICH_TYPES.includes(item.type) && (S.tool === 'text' || S.tool === 'sticky' || wasSelected)) {
      if (S.tool === 'select') setTool(item.type === 'sticky' ? 'sticky' : 'text');
      const rich = richFor(page.id, item.id);

    }
  };

  addEventListener('pointerup', up);
}

    }

}
async function placeImageFile(file, at, remaining) {
  let img;

  const inline = !at && savedRange && S.editing && findItem(S.editing);
  const range = inline ? savedRange.cloneRange() : null;
  const edited = await cropImageDialog(img.src, { inline: !!inline, remaining });
  if (!edited) return;
  if (inline) {
    savedRange = range;
    if (restoreRange()) {
      const found = findItem(S.editing);
      if (found) {
        const before = snapshotPage(found.page);
        document.execCommand('insertImage', false, edited.src);
        syncRich(found);
        commit(found.page, before);

    }

  const w = Math.min(page.w, page.w * (edited.widthFraction || 0.5)), h = Math.min(page.h, w * edited.h / edited.w);

function linkPicker(onPick) {

    <div class="row"><button class="btn primary" data-go ${page ? '' : 'disabled'}>Ir →</button><span class="spacer"></span><button class="btn" data-edit>Cambiar</button><button class="btn danger" data-remove>Quitar</button></div>`;

// ---------- Deshacer y rehacer ----------
function snapshotPage(page) { return clone({ strokes: page.strokes, items: page.items, template: page.template, paper: page.paper }); }
function commit(page, before) {

  if (S.undo[nb.id].length > 150) S.undo[nb.id].shift();
  S.redo[nb.id] = [];
  page._v = (page._v || 0) + 1;
  touch(nb);

function restore(from, to) {

  const nb = activeNb();
  const entry = (from[nb.id] || []).pop();
  if (!entry) return;
  const page = nb.pages.find((p) => p.id === entry.pageId);
  if (!page) return;
  (to[nb.id] = to[nb.id] || []).push({ pageId: page.id, state: snapshotPage(page) });
  Object.assign(page, clone(entry.state));
  page._v = (page._v || 0) + 1;
  S.selected = S.editing = null;

const undo = () => restore(S.undo, S.redo);

    let key;
    if (/^Key[A-Z]$/.test(e.code) && (e.altKey || e.metaKey || e.ctrlKey)) key = e.code.slice(3).toLowerCase();
    else if (/^Digit\d$/.test(e.code) && (e.altKey || e.metaKey || e.ctrlKey)) key = e.code.slice(5);
    else key = { arrowleft: 'left', arrowright: 'right', arrowup: 'up', arrowdown: 'down' }[e.key.toLowerCase()] || e.key.toLowerCase();
    if (['shift', 'control', 'alt', 'meta', 'capslock', 'dead'].includes(key)) return null;
    // «?» y «+» ya llevan Mayús en el teclado: no cuenta como modificador.
    const shift = ['?', '+', '!', '¡', '¿'].includes(key) ? false : e.shiftKey;
    return { key, mod: IS_MAC ? e.metaKey : e.ctrlKey, shift, alt: e.altKey, ctrl: IS_MAC ? e.ctrlKey : false };
  },
  /** Combinaciones que el navegador no deja usar. */
  isReserved(b) {
    if (b.mod && !b.alt && ['w', 't', 'n', 'q', 'r', 'l', 'tab'].includes(b.key)) return true;
    if (b.mod && /^[1-9]$/.test(b.key) && !b.alt) return true;
    if (b.mod && b.shift && ['n', 't', 'r', 'i', 'j', 'c', 'w', 'q', 'delete'].includes(b.key)) return true;
    if (!IS_MAC && b.ctrl) return true;
    return ['f5', 'f11', 'f12'].includes(b.key);
  },
  isPlain: (b) => !b.mod && !b.alt && !b.ctrl,

  /** ¿Qué acción corresponde a esta pulsación ahora mismo? */
  match(e) {
    const binding = this.fromEvent(e);
    if (!binding) return null;
    const context = S.view === 'editor' ? 'editor' : 'library';
    for (const [id, , , where] of SHORTCUT_ACTIONS) {
      if (where !== 'both' && where !== context) continue;
      if (this.bindings(id).some((b) => this.same(b, binding))) return { id, binding };
    }
    return null;
  },

  perform(id) {
    const nb = activeNb();
    // En modo lectura no se escribe: las herramientas y la edición quedan en pausa.
    const editing = /^tool|^(insertImage|undo|redo|bold|italic|underline|strikethrough|biggerText|smallerText|newPage|record)$/;
    if (S.view === 'editor' && S.reading && editing.test(id)) return toast('Estás en modo lectura. Sal con el lápiz tachado de arriba para escribir.');
    const tools = { toolPen: 'pen', toolHighlighter: 'highlighter', toolEraser: 'eraser', toolLasso: 'lasso', toolText: 'text', toolSticky: 'sticky', toolComment: 'comment', toolLink: 'link', toolSelect: 'select' };
    if (tools[id]) return setTool(tools[id]);
    const tabIndex = S.tabs.indexOf(S.active);
    switch (id) {
      case 'insertImage': return $('#add-image')?.click();
      case 'closeTab': return S.active && closeTab(S.active);
      case 'nextTab': case 'previousTab':
        if (S.tabs.length > 1) openNotebook(S.tabs[(tabIndex + (id === 'nextTab' ? 1 : -1) + S.tabs.length) % S.tabs.length]);
        return;
      case 'lastTab': return S.tabs.length && openNotebook(S.tabs[S.tabs.length - 1]);
      case 'backToLibrary': return backToLibrary();
      case 'undo': return undo();
      case 'redo': return redo();
      case 'find': return S.view === 'editor' ? openSearchPanel() : $('#search')?.focus();
      case 'bold': return textStyle({ bold: true });
      case 'italic': return textStyle({ italic: true });
      case 'underline': return textStyle({ underline: true });
      case 'strikethrough': return textStyle({ strike: true });
      case 'biggerText': return textStyle({ size: 2 });
      case 'smallerText': return textStyle({ size: -2 });
      case 'newPage': return newPageDialog();
      case 'nextPage': case 'previousPage': {
        updateCurrentPage();
        const page = nb?.pages[currentPageIndex + (id === 'nextPage' ? 1 : -1)];
        return page && scrollToPage(page.id);
      }
      case 'pagesOverview': return $('#pages-btn')?.click();
      case 'bookmark': return $('#bm-btn')?.click();
      case 'share': return $('#share-btn')?.click();
      case 'toggleSidebar': return $('#side-btn')?.click();
      case 'timer':
        if (!Pomo.visible) { Pomo.visible = true; Pomo.changed(); }
        return $('#pomo-btn') && Pomo.openPanel($('#pomo-btn'));
      case 'record': return Voice.toggleRecording();
      case 'toggleVoiceNotes': return Voice.setShown(!S.showVoiceNotes);
      case 'readMode': return setReading(!activeNb()?.reading);
      case 'fullscreen': return toggleFullscreen();
      case 'newNotebook': return newNotebookDialog();
      case 'shortcutsSettings': return shortcutsDialog();
      default: {
        const n = /^tab(\d)$/.exec(id);
        if (n && S.tabs[Number(n[1]) - 1]) openNotebook(S.tabs[Number(n[1]) - 1]);
      }
    }
  },
};

document.addEventListener('keydown', (e) => {
  if (Shortcuts.recording || e.defaultPrevented || document.querySelector('.onb')) return; // durante el tutorial, nada
  const typing = typeof typingInField === 'function' && typingInField();
  const found = Shortcuts.match(e);
  if (!found) return;
  // Una tecla sola mientras se escribe es una letra, no un atajo.
  if (typing && Shortcuts.isPlain(found.binding)) return;
  // Con un diálogo abierto, solo los atajos de texto (que actúan sobre lo que se escribe).
  if (document.querySelector('.scrim') && found.id !== 'shortcutsSettings') return;
  e.preventDefault();
  Shortcuts.perform(found.id);
}, true);

/** «Atajos de teclado»: cambiar, añadir, quitar y volver a los de siempre. */
function shortcutsDialog() {
  if (document.querySelector('.shortcuts-dialog')) return;
  const row = (id) => {
    const a = SHORTCUT_BY_ID[id];
    return `<div class="sc-row"><span>${esc(a.title)}</span><span class="sc-keys">
      ${Shortcuts.bindings(id).map((b) => `<button class="sc-key" data-edit="${id}" data-b='${JSON.stringify(b)}' title="Cambiar (clic derecho para quitar)">${esc(Shortcuts.display(b))}</button>`).join('')}
      <button class="sc-add" data-add="${id}" title="Añadir otra combinación" aria-label="Añadir otra combinación para ${esc(a.title)}">${icon('plus')}</button>
      <button class="sc-reset" data-reset="${id}" ${Shortcuts.isDefault(id) ? 'hidden' : ''} title="Volver a ${esc(a.defaults.map((b) => Shortcuts.display(b)).join(' o '))}" aria-label="Restablecer">${icon('rotate')}</button></span></div>`;
  };
  const body = () => `<p class="sc-help">Haz clic en una combinación para cambiarla, en + para añadir otra y con clic derecho para quitarla. Las teclas solas (como H para el subrayador) no funcionan mientras escribes.${IS_MAC ? '' : ' En la web, las pestañas de Folia van con Alt porque Ctrl+W, Ctrl+T o Ctrl+1 son del navegador.'}</p>
    ${SHORTCUT_GROUPS.map((g) => `<h3>${g}</h3>${SHORTCUT_ACTIONS.filter((a) => a[1] === g).map((a) => row(a[0])).join('')}`).join('')}`;
  const scrim = dialog(`<h2>Atajos de teclado</h2><div class="sc-list">${body()}</div>
    <div class="actions"><button class="btn" data-act="reset-all">Restablecer todo</button><span class="spacer"></span><button class="btn primary" data-act="done">Listo</button></div>`, (act, b, close) => {
    if (act === 'done') close();
    if (act === 'reset-all') confirmDialog('¿Volver a los atajos de siempre?', 'Se perderán los cambios que hayas hecho.', 'Restablecer todo', () => { Shortcuts.resetAll(); refresh(); });
  }, true);
  scrim.querySelector('.dialog').classList.add('shortcuts-dialog');
  const list = scrim.querySelector('.sc-list');
  const refresh = () => { const top = list.scrollTop; list.innerHTML = body(); list.scrollTop = top; };
  const record = (id, old) => {
    Shortcuts.recording = true;
    const overlay = document.createElement('div');
    overlay.className = 'sc-recorder';
    overlay.innerHTML = `<div>${icon('keyboard')}<b>Pulsa la combinación para «${esc(SHORTCUT_BY_ID[id].title)}»</b><small>Esc para cancelar</small></div>`;
    document.body.appendChild(overlay);
    const finish = (message) => {
      Shortcuts.recording = false;
      removeEventListener('keydown', onKey, true);
      overlay.remove();
      refresh();
      if (message) toast(message);
    };
    const onKey = (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (e.key === 'Escape' && !e.shiftKey && !e.altKey && !e.metaKey && !e.ctrlKey) return finish();
      const binding = Shortcuts.fromEvent(e);
      if (!binding) return;
      if (Shortcuts.isReserved(binding)) return finish(`${Shortcuts.display(binding)} la usa el navegador; elige otra combinación.`);
      const previous = Shortcuts.assign(binding, id, old);
      finish(previous ? `${Shortcuts.display(binding)} ya no es «${SHORTCUT_BY_ID[previous].title}»: ahora es «${SHORTCUT_BY_ID[id].title}».` : null);
    };
    addEventListener('keydown', onKey, true);
    overlay.addEventListener('click', () => finish());
  };
  list.addEventListener('click', (e) => {
    const edit = e.target.closest('[data-edit]'), add = e.target.closest('[data-add]'), reset = e.target.closest('[data-reset]');
    if (edit) record(edit.dataset.edit, JSON.parse(edit.dataset.b));
    if (add) record(add.dataset.add, null);
    if (reset) { Shortcuts.reset(reset.dataset.reset); refresh(); }
  });
  list.addEventListener('contextmenu', (e) => {
    const edit = e.target.closest('[data-edit]');
    if (!edit) return;
    e.preventDefault();
    Shortcuts.remove(JSON.parse(edit.dataset.b), edit.dataset.edit);
    refresh();
  });
}
